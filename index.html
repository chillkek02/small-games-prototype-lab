<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081118">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Small Games Prototype Lab</title>
<style>html,body{margin:0;width:100%;height:100%;background:#071017;color:#eef8f5;font:800 14px system-ui,-apple-system,"Segoe UI",sans-serif}#boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}small{display:block;color:#8fa9aa;margin-top:8px;font-weight:600}</style>
</head>
<body><div id="boot">LOADING PROTOTYPE LAB…<small>Fetching latest catalog</small></div>
<script>
(async()=>{
  const cb=Date.now();
  try{
    const response=await fetch(`lab-shell.html?cb=${cb}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`Lab shell ${response.status}`);
    let source=await response.text();
    const close='</scr'+'ipt>';
    const needle='<script src="games.js">'+close;
    const replacement='<script src="games.js?cb='+cb+'">'+close;
    if(!source.includes(needle))throw new Error('Catalog script marker not found');
    source=source.replace(needle,replacement);
    document.open();document.write(source);document.close();
  }catch(error){
    console.error(error);
    document.getElementById('boot').innerHTML='PROTOTYPE LAB COULD NOT LOAD<small>'+String(error&&error.message||error)+' · Refresh to retry.</small>';
  }
})();
</script>
</body></html>
