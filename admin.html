<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081118"><meta name="robots" content="noindex,nofollow,noarchive"><title>Prototype Lab Reviews</title>
<style>html,body{margin:0;width:100%;height:100%;background:#071017;color:#eef8f5;font:800 14px system-ui,-apple-system,"Segoe UI",sans-serif}#boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}small{display:block;color:#8fa9aa;margin-top:8px}</style></head>
<body><div id="boot">LOADING REVIEW DASHBOARD…<small>Fetching latest catalog</small></div>
<script>
(async()=>{
  const cb=Date.now();
  try{
    const r=await fetch(`admin-shell.html?cb=${cb}`,{cache:'no-store'});
    if(!r.ok)throw new Error(`Admin shell ${r.status}`);
    let s=await r.text();
    const close='</scr'+'ipt>';
    const needle='<script src="games.js">'+close;
    const replacement='<script src="games.js?cb='+cb+'">'+close;
    if(!s.includes(needle))throw new Error('Catalog script marker not found');
    s=s.replace(needle,replacement);
    document.open();document.write(s);document.close();
  }catch(e){
    console.error(e);
    document.getElementById('boot').innerHTML='REVIEW DASHBOARD COULD NOT LOAD<small>'+String(e&&e.message||e)+'</small>';
  }
})();
</script></body></html>
