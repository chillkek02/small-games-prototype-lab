<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#050b12" />
<link rel="icon" href="data:," />
<title>Dead Orbit v8</title>
<style>
  :root{
    --bg:#050b12;
    --panel:#0c1823;
    --panel2:#112433;
    --ink:#eaf7ff;
    --muted:#7e9bac;
    --line:#234355;
    --power:#67d9ff;
    --oxygen:#79f0a5;
    --fuel:#ffb85c;
    --shield:#b28cff;
    --hull:#ff6b77;
    --accent:#ffe07a;
    --danger:#ff5267;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  }
  button{font:inherit;color:inherit;touch-action:manipulation}
  #app{
    position:fixed;inset:0;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 18%,#163348 0,#08131d 42%,#02060b 76%),
      linear-gradient(180deg,#06101a,#02060b);
  }
  #shell{
    position:relative;width:min(100vw,540px,calc(100vh * .5625));aspect-ratio:9/16;
    max-width:540px;max-height:960px;overflow:hidden;background:#050b12;
    box-shadow:0 0 0 1px #18394b,0 28px 100px #000c;border-radius:0;
  }
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}
  #scanlines{
    position:absolute;inset:0;z-index:18;pointer-events:none;opacity:.16;mix-blend-mode:screen;
    background:repeating-linear-gradient(180deg,transparent 0,transparent 3px,#9eeaff0c 4px,#0004 5px);
    animation:scanDrift 8s linear infinite;
  }
  #shell::after{content:"";position:absolute;inset:0;z-index:19;pointer-events:none;opacity:.22;mix-blend-mode:screen;
    background:radial-gradient(circle at 50% 45%,transparent 0 52%,#67d9ff08 74%,#0000 100%);animation:glassBreathe 5s ease-in-out infinite}
  @keyframes scanDrift{0%{background-position:0 0}100%{background-position:0 24px}}
  @keyframes glassBreathe{0%,100%{opacity:.14}50%{opacity:.28}}
  #topButtons{
    position:absolute;z-index:35;right:9px;top:9px;display:flex;gap:5px;
  }
  .iconBtn{
    min-width:35px;height:35px;padding:0 8px;border-radius:9px;border:1px solid #315466;
    background:linear-gradient(#142936,#09141d);box-shadow:inset 0 1px #ffffff12,0 4px 10px #0007;
    color:#b8d7e5;font-size:10px;font-weight:900;letter-spacing:.05em;
  }
  .iconBtn:active,.actionBtn:active,.devButton:active,.modalAction:active,.draftCard:active{transform:translateY(1px);filter:brightness(1.18)}
  #actionBar{
    position:absolute;z-index:32;left:12px;right:12px;bottom:11px;display:flex;gap:8px;align-items:stretch;
  }
  .actionBtn{
    min-height:74px;border-radius:15px;border:1px solid #3d6676;padding:9px 13px;
    background:linear-gradient(180deg,#1b485c,#0c2532);box-shadow:inset 0 2px #ffffff19,0 8px 20px #0009;
    font-size:18px;font-weight:1000;letter-spacing:.08em;text-shadow:0 2px #0008;flex:1;
  }
  .actionBtn small{display:block;margin-top:3px;font-size:10px;color:#9cc1d0;letter-spacing:.08em;font-weight:800}
  .actionBtn.primary.ready{border-color:#59d8ff;background:linear-gradient(180deg,#166383,#0b3246);box-shadow:inset 0 2px #ffffff22,0 0 20px #42ccff22,0 8px 20px #0009}
  .actionBtn.jump{border-color:#cdb15d;color:#fff8cf;background:linear-gradient(180deg,#8b6a19,#3e2c07);box-shadow:inset 0 2px #ffffff28,0 0 24px #ffd85a33,0 8px 20px #0009}
  .actionBtn[disabled]{opacity:.58;filter:saturate(.55);transform:none}
  #jumpBtn{display:none;max-width:44%}
  #jumpBtn.show{display:block}
  #toast{
    position:absolute;z-index:75;left:50%;top:17%;max-width:88%;transform:translate(-50%,-9px);
    padding:9px 14px;border-radius:999px;background:#06121bea;border:1px solid #527181;
    box-shadow:0 10px 30px #0009;color:#edfaff;font-size:12px;font-weight:950;letter-spacing:.035em;
    text-align:center;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #telemetry{
    position:absolute;z-index:67;left:8px;bottom:96px;display:none;max-width:52%;
    background:#020a10e8;border:1px solid #315365;border-radius:10px;padding:8px;color:#a8c4d1;
    font:9px/1.42 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;pointer-events:none;white-space:pre-wrap;
  }
  #telemetry.show{display:block}
  #devPanel{
    position:absolute;z-index:90;right:8px;top:50px;width:min(250px,76%);max-height:calc(100% - 62px);overflow:auto;
    display:none;padding:10px;border-radius:13px;background:#07131cf2;border:1px solid #426779;
    box-shadow:0 18px 50px #000d;backdrop-filter:blur(10px);
  }
  #devPanel.show{display:block}
  #devPanel h3{margin:0 0 7px;color:#ffe07a;font-size:11px;letter-spacing:.1em}
  .devButton{
    width:100%;margin:3px 0;padding:8px 9px;text-align:left;border-radius:8px;border:1px solid #294858;
    background:#0e2330;color:#c9e1ec;font-size:10px;font-weight:800;
  }
  #modal{
    position:absolute;z-index:100;inset:0;display:none;align-items:center;justify-content:center;padding:13px;
    background:#01070ddb;backdrop-filter:blur(5px);overflow:hidden;
  }
  #modal.show{display:flex}
  #modalCard{
    width:100%;max-width:490px;max-height:94%;overflow:auto;padding:17px;border-radius:18px;
    border:1px solid #3b6071;background:linear-gradient(180deg,#102634f5,#08141df5);
    box-shadow:inset 0 1px #ffffff14,0 28px 80px #000e;
  }
  #modalCard.legendary{border-color:#ffd95f;box-shadow:inset 0 1px #fff7b044,0 0 45px #ffd95f25,0 28px 80px #000e}
  #modalKicker{color:#7fa5b6;font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
  #modalTitle{margin:4px 0 7px;font-size:25px;line-height:1.02;letter-spacing:.01em}
  #modalText{margin:0;color:#aac1cc;font-size:13px;line-height:1.42;white-space:pre-line}
  #modalExtra{margin-top:12px}
  #modalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .modalAction{
    flex:1;min-width:120px;min-height:46px;padding:9px 12px;border-radius:11px;border:1px solid #3a6172;
    background:linear-gradient(#173849,#0c2330);font-size:12px;font-weight:950;letter-spacing:.045em;
  }
  .modalAction.danger{border-color:#8d3b49;background:linear-gradient(#652533,#33131b)}
  .modalAction.gold{border-color:#ad8c2c;background:linear-gradient(#745718,#382805);color:#fff0b1}
  .draftCards{display:grid;grid-template-columns:1fr;gap:8px}
  .draftCard{
    position:relative;display:grid;grid-template-columns:66px 1fr;gap:10px;align-items:center;width:100%;min-height:104px;
    padding:9px;border-radius:13px;border:1px solid var(--rarity,#486171);background:linear-gradient(135deg,#102431,#09151e);
    box-shadow:inset 0 1px #ffffff12,0 0 18px color-mix(in srgb,var(--rarity,#486171) 15%,transparent);
    text-align:left;overflow:hidden;
  }
  .draftCard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0,transparent 43%,#ffffff10 50%,transparent 57%,transparent 100%);transform:translateX(-120%);animation:revealSweep .85s ease .1s both}
  @keyframes revealSweep{to{transform:translateX(120%)}}
  .draftCard canvas{width:64px;height:64px;border-radius:11px;background:#061019;border:1px solid #294653}
  .draftHead{display:flex;align-items:baseline;justify-content:space-between;gap:7px}
  .draftName{font-size:14px;font-weight:1000;line-height:1.05;color:#f0f9ff}
  .draftRarity{font-size:9px;font-weight:1000;letter-spacing:.09em;color:var(--rarity)}
  .draftType{margin-top:3px;color:#7fa6b7;font-size:9px;font-weight:900;letter-spacing:.08em}
  .draftEffect{margin-top:5px;color:#d1e1e8;font-size:11px;line-height:1.22}
  .draftSynergy{margin-top:3px;color:#83e9ff;font-size:10px;line-height:1.2}
  .draftDrawback{margin-top:3px;color:#ff8c99;font-size:10px;line-height:1.2}
  .cardBadges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .cardBadge{padding:3px 5px;border-radius:999px;border:1px solid #3d6273;background:#071720;color:#9ec4d3;font-size:8px;font-weight:1000;letter-spacing:.06em}
  .cardBadge.need{border-color:#9c6d27;color:#ffe07a;background:#261b08}
  .cardBadge.link{border-color:#267b8e;color:#8cecff;background:#07212a}
  .draftTools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .draftTool{min-height:53px;padding:8px 10px;border-radius:11px;border:1px solid #416879;background:linear-gradient(#143445,#0a202b);text-align:left;font-size:11px;font-weight:1000;letter-spacing:.04em}
  .draftTool span{display:block;margin-top:3px;color:#82a4b2;font-size:8.5px;font-weight:800;letter-spacing:.02em}
  .draftTool.salvage{border-color:#8b6e2b;background:linear-gradient(#4d3b13,#241b08);color:#fff0b2}
  .draftTool[disabled]{opacity:.38;filter:saturate(.5);transform:none}
  .directiveCards{display:grid;grid-template-columns:1fr;gap:8px}
  .directiveCard{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;width:100%;min-height:84px;padding:9px;border-radius:12px;border:1px solid var(--directive,#4b7486);background:linear-gradient(135deg,#102631,#08151e);text-align:left;box-shadow:inset 0 1px #ffffff12,0 0 18px color-mix(in srgb,var(--directive,#4b7486) 12%,transparent)}
  .directiveGlyph{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:13px;border:1px solid var(--directive);background:#07131b;color:var(--directive);font-size:15px;font-weight:1000;letter-spacing:.03em;box-shadow:inset 0 0 20px color-mix(in srgb,var(--directive) 13%,transparent),0 0 14px color-mix(in srgb,var(--directive) 18%,transparent)}
  .directiveName{display:block;font-size:13px;font-weight:1000;color:#f2fbff}
  .directiveType{display:block;margin-top:2px;color:var(--directive);font-size:8px;font-weight:1000;letter-spacing:.11em}
  .directiveEffect{display:block;margin-top:5px;color:#bed2db;font-size:10.5px;line-height:1.25}
  .kitSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
  .kitBox{padding:8px 5px;border-radius:10px;border:1px solid #2c5061;background:#07151e;text-align:center}
  .kitBox b{display:block;color:#f1fbff;font-size:17px}
  .kitBox span{display:block;margin-top:2px;color:#7f9daa;font-size:8px;font-weight:1000;letter-spacing:.08em}
  .directiveList{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .directiveChip{padding:5px 7px;border-radius:8px;border:1px solid var(--directive,#35586a);background:#07151e;color:var(--directive,#a6c6d3);font-size:8.5px;font-weight:1000;letter-spacing:.035em}
  .directiveChip.overclocked{border-color:#ffe07a;background:linear-gradient(135deg,#2b2108,#08151e);box-shadow:0 0 12px #ffe07a22;color:#fff0a8}
  .overclockCard{border-color:#ffe07a!important;background:linear-gradient(135deg,#30240a,#0b1b25)!important;box-shadow:inset 0 1px #fff4ad28,0 0 22px #ffe07a26!important}
  .overclockArrow{display:inline-block;margin:0 4px;color:#ffe07a;font-weight:1000}
  .kitHint{margin-top:8px;padding:8px;border-radius:9px;border:1px solid #294958;background:#07131b;color:#8da9b6;font-size:10px;line-height:1.32}
  .statGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .statBox{padding:8px;border-radius:10px;background:#07151e;border:1px solid #294858}
  .statBox b{display:block;color:#f1fbff;font-size:15px}
  .statBox span{display:block;color:#7897a6;font-size:9px;font-weight:900;letter-spacing:.08em;margin-top:2px}
  .summaryGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px}
  .summaryCell{aspect-ratio:1;border-radius:6px;border:1px solid #294655;background:#07121a;display:flex;align-items:center;justify-content:center;color:#9ab4c0;font-size:7px;font-weight:1000;text-align:center;padding:2px;line-height:1.05}
  .eventChoices{display:grid;grid-template-columns:1fr;gap:8px}
  .eventChoice{padding:11px;border-radius:12px;border:1px solid #355d70;background:#0b202c;text-align:left}
  .eventChoice b{display:block;font-size:13px;color:#f3fbff}
  .eventChoice span{display:block;margin-top:3px;color:#96b3bf;font-size:11px;line-height:1.3}
  .moduleInspect{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center}
  .moduleInspect canvas{width:84px;height:84px;background:#061019;border:1px solid #345565;border-radius:14px}
  #modalCard.onboarding{border-color:#467285;background:linear-gradient(180deg,#112b3af7,#07131cf7);box-shadow:inset 0 1px #ffffff18,0 0 34px #67d9ff12,0 28px 80px #000e}
  .introGuide{display:grid;gap:7px;margin-top:10px}
  .introSection{padding:8px 9px;border-radius:10px;border:1px solid #294b5d;background:linear-gradient(180deg,#0a1b25,#07141d)}
  .introSectionHeader{margin-bottom:6px;color:#8bdcf5;font-size:9px;font-weight:1000;letter-spacing:.13em}
  .introStepList,.introTipList{display:grid;gap:5px}
  .introStep{display:grid;grid-template-columns:20px 1fr;gap:7px;align-items:start;color:#b8ced8;font-size:10.5px;line-height:1.25}
  .introStep b,.introTip b{color:#f0f9ff}
  .introNum{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;border:1px solid #3e7186;background:#102c39;color:#a8ecff;font-size:10px;font-weight:1000}
  .introTip{position:relative;padding-left:13px;color:#b8ced8;font-size:10.5px;line-height:1.25}
  .introTip::before{content:"";position:absolute;left:1px;top:.47em;width:5px;height:5px;border-radius:50%;background:#ffe07a;box-shadow:0 0 8px #ffe07a88}
  .introRecords{display:flex;justify-content:center;gap:13px;padding:6px 8px;border-radius:8px;border:1px solid #263f4c;background:#061119;color:#8da9b6;font-size:8.5px;font-weight:950;letter-spacing:.07em;text-align:center}
  .introRecords b{color:#eaf7ff}
  .introControls{color:#668998;font-size:7.7px;font-weight:900;letter-spacing:.055em;text-align:center;line-height:1.25}
  .resPower{color:var(--power)}.resOxygen{color:var(--oxygen)}.resFuel{color:var(--fuel)}.resShield{color:var(--shield)}
  .distressChooser{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:stretch;margin-top:7px}
  .distressStep{border:1px solid #486779;border-radius:10px;background:#0a1b25;color:#dff7ff;font-size:22px;font-weight:1000;min-height:54px}
  .distressStep[disabled]{opacity:.25}
  .distressCore{padding:7px 9px;border-radius:10px;border:1px solid #684d28;background:linear-gradient(135deg,#241a08,#081720);text-align:center}
  .distressCore b{display:block;color:#ffe59a;font-size:12px;letter-spacing:.09em}
  .distressCore span{display:block;margin-top:3px;color:#9fb7c1;font-size:9px;line-height:1.22}
  .metaButtons{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .metaButton{min-height:38px;padding:6px 8px;border-radius:9px;border:1px solid #355b6d;background:#0a1d28;color:#cce8f2;font-size:9px;font-weight:1000;letter-spacing:.06em}
  .challengeGrid{display:grid;gap:6px}
  .challengeRow{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:7px 8px;border:1px solid #294b5a;border-radius:9px;background:#07151e}
  .challengeRow.done{border-color:#7e6a2c;background:linear-gradient(135deg,#211a08,#07151e)}
  .challengeMark{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;border:1px solid #3e6678;color:#7898a6;font-size:12px;font-weight:1000}
  .challengeRow.done .challengeMark{border-color:#b89334;color:#ffe07a;box-shadow:0 0 10px #ffe07a22}
  .challengeName{display:block;color:#eefaff;font-size:10.5px;font-weight:1000}
  .challengeDesc{display:block;margin-top:2px;color:#8faab6;font-size:9px;line-height:1.25}
  .gravityBanner{color:#ffb0c0}
  @media (max-height:620px){
    #modalCard.onboarding{padding:11px}
    #modalCard.onboarding #modalTitle{margin:3px 0 4px;font-size:22px}
    #modalCard.onboarding #modalText{font-size:11px;line-height:1.3}
    #modalCard.onboarding #modalActions{margin-top:8px}
    #modalCard.onboarding .modalAction{min-height:42px}
    .introGuide{gap:5px;margin-top:7px}
    .introSection{padding:6px 7px}
    .introSectionHeader{margin-bottom:4px;font-size:8px}
    .introStepList,.introTipList{gap:3px}
    .introStep{grid-template-columns:18px 1fr;gap:6px;font-size:9.2px;line-height:1.18}
    .introNum{width:18px;height:18px;font-size:9px}
    .introTip{font-size:9.2px;line-height:1.18}
    .introRecords{padding:4px 6px;font-size:8px}
    .introControls{display:none}
    .metaButtons{display:none}
    .distressChooser{grid-template-columns:36px 1fr 36px;gap:5px;margin-top:4px}
    .distressStep{min-height:42px;font-size:19px}
    .distressCore{padding:5px 6px}
    .distressCore b{font-size:10px}.distressCore span{font-size:7.7px;line-height:1.15}
  }

  @media (max-height:680px){
    #modalCard.draftModal{padding:12px}
    #modalCard.draftModal #modalTitle{font-size:22px;margin:3px 0 5px}
    #modalCard.draftModal #modalText{font-size:11px;line-height:1.25}
    #modalCard.draftModal .draftCards{gap:6px}
    #modalCard.draftModal .draftCard{grid-template-columns:52px 1fr;gap:7px;min-height:82px;padding:6px}
    #modalCard.draftModal .draftCard canvas{width:50px;height:50px;border-radius:9px}
    #modalCard.draftModal .draftName{font-size:12px}
    #modalCard.draftModal .draftRarity,#modalCard.draftModal .draftType{font-size:7.5px}
    #modalCard.draftModal .cardBadges{gap:3px;margin-top:3px}
    #modalCard.draftModal .cardBadge{padding:2px 4px;font-size:7px}
    #modalCard.draftModal .draftEffect{margin-top:3px;font-size:9.2px;line-height:1.14}
    #modalCard.draftModal .draftSynergy,#modalCard.draftModal .draftDrawback{margin-top:2px;font-size:8.2px;line-height:1.12}
    #modalCard.draftModal .draftTools{gap:6px;margin-top:7px}
    #modalCard.draftModal .draftTool{min-height:46px;padding:6px 7px;font-size:9.5px}
    #modalCard.draftModal .draftTool span{margin-top:2px;font-size:7.3px}
  }
  @media (min-width:700px){#shell{border-radius:19px}}
  @media (max-height:620px){#modalCard{max-height:96%;padding:13px}.draftCard{min-height:92px}.actionBtn{min-height:64px}}
</style>
</head>
<body>
<div id="app">
  <div id="shell">
    <canvas id="game" width="540" height="960" aria-label="Dead Orbit ship systems grid"></canvas>
    <div id="scanlines"></div>
    <div id="topButtons">
      <button class="iconBtn" id="soundBtn" aria-label="Toggle sound">SND</button>
      <button class="iconBtn" id="helpBtn" aria-label="How to play">?</button>
      <button class="iconBtn" id="kitBtn" aria-label="Ship kit and directives">KIT</button>
      <button class="iconBtn" id="devBtn" aria-label="Developer capture tools">DEV</button>
    </div>
    <div id="toast"></div>
    <div id="telemetry"></div>
    <div id="actionBar">
      <button class="actionBtn primary ready" id="cycleBtn">RUN CYCLE<small>SPACE / C</small></button>
      <button class="actionBtn jump" id="jumpBtn">JUMP<small>J</small></button>
    </div>
    <div id="devPanel">
      <h3>DEAD ORBIT — DEV / CAPTURE</h3>
      <button class="devButton" data-dev="legendary">Force Legendary draft</button>
      <button class="devButton" data-dev="directive">Force directive draft</button>
      <button class="devButton" data-dev="overclock">Force Overclock draft</button>
      <button class="devButton" data-dev="tools">Grant reroutes + scrap</button>
      <button class="devButton" data-dev="star">Add Miniature Star</button>
      <button class="devButton" data-dev="synergy">Create high-synergy board</button>
      <button class="devButton" data-dev="depth">Load Overclock board</button>
      <button class="devButton" data-dev="damage">Install damaged system</button>
      <button class="devButton" data-dev="milestone">Open milestone reward</button>
      <button class="devButton" data-dev="signal">Lock Salvage Signal</button>
      <button class="devButton" data-dev="chain">Force giant activation chain</button>
      <button class="devButton" data-dev="juice">Load v8 JUICE 100 showcase</button>
      <button class="devButton" data-dev="final">Load Gravity Well finale</button>
      <button class="devButton" data-dev="endless">Enter Deep Orbit</button>
      <button class="devButton" data-dev="distress">Set Distress 10 test</button>
      <button class="devButton" data-dev="asteroid">Trigger asteroid emergency</button>

<script>
'use strict';

/* =========================================================
   SMALL GAMES KIT v0.1 — adapted for DEAD ORBIT v8
   Self-contained HTML/CSS/JS. No libraries or external assets.
   Preserved systems: responsive shell, pointer/touch/keyboard input,
   game loop + scene manager, RNG/weighted rarity helpers, localStorage,
   procedural Web Audio, particles, shake, flashes, floating text,
   tweening, modals/toasts/HUD helpers, tester telemetry, and capture tools.
   ========================================================= */

const SGK=(()=>{
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const rand=(a=0,b=1)=>a+Math.random()*(b-a);
  const irand=(a,b)=>Math.floor(rand(a,b+1));
  const choose=a=>a[Math.floor(Math.random()*a.length)];
  const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
  const weightedChoice=entries=>{
    const valid=entries.filter(e=>e.weight>0);if(!valid.length)return null;
    let r=Math.random()*valid.reduce((s,e)=>s+e.weight,0);
    for(const e of valid){r-=e.weight;if(r<=0)return e.value}return valid[valid.length-1].value;
  };
  const rarityRoll=(luck=0)=>weightedChoice([
    {value:'common',weight:60-Math.min(25,luck)},
    {value:'uncommon',weight:25},
    {value:'rare',weight:10+luck*.35},
    {value:'epic',weight:4+luck*.18},
    {value:'legendary',weight:1+luck*.08}
  ]);
  function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

  const PREFIX='dead_orbit_v1_';
  const Save={
    get(key,fallback=null){try{const raw=localStorage.getItem(PREFIX+key);return raw===null?fallback:JSON.parse(raw)}catch{return fallback}},
    set(key,val){try{localStorage.setItem(PREFIX+key,JSON.stringify(val));return true}catch{return false}},
    remove(key){try{localStorage.removeItem(PREFIX+key)}catch{}},
    reset(){try{Object.keys(localStorage).filter(k=>k.startsWith(PREFIX)).forEach(k=>localStorage.removeItem(k))}catch{}}
  };

  const Telemetry={
    data:Save.get('telemetry',{
      sessions:0,runsStarted:0,runsCompleted:0,victories:0,deaths:0,
      sectorsReached:0,cyclesCompleted:0,draftsCompleted:0,immediateRestarts:0,
      legendarySelected:0,reroutesUsed:0,draftsSkipped:0,modulesScrapped:0,directivesSelected:0,overclocksSelected:0,signalJackpots:0,endlessSectors:0,challengesUnlocked:0,
      playMs:0,longestSessionMs:0,lastRunEndAt:0
    }),
    sessionStart:performance.now(),runStart:0,
    init(){this.data.sessions++;this.persist()},
    startRun(){this.data.runsStarted++;this.runStart=performance.now();this.persist()},
    completeRun(win=false){this.data.runsCompleted++;if(win)this.data.victories++;else this.data.deaths++;this.data.lastRunEndAt=Date.now();this.persist()},
    add(key,n=1){this.data[key]=(this.data[key]||0)+n;this.persist()},
    max(key,v){this.data[key]=Math.max(this.data[key]||0,v);this.persist()},
    tick(ms){this.data.playMs+=ms;const session=performance.now()-this.sessionStart;this.data.longestSessionMs=Math.max(this.data.longestSessionMs||0,session);if((this.data.playMs|0)%5000<ms)this.persist()},
    persist(){Save.set('telemetry',this.data)},
    reset(){this.data={sessions:1,runsStarted:0,runsCompleted:0,victories:0,deaths:0,sectorsReached:0,cyclesCompleted:0,draftsCompleted:0,immediateRestarts:0,legendarySelected:0,reroutesUsed:0,draftsSkipped:0,modulesScrapped:0,directivesSelected:0,overclocksSelected:0,signalJackpots:0,endlessSectors:0,challengesUnlocked:0,playMs:0,longestSessionMs:0,lastRunEndAt:0};this.persist()}
  };

  const Input={
    keys:new Set(),pressed:new Set(),queue:[],pointer:{x:0,y:0,down:false,startX:0,startY:0},initialized:false,
    init(){
      if(this.initialized)return;this.initialized=true;
      addEventListener('keydown',e=>{
        const k=e.key.toLowerCase();if(!this.keys.has(k))this.pressed.add(k);this.keys.add(k);
        if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter','w','a','s','d','c','j','1','2','3','4'].includes(k))e.preventDefault();
        if(k==='`')UI.toggleDev();
      },{passive:false});
      addEventListener('keyup',e=>this.keys.delete(e.key.toLowerCase()));
      const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
      canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=pos(e);this.pointer={x:p.x,y:p.y,down:true,startX:p.x,startY:p.y};Audio.unlock();try{canvas.setPointerCapture(e.pointerId)}catch{}},{passive:false});
      canvas.addEventListener('pointermove',e=>{const p=pos(e);this.pointer.x=p.x;this.pointer.y=p.y});
      canvas.addEventListener('pointerup',e=>{e.preventDefault();const p=pos(e),dx=p.x-this.pointer.startX,dy=p.y-this.pointer.startY;this.pointer.x=p.x;this.pointer.y=p.y;this.pointer.down=false;if(Math.hypot(dx,dy)>34){this.queue.push({type:'swipe',dir:Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'),x:p.x,y:p.y})}else this.queue.push({type:'tap',x:p.x,y:p.y})},{passive:false});
      canvas.addEventListener('pointercancel',()=>{this.pointer.down=false});
      canvas.addEventListener('contextmenu',e=>e.preventDefault());
    },
    consumeKey(k){k=k.toLowerCase();if(this.pressed.has(k)){this.pressed.delete(k);return true}return false},
    consumeTap(){const i=this.queue.findIndex(v=>v.type==='tap');return i>=0?this.queue.splice(i,1)[0]:null},
    consumeSwipe(){const i=this.queue.findIndex(v=>v.type==='swipe');return i>=0?this.queue.splice(i,1)[0]:null},
    endFrame(){this.pressed.clear()}
  };

  const Audio={
    ctx:null,master:null,enabled:Save.get('sound',true),
    unlock(){
      if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return}
      try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.enabled?.17:0;this.master.connect(this.ctx.destination)}catch{}
    },
    setEnabled(v){this.enabled=!!v;Save.set('sound',this.enabled);if(this.master)this.master.gain.value=this.enabled?.17:0},
    tone(freq=440,dur=.08,type='sine',vol=.3,slide=0,delay=0){
      if(!this.enabled)return;this.unlock();if(!this.ctx||!this.master)return;
      const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(35,freq),t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),t+dur);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.03);
    },
    noise(dur=.1,vol=.12,delay=0){
      if(!this.enabled)return;this.unlock();if(!this.ctx||!this.master)return;
      const len=Math.max(1,Math.floor(this.ctx.sampleRate*dur)),buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
      const src=this.ctx.createBufferSource(),g=this.ctx.createGain(),t=this.ctx.currentTime+delay;src.buffer=buf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(g);g.connect(this.master);src.start(t);
    },
    click(){this.tone(330,.04,'square',.12,80)},
    cycle(){this.tone(110,.18,'sawtooth',.26,210);this.tone(220,.1,'square',.13,110,.08)},
    activation(resource='power'){const f={power:510,oxygen:650,fuel:310,shields:430,hull:240,balance:570}[resource]||390;this.tone(f,.055,'triangle',.13,45)},
    gain(resource='power'){const f={power:720,oxygen:840,fuel:480,shields:610,hull:520,balance:760}[resource]||600;this.tone(f,.07,'sine',.14,100)},
    synergy(){this.tone(760,.08,'triangle',.17,210)},
    chain(n=2){this.tone(520+Math.min(8,n)*42,.08,'square',.12,160)},
    warning(){this.tone(150,.16,'sawtooth',.25,-35);this.tone(120,.16,'sawtooth',.18,-25,.17)},
    lowO2(){this.tone(220,.12,'square',.23,-80);this.tone(180,.12,'square',.2,-60,.16)},
    reveal(rarity){const base={rare:620,epic:520,legendary:420}[rarity]||560;this.tone(base,.12,'triangle',.22,220);this.tone(base*1.5,.18,'sine',.18,180,.09);if(rarity==='legendary')this.tone(base*2,.3,'sine',.17,260,.18)},
    place(){this.tone(260,.06,'square',.18,120);this.tone(620,.08,'triangle',.15,90,.045)},
    ready(){this.tone(420,.08,'triangle',.18,180);this.tone(680,.14,'sine',.18,220,.07)},
    jump(){this.noise(.45,.13);this.tone(80,.55,'sawtooth',.28,720);this.tone(420,.25,'sine',.18,560,.24)},
    damage(){this.noise(.18,.22);this.tone(95,.22,'square',.25,-40)},
    victory(){[440,554,659,880].forEach((f,i)=>this.tone(f,.32,'triangle',.22,80,i*.12))},
    defeat(){this.tone(240,.34,'sawtooth',.25,-130);this.tone(150,.48,'square',.18,-70,.22)},
    token(){this.tone(410,.07,'square',.14,160);this.tone(690,.09,'triangle',.12,110,.05)},
    scrap(){this.noise(.11,.13);this.tone(190,.12,'square',.18,-40);this.tone(520,.08,'triangle',.11,80,.08)},
    directive(){this.tone(360,.12,'triangle',.18,180);this.tone(560,.16,'sine',.17,220,.08);this.tone(820,.22,'sine',.14,130,.18)},
    jackpot(){this.tone(520,.08,'square',.16,220);this.tone(760,.12,'triangle',.18,260,.07);this.tone(1080,.22,'sine',.15,180,.16)},
    comboTier(tier=1){const base=[0,460,560,680,820][SGK.clamp(tier,1,4)];this.tone(base,.09,'square',.15,180);this.tone(base*1.26,.14,'triangle',.14,240,.045);if(tier>=3){this.noise(.12,.08,.03);this.tone(base*1.62,.22,'sine',.14,320,.10)}if(tier>=4)this.tone(base*2.02,.32,'sine',.13,420,.18)},
    warpPulse(){this.tone(84,.42,'sawtooth',.22,500);this.tone(260,.26,'triangle',.13,420,.12)},
    anomaly(){this.tone(300,.10,'sine',.13,420);this.tone(900,.28,'sine',.10,-340,.08)}
  };

  const Juice={
    particles:[],floats:[],tweens:[],flashes:[],shake:{amount:0,time:0,total:0},
    particleBurst(x,y,count=12,o={}){for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(o.speedMin??35,o.speedMax??150);this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(o.lifeMin??.35,o.lifeMax??.8),max:1,size:rand(o.sizeMin??1.5,o.sizeMax??4),color:o.color||'#7fe7ff',gravity:o.gravity??30,shape:o.shape||'square'})}},
    floatText(x,y,text,color='#fff',size=16){this.floats.push({x,y,text,color,size,life:.78,max:.78,vy:-48})},
    addFlash(color='#fff',alpha=.16,dur=.18){this.flashes.push({color,alpha,life:dur,max:dur})},
    addShake(amount=6,dur=.18){this.shake.amount=Math.max(this.shake.amount,amount);this.shake.time=Math.max(this.shake.time,dur);this.shake.total=this.shake.time},
    clear(){this.particles.length=0;this.floats.length=0;this.tweens.length=0;this.flashes.length=0;this.shake.amount=0;this.shake.time=0;this.shake.total=0},
    tween(target,to,dur=.2,ease=t=>1-(1-t)*(1-t),done=null){const from={};Object.keys(to).forEach(k=>from[k]=target[k]);this.tweens.push({target,from,to,dur,t:0,ease,done})},
    update(dt){
      for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.life-=dt;if(p.life<=0){this.particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.vx*=Math.pow(.985,dt*60)}
      for(let i=this.floats.length-1;i>=0;i--){const f=this.floats[i];f.life-=dt;if(f.life<=0){this.floats.splice(i,1);continue}f.y+=f.vy*dt;f.vy*=Math.pow(.94,dt*60)}
      for(let i=this.flashes.length-1;i>=0;i--){this.flashes[i].life-=dt;if(this.flashes[i].life<=0)this.flashes.splice(i,1)}
      for(let i=this.tweens.length-1;i>=0;i--){const tw=this.tweens[i];tw.t+=dt;const p=clamp(tw.t/tw.dur,0,1),e=tw.ease(p);Object.keys(tw.to).forEach(k=>tw.target[k]=lerp(tw.from[k],tw.to[k],e));if(p>=1){this.tweens.splice(i,1);try{tw.done?.()}catch{}}}
      if(this.shake.time>0)this.shake.time-=dt;else this.shake.amount=0;
    },
    beginCamera(){ctx.save();if(this.shake.amount>0){const fade=clamp(this.shake.time/Math.max(.001,this.shake.total),0,1);ctx.translate(rand(-this.shake.amount,this.shake.amount)*fade,rand(-this.shake.amount,this.shake.amount)*fade)}return true},
    endCamera(){ctx.restore()},
    drawOverlay(){
      ctx.save();
      for(const p of this.particles){const a=clamp(p.life/.55,0,1);ctx.globalAlpha=a;ctx.fillStyle=p.color;if(p.shape==='circle'){ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate((p.life*7)%Math.PI);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore()}}
      ctx.textAlign='center';ctx.textBaseline='middle';for(const f of this.floats){const a=clamp(f.life/f.max,0,1);ctx.globalAlpha=Math.min(1,a*1.6);ctx.font=`1000 ${f.size}px system-ui`;ctx.lineWidth=4;ctx.strokeStyle='#02070ccc';ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y)}
      ctx.restore();
      for(const fl of this.flashes){ctx.save();ctx.globalAlpha=fl.alpha*clamp(fl.life/fl.max,0,1);ctx.fillStyle=fl.color;ctx.fillRect(0,0,W,H);ctx.restore()}
    }
  };

  const UI={
    toastTimer:0,
    toast(msg,ms=1500){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>el.classList.remove('show'),ms)},
    modal({kicker='',title='',text='',extra='',actions=[],className=''}){
      const root=document.getElementById('modal'),card=document.getElementById('modalCard');card.className=className||'';
      document.getElementById('modalKicker').textContent=kicker;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;
      const ex=document.getElementById('modalExtra');ex.innerHTML=extra;const acts=document.getElementById('modalActions');acts.innerHTML='';
      actions.forEach(a=>{const b=document.createElement('button');b.className='modalAction '+(a.className||'');b.textContent=a.label;b.onclick=()=>{Audio.unlock();Audio.click();a.onClick?.()};acts.appendChild(b)});root.classList.add('show');
    },
    hideModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modalCard').className='';document.getElementById('modalExtra').innerHTML='';document.getElementById('modalActions').innerHTML=''},
    modalOpen(){return document.getElementById('modal').classList.contains('show')},
    toggleDev(force){const p=document.getElementById('devPanel');p.classList.toggle('show',force===undefined?!p.classList.contains('show'):!!force)},
    telemetry(force){document.getElementById('telemetry').classList.toggle('show',force===undefined?!document.getElementById('telemetry').classList.contains('show'):!!force)}
  };

  const Draw={
    roundPath(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()},
    roundRect(x,y,w,h,r,fill,stroke=null,line=1,c=ctx){this.roundPath(c,x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=line;c.stroke()}},
    circle(x,y,r,fill,stroke=null,line=1,c=ctx){c.beginPath();c.arc(x,y,r,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=line;c.stroke()}},
    text(text,x,y,size=16,color='#fff',align='left',weight=700,c=ctx){c.fillStyle=color;c.textAlign=align;c.textBaseline='middle';c.font=`${weight} ${size}px system-ui`;c.fillText(text,x,y)},
    line(x1,y1,x2,y2,color='#fff',width=2,alpha=1,c=ctx){c.save();c.globalAlpha=alpha;c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore()},
    wrapText(text,x,y,maxWidth,lineHeight,size=12,color='#fff',align='left',weight=700,maxLines=3,c=ctx){c.save();c.font=`${weight} ${size}px system-ui`;c.fillStyle=color;c.textAlign=align;c.textBaseline='top';const words=String(text).split(/\s+/),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(c.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);for(let i=0;i<Math.min(maxLines,lines.length);i++){let out=lines[i];if(i===maxLines-1&&lines.length>maxLines)out=out.replace(/[.,;:]?$/,'…');c.fillText(out,x,y+i*lineHeight)}c.restore();return Math.min(maxLines,lines.length)*lineHeight}
  };

  const Scenes={current:null,set(scene){this.current?.exit?.();this.current=scene;this.current?.enter?.()},update(dt){this.current?.update?.(dt)},draw(){this.current?.draw?.()}};
  let running=false,last=performance.now(),timeScale=1;
  function updateTelemetryUI(){const el=document.getElementById('telemetry');if(!el.classList.contains('show'))return;const d=Telemetry.data,s=window.DeadOrbitDebug?.getState?.();el.textContent=`sessions ${d.sessions}\nruns ${d.runsStarted} / ${d.runsCompleted}\nwins ${d.victories}\ncycles ${d.cyclesCompleted}\ndrafts ${d.draftsCompleted}\nlegendary ${d.legendarySelected}\nreroutes ${d.reroutesUsed||0} • skips ${d.draftsSkipped||0}\nscrap ${d.modulesScrapped||0} • directives ${d.directivesSelected||0}\noverclocks ${d.overclocksSelected||0} • signal locks ${d.signalJackpots||0}\nendless ${d.endlessSectors||0} • challenges ${d.challengesUnlocked||0}\nplay ${(d.playMs/60000).toFixed(1)}m\nphase ${s?.phase||'-'}\nsector ${s?.sector||'-'}\nqueue ${s?.queueLength||0}\nparticles ${Juice.particles.length}`}
  function loop(now){if(!running)return;const raw=Math.min(.05,(now-last)/1000);last=now;const dt=raw*timeScale;Telemetry.tick(raw*1000);Juice.update(dt);Scenes.update(dt);ctx.clearRect(0,0,W,H);Juice.beginCamera();Scenes.draw();Juice.endCamera();Juice.drawOverlay();Input.endFrame();updateTelemetryUI();requestAnimationFrame(loop)}
  function start(scene){if(running){Scenes.set(scene);return}Input.init();Telemetry.init();Scenes.set(scene);running=true;last=performance.now();requestAnimationFrame(loop)}
  function setTimeScale(v){timeScale=clamp(v,.05,30)}
  function getTimeScale(){return timeScale}
  return{canvas,ctx,W,H,clamp,lerp,rand,irand,choose,shuffle,weightedChoice,rarityRoll,mulberry32,Save,Telemetry,Input,Audio,Juice,UI,Draw,Scenes,start,setTimeScale,getTimeScale};
})();

const RARITY={
  common:{label:'COMMON',color:'#7894a2',rank:0},
  uncommon:{label:'UNCOMMON',color:'#68dea0',rank:1},
  rare:{label:'RARE',color:'#58bfff',rank:2},
  epic:{label:'EPIC',color:'#c879ff',rank:3},

};
const RES={
  power:{label:'POWER',short:'PWR',color:'#67d9ff'},
  oxygen:{label:'OXYGEN',short:'O₂',color:'#79f0a5'},
  fuel:{label:'FUEL',short:'FUEL',color:'#ffb85c'},

const MODULES={
  basic_battery:{id:'basic_battery',name:'Basic Battery',tile:'BATTERY',rarity:'common',resource:'power',icon:'battery',tags:['machine','power','battery'],effect:'+3 Power.',synergy:'Each adjacent Solar gives +2 Power.',drawback:''},
  solar_panel:{id:'solar_panel',name:'Solar Panel',tile:'SOLAR',rarity:'common',resource:'power',icon:'solar',tags:['machine','power','solar'],effect:'+2 Power.',synergy:'Blue Stars double it. Miniature Star reactivates it.',drawback:'Frozen sectors halve output.'},

const GRID={cols:5,rows:4,x:24,y:211,w:492,h:424,gap:6};
GRID.cellW=(GRID.w-GRID.gap*(GRID.cols-1))/GRID.cols;
GRID.cellH=(GRID.h-GRID.gap*(GRID.rows-1))/GRID.rows;
const MAX_HULL=8,MAX_OXYGEN=60,MAX_ACTIVATIONS=3,MAX_QUEUE=60;

const moduleOf=inst=>inst?MODULES[inst.id]:null;
const cellCenter=i=>{const c=i%GRID.cols,r=Math.floor(i/GRID.cols);return{x:GRID.x+c*(GRID.cellW+GRID.gap)+GRID.cellW/2,y:GRID.y+r*(GRID.cellH+GRID.gap)+GRID.cellH/2}};
const cellRect=i=>{const c=i%GRID.cols,r=Math.floor(i/GRID.cols);return{x:GRID.x+c*(GRID.cellW+GRID.gap),y:GRID.y+r*(GRID.cellH+GRID.gap),w:GRID.cellW,h:GRID.cellH}};
const neighbors=i=>{const c=i%GRID.cols,r=Math.floor(i/GRID.cols),out=[];if(r>0)out.push(i-GRID.cols);if(r<GRID.rows-1)out.push(i+GRID.cols);if(c>0)out.push(i-1);if(c<GRID.cols-1)out.push(i+1);return out};
const hasTag=(inst,tag)=>!!moduleOf(inst)?.tags.includes(tag);
const countBoard=idOrTag=>DeadOrbit.state.board.reduce((n,inst)=>n+(inst&&(inst.id===idOrTag||hasTag(inst,idOrTag))?1:0),0);

function hexAlpha(hex,a){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function formatNum(n){return Math.round(n).toLocaleString('en-US')}
function resourceColor(key){return RES[key]?.color||'#fff'}
function rarityColor(instOrModule){const m=instOrModule?.id?MODULES[instOrModule.id]:instOrModule;return RARITY[m?.rarity||'common'].color}
function splitTileName(name){const words=name.split(' ');if(name.length<=10)return[name];if(words.length===1)return[name.slice(0,8),name.slice(8)];const mid=Math.ceil(words.length/2);return[words.slice(0,mid).join(' '),words.slice(mid).join(' ')]}

function deadOrbitGuideHTML(records=null,showControls=false){
  const recordLine=records?`<div class="introRecords"><span>BEST <b>${records.bestSector||0}</b></span><span>ESCAPES <b>${records.victories||0}</b></span><span>DISTRESS <b>${records.highestDistressCleared||0}</b></span><span>DEEP <b>${records.deepestOrbit||0}</b></span></div>`:'';
  const controls=showControls?'<div class="introControls">TOUCH: TAP BUTTONS + GRID &nbsp;•&nbsp; KEYBOARD: SPACE/C = CYCLE &nbsp;•&nbsp; J = JUMP</div>':'';
  return `<div class="introGuide" aria-label="How to play and survival tips">
    <div class="introSection">
      <div class="introSectionHeader">HOW TO PLAY</div>
      <div class="introStepList">
        <div class="introStep"><span class="introNum">1</span><span><b>Run a cycle.</b> Every installed module activates and linked systems can chain.</span></div>
        <div class="introStep"><span class="introNum">2</span><span><b>Shape the engine.</b> Install one module, reroute the choices, or skip for Scrap.</span></div>
        <div class="introStep"><span class="introNum">3</span><span><b>Jump before time runs out.</b> Shipyards offer Directives, salvage, supplies, and late-game Overclocks.</span></div>
      </div>
    </div>
    <div class="introSection">
      <div class="introSectionHeader">SURVIVAL TIPS</div>
      <div class="introTipList">
        <div class="introTip">Triggered links fill the <b>Salvage Signal</b>. Lock it to guarantee a Rare-or-better draft.</div>
        <div class="introTip">Balance <b class="resPower">Power</b>, <b class="resOxygen">Oxygen</b>, <b class="resFuel">Fuel</b>, and <b class="resShield">Shields</b>. One weak system can end the run.</div>
        <div class="introTip">Some modules <b>grow</b>, <b>burn out</b>, or arrive <b>damaged</b>. Scrap is board control—not just cleanup.</div>
        <div class="introTip">Sector 5 is a <b>3-cycle Gravity Well finale</b>. Escape to unlock harder Distress levels, or keep the winning ship alive in Deep Orbit.</div>
      </div>
    </div>
    ${recordLine}${controls}

}

  function distressRequirementMultiplier(level=state?.distressLevel||selectedDistress){return level>=10?1.20:level>=4?1.10:1}
  function distressDrainBonus(level=state?.distressLevel||selectedDistress){return level>=6?2:level>=2?1:0}

    if(state.distressLevel>=10&&!state.runEnded&&Math.sin(state.warningPulse*9)>.93){c.save();c.globalAlpha=.07;c.fillStyle='#ff5267';for(let i=0;i<4;i++)c.fillRect(SGK.rand(0,420),SGK.rand(80,860),SGK.rand(55,190),SGK.rand(2,7));c.restore()}
    if(state.phase==='placing'){const m=moduleOf(state.pendingModule);D.roundRect(91,608,358,34,10,'#261b08e8','#ffe07a',1.5,c);D.text(`PLACE: ${m.name.toUpperCase()}`,270,625,12,'#ffe07a','center',1000,c)}
    if(state.phase==='scrapping'){D.roundRect(91,608,358,34,10,'#301117e8','#ff6b77',1.5,c);D.text('SCRAP MODE — SELECT A MODULE',270,625,12,'#ff8a98','center',1000,c)}
  }

  function update(dt){
    if(!state)return;state.warningPulse+=dt;state.comboTimer=Math.max(0,state.comboTimer-dt);state.radioTimer=Math.max(0,state.radioTimer-dt);state.legendaryPulse=Math.max(0,state.legendaryPulse-dt);if(state.cycleSweepLife>0){state.cycleSweepLife=Math.max(0,state.cycleSweepLife-dt);state.cycleSweepT+=dt}for(let i=state.activationFX.length-1;i>=0;i--){state.activationFX[i].life-=dt;if(state.activationFX[i].life<=0)state.activationFX.splice(i,1)}
    for(const k of Object.keys(state.display))state.display[k]=SGK.lerp(state.display[k],state.resources[k],1-Math.pow(.001,dt));
    for(const inst of state.board){if(inst){inst.pulse=Math.max(0,inst.pulse-dt*3.3);inst.flash=Math.max(0,inst.flash-dt)}}
    for(let i=state.links.length-1;i>=0;i--){state.links[i].life-=dt;if(state.links[i].life<=0)state.links.splice(i,1)}
    handleKeyboard();
    if(!SGK.UI.modalOpen()){
      const tap=SGK.Input.consumeTap();if(tap){const idx=indexFromPoint(tap.x,tap.y);if(state.phase==='placing'){if(idx>=0)attemptPlacement(idx);else SGK.UI.toast('TAP A SHIP GRID SLOT',900)}else if(state.phase==='scrapping'){if(idx>=0&&state.board[idx])attemptScrap(idx);else SGK.UI.toast('TAP AN INSTALLED MODULE',900)}else if((state.phase==='ready'||state.phase==='ended')&&idx>=0&&state.board[idx])showModuleInfo(idx)}
    }
    if(state.phase==='activating'){
      state.activationTimer-=dt;if(state.activationTimer<=0){if(state.activationQueue.length){const item=state.activationQueue.shift();activateModule(item.index,item);state.activationTimer+=state.activationInterval;updateActions()}else finishActivations()}
    }else if(state.phase==='cycleEnd'){
      state.cycleEndTimer-=dt;if(state.cycleEndTimer<=0)afterCycleEnd();
    }else if(state.phase==='jump'){
      for(const s of state.starStreaks){s.y+=s.speed*dt;if(s.y>1000){s.y=-s.len;s.x=SGK.rand(0,540)}}state.jumpTimer-=dt;if(state.jumpTimer<=0)completeJump();
    }
  }
  function draw(){if(!state)return;drawBackground();drawHeader();drawGrid();drawEventPanel();drawWarnings();drawComboBanner();drawJumpEffect()}
  function enter(){newRun(false)}
  function exit(){}

  return{
    get state(){return state},enter,exit,update,draw,newRun,showTitle,showChallenges,beginCycle,jump,beginDraft,selectDraft,attemptPlacement,getRequirements,canJump,endRun,showHelp,showKit,rerouteDraft,skipDraft,startScrap,cancelScrap,attemptScrap,showMilestoneReward,selectMilestoneReward,showDirectiveDraft,selectDirective,showOverclockDraft,selectOverclock,installWearDamage,runDevCommand,setSynergyBoard,setDepthBoard,grantModule,
    debug:{
      snapshot(){return JSON.parse(JSON.stringify({phase:state.phase,sector:state.sector,cyclesUsed:state.cyclesUsed,maxCycles:state.maxCycles,distressLevel:state.distressLevel,deepOrbit:state.deepOrbit,escapeAchieved:state.escapeAchieved,gravityStage:state.gravityStage,resources:state.resources,req:getRequirements(),board:state.board.map(x=>x?.id||null),moduleLevels:state.board.map(x=>x?.level||0),modulesDestroyed:state.modulesDestroyed,junkInstalled:state.junkInstalled,queueLength:state.activationQueue.length,totalCycles:state.totalCycles,biggestChain:state.biggestChain,bestCycle:state.bestCycle,cycleGain:state.cycleGain,triggeredThisCycle:state.triggeredThisCycle,signalLocks:state.signalLocks,draftChoices:state.draftChoices.map(m=>m.id),legendaryFound:state.legendaryFound,event:state.event.id,runEnded:state.runEnded,jumpReady:state.jumpReady,reroutes:state.reroutes,scrapCharges:state.scrapCharges,directives:state.directives,overclocks:state.overclocks,signal:state.signal,signalReady:state.signalReady,comboBanner:state.comboBanner,radioText:state.radioText,activationFX:state.activationFX.length,shipProfile:shipProfile(),records}))},
      setResources(v){Object.assign(state.resources,v);Object.assign(state.display,v);updateJumpReady();updateActions()},
      setSector(n){state.sector=SGK.clamp(n,1,30);state.deepOrbit=state.sector>5;state.gravityStage=0;state.cyclesUsed=0;state.maxCycles=maxCyclesForSector();state.event=chooseSectorEvent();state.phase='ready';state.runEnded=false;updateJumpReady();updateActions()},
      setEvent(id){state.event=EVENTS[id]||EVENTS.quiet;updateJumpReady();updateActions()},
      setBoard(ids){state.board=Array(GRID.cols*GRID.rows).fill(null);ids.slice(0,20).forEach((id,i)=>{if(id&&MODULES[id])state.board[i]=makeInstance(id)});updateJumpReady();updateActions()},
      forcePhase(p){state.phase=p;updateActions()},
      processActivationNow(){let guard=0;while(state.phase==='activating'&&guard++<100){if(state.activationQueue.length){const item=state.activationQueue.shift();activateModule(item.index,item)}else finishActivations()}if(state.phase==='cycleEnd'){state.cycleEndTimer=0;afterCycleEnd()}},
      completeJumpNow(){if(state.phase==='jump')completeJump()},
      forceVictory(){state.sector=5;state.sectorsCleared=5;state.escapeAchieved=true;unlockNextDistress();evaluateChallenges('escape');endRun(true,'ESCAPE SUCCESSFUL')},
      forceDefeat(reason='TEST FAILURE'){endRun(false,reason)},
      damageHull(amount=1){return takeHullDamage(amount,'DEBUG HULL DAMAGE',false)},
      addSignal(amount=1){addSignal(amount,-1);return state.signal},
      destroyAt(index){return destroyModule(index,'DEBUG DESTROY',false)},
      grantTools(){state.reroutes=Math.min(9,state.reroutes+3);state.scrapCharges=Math.min(9,state.scrapCharges+3);updateActions()},
      records(){return JSON.parse(JSON.stringify(records))},setDistress(n){state.distressLevel=SGK.clamp(n,1,10);state.maxCycles=maxCyclesForSector();updateJumpReady();updateActions();return state.distressLevel},newRunAtDistress(n){selectedDistress=SGK.clamp(n,1,10);SGK.Save.set('selectedDistress',selectedDistress);newRun(false);return state.distressLevel},enterDeepOrbit(){state.escapeAchieved=true;enterDeepOrbit();return state.sector},showChallenges(){showChallenges(false)}
    }
  };
})();

const soundBtn=document.getElementById('soundBtn');
function refreshSoundButton(){soundBtn.textContent=SGK.Audio.enabled?'SND✓':'SND×';soundBtn.style.color=SGK.Audio.enabled?'#aeefff':'#738995'}
refreshSoundButton();
soundBtn.onclick=()=>{SGK.Audio.unlock();SGK.Audio.setEnabled(!SGK.Audio.enabled);if(SGK.Audio.enabled)SGK.Audio.click();refreshSoundButton();SGK.UI.toast(SGK.Audio.enabled?'SOUND ON':'SOUND OFF',900)};
document.getElementById('helpBtn').onclick=()=>{SGK.Audio.unlock();SGK.Audio.click();DeadOrbit.showHelp()};
document.getElementById('kitBtn').onclick=()=>{SGK.Audio.unlock();SGK.Audio.click();DeadOrbit.showKit()};
document.getElementById('devBtn').onclick=()=>{SGK.Audio.unlock();SGK.Audio.click();SGK.UI.toggleDev()};
document.getElementById('devPanel').onclick=e=>{const cmd=e.target?.dataset?.dev;if(cmd)DeadOrbit.runDevCommand(cmd)};
document.getElementById('cycleBtn').onclick=()=>{SGK.Audio.unlock();SGK.Audio.click();if(DeadOrbit.state?.phase==='ended')DeadOrbit.newRun(true);else DeadOrbit.beginCycle()};
document.getElementById('jumpBtn').onclick=()=>{SGK.Audio.unlock();SGK.Audio.click();DeadOrbit.jump()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&SGK.Audio.ctx?.state==='running')SGK.Audio.ctx.suspend().catch(()=>{})});

window.__deadOrbitReady=true;

(function selfCheck(){
  const ids=new Set(MODULE_LIST.map(m=>m.id));
  if(MODULE_LIST.length!==48||ids.size!==48)throw new Error('Dead Orbit module library failed validation');
  if(GRID.cols*GRID.rows!==20)throw new Error('Dead Orbit grid failed validation');
  if(DIRECTIVE_LIST.length!==12||new Set(DIRECTIVE_LIST.map(d=>d.id)).size!==12)throw new Error('Dead Orbit directive library failed validation');
  if(OVERCLOCK_LIST.length!==12||new Set(OVERCLOCK_LIST.map(d=>d.id)).size!==12)throw new Error('Dead Orbit Overclock library failed validation');
  if(OVERCLOCK_LIST.some(o=>!DIRECTIVES[o.id]))throw new Error('Orphaned Overclock detected');
  if(CHALLENGES.length!==18||new Set(CHALLENGES.map(c=>c.id)).size!==18)throw new Error('Dead Orbit challenge library failed validation');
  if(DISTRESS_LEVELS.length!==11)throw new Error('Dead Orbit Distress ladder failed validation');
  for(const m of MODULE_LIST){if(!RARITY[m.rarity]||!RES[m.resource])throw new Error(`Invalid module metadata: ${m.id}`)}
  if(DRAFTABLE_MODULES.some(m=>m.tags.includes('junk')))throw new Error('Damaged systems leaked into normal drafts');
})();

DeadOrbit.showTitle();
