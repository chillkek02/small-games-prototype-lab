.buy:disabled{opacity:.35}
.bigAction{width:100%;min-height:56px;border-radius:15px;border:1px solid #5e7f91;background:#14364b;font-weight:1000;margin-top:8px}
.danger{background:#411828;border-color:#8f3c56}

</div></div>

 s.active*=1+lv('mouth')*1.05;s.global*=1+lv('core')*.13;s.active*=1+lv('stomach')*.38;s.rare+=lv('eye')*.018;s.auto*=1+lv('brain')*.28;s.active*=1+lv('claw')*.42;s.tent*=1+lv('tentacle')*.75;s.scav*=1+lv('larva')*.48;s.spore*=1+lv('spore')*.75;s.global*=1+lv('carapace')*.18;if(lv('mouth')>=3)s.active*=1.5;if(lv('eye')>=3)s.rare+=.04;if(lv('brain')>=3)s.auto*=1.3;if(lv('claw')>=3)s.active*=1.3;if(lv('carapace')>=3)s.global*=1.22;if(lv('core')>=3)s.global*=1.25;
 if(state.up.enzymes)s.global*=2;if(state.up.teeth)s.active*=1.6;if(state.up.pack)s.scav*=1.8;if(state.up.neural)s.auto*=1.7;if(state.up.cilia)s.auto*=1.08;if(hasAutomation()&&feedHeld){s.active*=1.25;s.auto*=1.08}if(colonyBalanced()){s.auto*=1.25;s.global*=1.12;s.rare+=.03}if(state.instincts.gorge>0){s.active*=2.5;s.global*=1.12}if(state.instincts.scan>0){s.rare+=.16;s.auto*=1.2}if(state.instincts.brood>0){s.auto*=2.25;s.scav*=1.5}
 if(gene('metabolism'))s.active*=Math.pow(3,gene('metabolism'));if(gene('birth'))s.auto*=1.55;if(gene('hunter'))s.rare+=.045*gene('hunter');
 const rm=state.research.metabolic||0,rc=state.research.colony||0;s.active*=1+rm*.28;s.global*=1+rm*.09;s.auto*=1+rc*.32;s.scav*=1+rc*.22;if(rm>=3)s.active*=1.8;if(rc>=3)s.hive*=1.55;
 if(state.lifeTrait==='maw')s.active*=1.9;if(state.lifeTrait==='hive'){s.auto*=1.75;s.hive*=1.35}s.lifeTrait==='brain'&&(s.rare+=.06,s.auto*=1.25);if(state.lifeTrait==='mutant')s.global*=1.35;if(state.adaptation==='synapse')s.auto*=1.15;if(state.adaptation==='brood')s.hive*=1.3;if(state.alpha&&state.alpha.hatched)s.global*=1+(state.alpha.level||1)*.025;
 if(state.event==='frenzy')s.active*=2.8;if(state.event==='hive'){s.auto*=2.4;s.scav*=1.5}s.event==='neural'&&(s.auto*=2.2,s.rare+=.12);if(state.event==='unstable')s.global*=3;
 for(const sy of activeSynergies())sy.apply(s);
 const ad=Math.pow(1.35,gene('adaptive'))*(state.lifeTrait==='mutant'?1.15:1);if(ad>1){s.active=1+(s.active-1)*ad;s.auto=1+(s.auto-1)*ad;s.scav=1+(s.scav-1)*ad;s.global=1+(s.global-1)*ad}
 const layerCount=state.brokenLayers.size;s.global*=1+layerCount*.18;if(layerCount>=2)s.auto*=1.16;if(layerCount>=3)s.active*=1.18;
 return s
}
function hasAutomation(){return !!(state.up.cilia||organLevel('tentacle')||organLevel('spore')||desiredScavs()>0)}
function colonyBalanced(){return desiredScavs()>=3&&state.jobs.forage>0&&state.jobs.sample>0&&state.jobs.tend>0}
function foodMult(){let m=1+organLevel('stomach')*.35+(state.research.metabolic||0)*.18;if(state.lifeTrait==='maw')m*=1.25;if(state.up.enzymes)m*=2;if(activeSynergies().some(x=>x.id==='ravenous'))m*=1.3;if(organLevel('stomach')>=3)m*=1.45;if(state.labModules.pump)m*=1.2;if(state.adaptation==='cascade')m*=1.5;return m}
function feedPower(){const s=stats();return 3.2*s.active*s.global*state.feedRamp}
function desiredScavs(){if(organLevel('larva')<=0&&!gene('birth'))return 0;let n=Math.floor(organLevel('larva')*2.2+state.lifetime/9000+(gene('birth')?2:0)+(state.up.hatching?3:0)+(state.research.colony>=3?4:0)+(state.lifeTrait==='hive'?3:0)+(state.instincts.brood>0?4:0)+(organLevel('larva')>=3?2:0)+(state.adaptation==='brood'?5:0));return Math.min(32,n)}
function normalizeJobs(){if(!state)return;const d=desiredScavs(),j=state.jobs;let total=j.forage+j.sample+j.tend;if(total<d)j.forage+=d-total;if(total>d){let excess=total-d;for(const k of ['forage','tend','sample']){const take=Math.min(excess,j[k]);j[k]-=take;excess-=take;if(excess<=0)break}}}
function assignJob(k,delta){normalizeJobs();const j=state.jobs;if(delta>0){const donors=['forage','sample','tend'].filter(x=>x!==k).sort((a,b)=>j[b]-j[a]);const d=donors.find(x=>j[x]>0);if(!d)return;j[d]--;j[k]++}else if(delta<0&&j[k]>0){j[k]--;j.forage++}normalizeJobs();renderGrowth();saveCurrent()}
function scavJob(i){normalizeJobs();if(i<state.jobs.forage)return'forage';if(i<state.jobs.forage+state.jobs.sample)return'sample';return'tend'}
function passiveComponents(){const s=stats(),spo=organLevel('spore'),ten=organLevel('tentacle'),tenders=state.jobs.tend||0;let cilia=(state.up.cilia?2.2:0)*s.auto*s.global,spores=spo*3.3*s.spore*s.hive*s.global,tentacles=ten*2.4*s.tent*s.auto*s.global,tend=tenders*2.6*s.auto*s.hive*s.global;if(organLevel('spore')>=3)spores*=1.4;if(organLevel('tentacle')>=3)tentacles*=1.4;if(state.lifeTrait==='hive')tend*=1.25;return{cilia,spores,tentacles,tend,scav:scavEstimate(),total:cilia+spores+tentacles+tend+scavEstimate()}}
function scavEstimate(){const s=stats(),workers=Math.max(0,(state.jobs.forage||0)+(state.jobs.sample||0));return workers*1.45*s.scav*s.auto*s.hive*s.global}
function passiveRate(){return passiveComponents().total*BIO_PACE}
function totalRate(){return passiveRate()+(feedHeld?feedPower()*5.3*BIO_PACE:0)}
function addBio(n,x=W*.5,y=H*.54,show=false){n=Math.max(0,n)*BIO_PACE;state.bio+=n;state.lifetime+=n;state.totalExperimentBio+=n;if(show)floatText(x,y,'+'+fmt(n),'#a8ff70')}
function addProtein(n,x=W*.5,y=H*.48,show=true){if(n<=0)return;state.protein+=n;rec.highestProtein=Math.max(rec.highestProtein,state.protein);if(show)floatText(x,y,'+'+fmt(n)+' P','#ffd266');if(show)sfx('rare')}

let AC=null;function audioUnlock(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}

function sfx(k){if(k==='click')tone(260,.035,'square',.025,40);if(k==='feed')tone(90+rnd(-15,15),.045,'sawtooth',.035,-25);if(k==='buy'){tone(380,.08,'triangle',.05,180);setTimeout(()=>tone(620,.07,'triangle',.03,120),55)}if(k==='rare'){tone(700,.12,'sine',.055,500);setTimeout(()=>tone(1100,.16,'sine',.035,300),80)}if(k==='milestone'){tone(240,.16,'triangle',.05,420);setTimeout(()=>tone(580,.22,'triangle',.04,420),80)}if(k==='alarm'){tone(190,.22,'square',.035,-30)}if(k==='molt'){tone(120,.6,'sawtooth',.05,620);setTimeout(()=>tone(360,.42,'sine',.04,400),250)}}
function particleBurst(x,y,color='#9dff63',n=18){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-110,110),vy:rnd(-160,20),life:rnd(.35,.8),size:rnd(2,6),color})}

function spawnInitialFood(){for(let i=0;i<7;i++)spawnFood()}
function spawnFood(force=null){if(foods.length>20)return;const s=stats(),prime=force==='prime',rare=prime||force==='rare'||Math.random()<s.rare;foods.push({id:Math.random(),x:rnd(75,W-75),y:rnd(H*.20,H*.58),r:prime?13:rare?9:rnd(4,7),rare,prime,pulse:rnd(0,6.28),value:prime?rnd(250,420):rare?rnd(45,85):rnd(3,8),claimed:false})}
function consumeManualFood(){if(!foods.length)return;let pool=foods.filter(f=>!f.claimed);if(!pool.length)pool=foods;let f=pool[Math.floor(Math.random()*pool.length)],i=foods.indexOf(f);if(i<0)return;foods.splice(i,1);particleBurst(f.x,f.y,f.prime?'#ffcb68':f.rare?'#ffd66f':'#9dff63',f.prime?36:f.rare?24:8);let chain=1;if(state.labModules.pump){const max=state.adaptation==='cascade'?15:10;state.feedChain=Math.min(max,(state.feedChain||0)+1);state.feedChainTimer=1.35;chain=1+state.feedChain*(state.adaptation==='cascade'?.07:.055)}addBio(f.value*foodMult()*chain,f.x,f.y,true);if(f.rare&&state.proteinUnlocked&&Math.random()<proteinChance()){let p=f.prime?4+Math.floor(Math.random()*4):1+Math.floor(Math.random()*3);if(state.adaptation==='cascade')p+=1;addProtein(p,f.x,f.y);popup(f.prime?tr().prime:tr().rare,'#ffd66f')}}
function proteinChance(){let c=.2+organLevel('eye')*.04+(gene('hunter')*.05);if(state.up.synthesis)c*=2;if(state.lifeTrait==='brain')c*=2;if(state.event==='neural')c*=1.8;if(state.instincts.scan>0)c*=2.4;return clamp(c,0,1)}
function spawnScav(){scavengers.push({x:W*.5+rnd(-18,18),y:H*.45+rnd(-12,12),state:'seek',target:null,carry:null,wob:rnd(0,6.28)});state.scavProduced++;if(!state.automationAt)state.automationAt=state.experimentTime}
function pickScavTarget(job){const free=foods.filter(f=>!f.claimed);if(!free.length)return null;if(job==='sample'){const rare=free.filter(f=>f.rare);if(rare.length)return rare.sort((a,b)=>b.value-a.value)[0]}return free.sort((a,b)=>b.value-a.value)[0]}
function moveToward(o,x,y,speed,dt,done){const dx=x-o.x,dy=y-o.y,d=Math.hypot(dx,dy);if(d<speed*dt+5){o.x=x;o.y=y;done();return}o.x+=dx/d*speed*dt;o.y+=dy/d*speed*dt}
function updateScavengers(dt){normalizeJobs();while(scavengers.length<desiredScavs())spawnScav();if(scavengers.length>desiredScavs())scavengers.splice(desiredScavs());const st=stats(),baseSpeed=clamp(70*(1+organLevel('brain')*.14)*(state.up.pack?1.8:1)*Math.sqrt(st.auto)*(state.instincts.brood>0?1.75:1)*(feedHeld?1.12:1),55,380);
 scavengers.forEach((sc,i)=>{const job=scavJob(i);sc.wob+=dt*5;if(job==='tend'){sc.target=null;sc.state='seek';const a=sc.wob+i*.6,r=80+(i%4)*10,tx=W*.5+Math.cos(a)*r,ty=H*.45+Math.sin(a)*r*.55;moveToward(sc,tx,ty,baseSpeed*.7,dt,()=>{});return}
  if(sc.state==='seek'){if(!sc.target||!foods.includes(sc.target)){if(sc.target)sc.target.claimed=false;sc.target=pickScavTarget(job);if(sc.target)sc.target.claimed=true}if(sc.target){moveToward(sc,sc.target.x,sc.target.y,baseSpeed,dt,()=>{const f=sc.target;if(!f)return;const idx=foods.indexOf(f);if(idx>=0)foods.splice(idx,1);sc.carry={value:f.value,rare:f.rare,prime:f.prime,x:f.x,y:f.y};sc.target=null;sc.state='return';sfx('feed')})}}
  else if(sc.state==='return'){moveToward(sc,W*.5,H*.45,baseSpeed*1.1,dt,()=>{if(!sc.carry){sc.state='seek';return}let v=sc.carry.value*1.25*foodMult()*st.scav*st.auto*st.hive*st.global;if(job==='forage')v*=1.45;if(job==='sample')v*=.82;addBio(v,W*.5+rnd(-20,20),H*.46,true);if(sc.carry.rare&&state.proteinUnlocked&&Math.random()<proteinChance()*(job==='sample'?1.65:.7))addProtein(sc.carry.prime?3:1,W*.5,H*.43);sc.carry=null;sc.state='seek'})}
 })}


function evolutionNeed(rank=state.evolutionRank){const e=EVOLUTIONS[rank];return e?e.need*milestoneMult():Infinity}

function instinctUnlocked(id){if(id==='gorge')return state.evolutionRank>=1&&organLevel('mouth')>0;if(id==='scan')return state.evolutionRank>=2&&organLevel('eye')>0;if(id==='brood')return state.evolutionRank>=3&&organLevel('larva')>0;return false}
const INSTINCT_DATA={gorge:{dur:5,cd:18},scan:{dur:8,cd:28},brood:{dur:10,cd:26}};
function useInstinct(id){if(!instinctUnlocked(id)||state.cooldowns[id]>0||state.instincts[id]>0)return;const d=INSTINCT_DATA[id];state.instincts[id]=d.dur;state.cooldowns[id]=d.cd;sfx('buy');if(id==='gorge'){state.feedRamp=3.25;for(let i=0;i<4;i++)spawnFood();popup(tr().gorge+'!','#ff83b9');particleBurst(W*.5,H*.45,'#ff7fb2',38)}if(id==='scan'){spawnFood('rare');spawnFood('rare');if(Math.random()<.35)spawnFood('prime');popup(tr().scan+'!','#70dcff');particleBurst(W*.5,H*.38,'#70dcff',42)}if(id==='brood'){while(scavengers.length<desiredScavs())spawnScav();popup(tr().brood+'!','#9dff63');particleBurst(W*.5,H*.5,'#9dff63',48)}updateInstinctUI();saveCurrent()}

function updateInstinctUI(){const bar=$('#instinctBar');if(!bar||!state)return;const ids=['gorge','scan','brood'].filter(instinctUnlocked),sig=ids.join('|');bar.classList.toggle('hidden',!ids.length);if(bar.dataset.sig!==sig){bar.dataset.sig=sig;bar.innerHTML='';ids.forEach(id=>{const b=document.createElement('button');b.className='instinctBtn';b.dataset.instinct=id;b.innerHTML='<b></b><small></small><i class="cd"></i>';b.onpointerdown=e=>{e.preventDefault();useInstinct(id)};bar.appendChild(b)})}ids.forEach(id=>{const d=INSTINCT_DATA[id],active=state.instincts[id]>0,cd=state.cooldowns[id]||0,b=bar.querySelector(`[data-instinct="${id}"]`);if(!b)return;b.className='instinctBtn '+(active?'active ':cd<=0?'ready ':'');b.disabled=active||cd>0;const label=id==='gorge'?tr().gorge:id==='scan'?tr().scan:tr().brood;b.querySelector('b').textContent=label;b.querySelector('small').textContent=active?state.instincts[id].toFixed(1)+'s':cd>0?cd.toFixed(0)+'s':(lang==='es'?'LISTO':'READY');b.querySelector('.cd').style.transform=`scaleX(${cd>0?clamp(cd/d.cd,0,1):0})`})}
function startEvent(force=null){const possible=force||choice(['frenzy',organLevel('larva')?'hive':'frenzy',organLevel('brain')?'neural':'frenzy','unstable','prime']);if(possible==='prime'){spawnFood('prime');popup(tr().prime,'#ffcb68');sfx('rare');return}state.event=possible;state.eventLeft=possible==='frenzy'?12:10;popup(possible==='frenzy'?tr().frenzy:possible==='hive'?tr().hiveSurge:possible==='neural'?tr().neuralOverdrive:tr().unstable,possible==='frenzy'?'#ff78ae':possible==='hive'?'#9dff63':possible==='neural'?'#70dcff':'#c17dff');flash(possible==='frenzy'?'#ff4e90':'#8f5cff',.15)}

function nextGoal(){if(!state)return tr().hold;if(state.lifetime<20)return tr().hold;if(!state.used.has('mouth'))return tr().mutation;if(evolutionReady())return tr().evoReady+' → '+EVOLUTIONS[state.evolutionRank][lang];let opts=[];Object.keys(ORG).filter(id=>id!=='core'&&unlockedOrgan(id)&&!state.used.has(id)).forEach(id=>{const c=organCost(id,1);if(c.protein===0||state.proteinUnlocked)opts.push({name:ORG[id][lang],bio:c.bio,protein:c.protein})});UPGRADES.filter(u=>state.lifetime>=u.unlock*milestoneMult()&&!state.up[u.id]).forEach(u=>opts.push({name:u[lang],bio:u.protein?0:u.cost,protein:u.protein||0}));LAB_MODULES.filter(m=>labModuleUnlocked(m.id)&&!state.labModules[m.id]).forEach(m=>opts.push({name:m[lang],bio:m.bio,protein:m.protein}));if(state.labModules.sequencer&&state.adaptation==='none')return tr().adaptation+' → '+(lang==='es'?'ELIGE PROTOCOLO':'CHOOSE PROTOCOL');opts.sort((a,b)=>(Math.max(0,a.bio-state.bio)+Math.max(0,a.protein-state.protein)*120)-(Math.max(0,b.bio-state.bio)+Math.max(0,b.protein-state.protein)*120));const evo=state.evolutionRank<EVOLUTIONS.length?EVOLUTIONS[state.evolutionRank]:null,evoRemain=evo?Math.max(0,evolutionNeed()-state.lifetime):Infinity;if(opts.length){const x=opts[0],need=Math.max(0,x.bio-state.bio)+Math.max(0,x.protein-state.protein)*120;if(need<=evoRemain*1.15)return `${x.bio?fmt(x.bio)+' B':''}${x.bio&&x.protein?' + ':''}${x.protein?x.protein+' P':''} → ${x.name}`}if(evo)return `${fmt(evolutionNeed())} B → ${evo[lang]}`;if(opts.length){const x=opts[0];return `${x.bio?fmt(x.bio)+' B':''}${x.bio&&x.protein?' + ':''}${x.protein?x.protein+' P':''} → ${x.name}`}if(!state.proteinUnlocked)return `${fmt(9000*milestoneMult())} B → ${tr().proteinUnlocked}`;if(!state.moltUnlocked)return `${fmt(moltThreshold())} B → ${tr().molt}`;if(state.molts<2)return tr().moltReady;return `${Math.ceil(containmentIntegrity())}% → ${tr().breach}`}

function update(dt){if(!running||!state||state.ended||moltTimer)return;state.experimentTime+=dt;state.lifecycleTime+=dt;rec.playTime+=dt;state.feedChainTimer=Math.max(0,(state.feedChainTimer||0)-dt);if(state.feedChainTimer<=0)state.feedChain=0;if(feedHeld){state.feedRamp=clamp(state.feedRamp+dt*.18,1,3.25);addBio(feedPower()*dt*5.3,W*.5,H*.48,Math.random()<dt*2.4);if(Math.random()<dt*5.5){consumeManualFood();sfx('feed')}}else state.feedRamp+=(1-state.feedRamp)*Math.min(1,dt*3);updateInstincts(dt);const p=passiveComponents();addBio((p.cilia+p.spores+p.tentacles+p.tend)*dt);if(Math.random()<dt*1.4*(state.labModules.pump?1.55:1))spawnFood();updateScavengers(dt);updateAlpha(dt);if(state.proteinUnlocked&&Math.random()<dt*(.012+organLevel('eye')*.006)*(state.up.synthesis?2:1)*(state.lifeTrait==='brain'?1.6:1))addProtein(1,W*rnd(.25,.75),H*.43,false);state.eventTimer-=dt;if(state.event){state.eventLeft-=dt;if(state.eventLeft<=0){state.event=null;state.eventLeft=0}}else if(state.eventTimer<=0){state.eventTimer=rnd(28,45);if(Math.random()<.7)startEvent()}milestones();synergyCheck();checkLayers();if(state.molts>=2&&containmentIntegrity()<=0)breach();const r=totalRate();state.peakRate=Math.max(state.peakRate,r);rec.highestRate=Math.max(rec.highestRate,r);rec.mostScav=Math.max(rec.mostScav,scavengers.length);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);autosaveTimer-=dt;if(autosaveTimer<=0){autosaveTimer=3;saveCurrent()}updateUI()}

function draw(){ctx.clearRect(0,0,W,H);const t=performance.now()/1000,alarm=state&&containmentIntegrity()<35;ctx.fillStyle=alarm?'#1b0b18':'#06111d';ctx.fillRect(0,0,W,H);let grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,alarm?'#481526':'#12324a');grd.addColorStop(.65,'#07131e');grd.addColorStop(1,'#040b11');ctx.fillStyle=grd;ctx.fillRect(22,125,W-44,H*.58);ctx.strokeStyle=alarm?'#ff557788':'#4cc6e355';ctx.lineWidth=5;ctx.strokeRect(34,142,W-68,H*.53);ctx.strokeStyle='#3f6273';ctx.lineWidth=7;for(let x=65;x<W-40;x+=95){ctx.beginPath();ctx.moveTo(x,145);ctx.lineTo(x,H*.67);ctx.stroke()}for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#173a49':'#0c2835';ctx.fillRect(48+i*108,155,70,26);ctx.fillStyle=alarm&&Math.sin(t*8+i)>0?'#ff445d':'#57e2ff';ctx.fillRect(55+i*108,162,10,8)}if(state)drawLabModules(t);foods.forEach(f=>{let p=1+Math.sin(t*4+f.pulse)*.16;ctx.beginPath();ctx.arc(f.x,f.y,f.r*p,0,7);ctx.fillStyle=f.prime?'#ffcb68':f.rare?'#ffd76a':'#a8ff72';ctx.shadowBlur=f.prime?24:f.rare?18:8;ctx.shadowColor=ctx.fillStyle;ctx.fill();ctx.shadowBlur=0});if(state)drawCreature(t);if(state){const broken=state.brokenLayers.size,cracks=broken*4+Math.floor((100-containmentIntegrity())/16);ctx.strokeStyle=containmentIntegrity()<35?'#ff8a91aa':'#a8eaff77';ctx.lineWidth=2;for(let i=0;i<cracks;i++){let x=42+(i*71)%520,y=175+(i%4)*62;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+20*(i%2?1:-1),y+28);ctx.lineTo(x+9*(i%2?1:-1),y+50);ctx.stroke()}}if(alarm){ctx.fillStyle=`rgba(255,30,60,${.05+.05*Math.sin(t*7)})`;ctx.fillRect(0,0,W,H)}ctx.fillStyle='#091822';ctx.fillRect(0,H*.68,W,H*.32);ctx.strokeStyle='#1d3948';for(let y=H*.7;y<H;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}drawScavs(t);drawAlpha(t);particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/.5,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()});ctx.globalAlpha=1}

function breach(){if(state.ended)return;state.ended=true;running=false;state.integrity=0;clearCurrent();sfx('alarm');flash('#ff314e',.35);shake(15,.7);particleBurst(W*.5,H*.4,'#ff6f8b',140);setTimeout(()=>{sfx('molt');rec.completions++;let secs=state.experimentTime;rec.fastest=!rec.fastest?secs:Math.min(rec.fastest,secs);saveRunDiscoveries();saveMeta();victoryModal()},800)}
function victoryModal(){const html=`<div style="text-align:center"><div style="font-size:34px;font-weight:1000;color:#ff76a8">${tr().victory}</div><p>${tr().breach}</p></div><div class="rowCard"><b>${tr().time}</b><b>${Math.floor(state.experimentTime/60)}:${String(Math.floor(state.experimentTime%60)).padStart(2,'0')}</b></div><div class="rowCard"><b>${tr().molts}</b><b>${state.molts}</b></div><div class="rowCard"><b>${tr().peak}</b><b>${fmt(state.peakRate)}/s</b></div><div class="rowCard"><b>${tr().synDisc}</b><b>${state.allSynergies.size}/${SY.length}</b></div><div class="rowCard"><b>${tr().orgUsed}</b><b>${state.used.size}</b></div><div class="rowCard"><b>${tr().scavs}</b><b>${state.scavProduced}</b></div><div class="rowCard"><b>${tr().alpha}</b><b>${state.alpha.hatched?'LV '+state.alpha.level+' • '+state.alpha.bites+' BITES':'—'}</b></div><button class="bigAction" id="again">${tr().playAgain}</button>`;openOverlay(tr().facility,'',html);$('#again').onclick=()=>{closeOverlay();state=null;startGame()}}
function devButtons(){const cmds=[['+1K BIOMASS',()=>addBio(1000/BIO_PACE)],['+1M BIOMASS',()=>addBio(1e6/BIO_PACE)],['+100 PROTEIN',()=>{state.proteinUnlocked=true;addProtein(100)}],['+10 DNA',()=>{perm.dna+=10;saveMeta()}],['UNLOCK ALL ORGANS',()=>{state.lifetime=Math.max(state.lifetime,30000);state.proteinUnlocked=true}],['UNLOCK ALL SOCKETS',()=>state.socketsUnlocked=9],['MAX CURRENT ORGANS',()=>state.organs.forEach(o=>{if(o)state.levels[o]=5})],['SPAWN 20 SCAVENGERS',()=>{state.levels.larva=Math.max(8,organLevel('larva'));normalizeJobs()}],['FORCE RARE DROP',()=>{state.proteinUnlocked=true;spawnFood('prime')}],['FORCE SYNERGY',()=>{state.socketsUnlocked=9;state.organs[1]='mouth';state.organs[2]='stomach';state.levels.mouth=Math.max(1,organLevel('mouth'));state.levels.stomach=Math.max(1,organLevel('stomach'));synergyCheck()}],['EVOLVE NOW',()=>{state.lifetime=Math.max(state.lifetime,evolutionNeed());evolveNow()}],['FORCE GORGE',()=>{state.evolutionRank=Math.max(1,state.evolutionRank);state.levels.mouth=Math.max(1,organLevel('mouth'));if(!state.organs.includes('mouth'))state.organs[1]='mouth';useInstinct('gorge')}],['FORCE FEEDING FRENZY',()=>startEvent('frenzy')],['FORCE HIVE SURGE',()=>startEvent('hive')],['FORCE NEURAL OVERDRIVE',()=>startEvent('neural')],['DEVOUR LAB MODULES',()=>{state.evolutionRank=Math.max(3,state.evolutionRank);state.proteinUnlocked=true;state.bio+=20000;state.protein+=100;for(const m of LAB_MODULES)if(!state.labModules[m.id])devourLab(m.id)}],['MAX ALPHA DEVOURER',()=>{state.alpha.hatched=true;state.alpha.level=5;state.alpha.xp=40}],['JUMP TO MOLT',()=>{addBio(Math.max(0,moltThreshold()-state.lifetime)/BIO_PACE);state.moltUnlocked=true}],['MOLT NOW',()=>doMolt(moltGain())],['JUMP TO ABOMINATION',()=>addBio(Math.max(0,70000-state.lifetime)/BIO_PACE)],['SET CONTAINMENT 10%',()=>state.persistentStress+=Math.max(0,containmentIntegrity()-10)],['FORCE CONTAINMENT BREACH',()=>{state.molts=Math.max(2,state.molts);state.persistentStress=110;breach()}],['SHOW PRODUCTION BREAKDOWN',()=>showProduction()],['SHOW TELEMETRY',()=>{devTele=!devTele;$('#telemetry').style.display=devTele?'block':'none'}],['SLOW MOTION',()=>toast('Use browser dev slowdown for capture')],['HIDE UI',()=>{uiHidden=!uiHidden;$('#hud').style.opacity=uiHidden?0:1;$('#bottom').style.opacity=uiHidden?0:1;$('#contain').style.opacity=uiHidden?0:1;$('#hint').style.opacity=uiHidden?0:1;$('#goalLine').style.opacity=uiHidden?0:1}],['RESET SAVE',resetConfirm]];const g=$('#devGrid');g.innerHTML='';cmds.forEach(([n,f])=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{audioUnlock();sfx('click');if(state)f();updateUI()};g.appendChild(b)})}
function showProduction(){const p=passiveComponents();openOverlay(lang==='es'?'DESGLOSE DE PRODUCCIÓN':'PRODUCTION BREAKDOWN','',`<div class="rowCard"><b>${lang==='es'?'ALIMENTACIÓN ACTIVA':'ACTIVE FEED'}</b><b>${fmt(feedPower()*5.3*BIO_PACE)}/s</b></div><div class="rowCard"><b>${lang==='es'?'CILIOS':'FEEDING CILIA'}</b><b>${fmt(p.cilia*BIO_PACE)}/s</b></div><div class="rowCard"><b>${lang==='es'?'RECOLECTORES':'SCAVENGERS'}</b><b>~${fmt(p.scav*BIO_PACE)}/s</b></div><div class="rowCard"><b>${lang==='es'?'ESPORAS':'SPORES'}</b><b>${fmt(p.spores*BIO_PACE)}/s</b></div><div class="rowCard"><b>${lang==='es'?'TENTÁCULOS':'TENTACLES'}</b><b>${fmt(p.tentacles*BIO_PACE)}/s</b></div><div class="rowCard"><b>${lang==='es'?'CUIDADORES':'NEST TENDERS'}</b><b>${fmt(p.tend*BIO_PACE)}/s</b></div>${state.alpha.hatched?`<div class="rowCard"><div><b>${tr().alpha}</b><small>${lang==='es'?'Cosecha por ráfagas + daño a contención':'Burst harvest + containment damage'}</small></div><b>LV ${state.alpha.level}</b></div>`:''}`)}
function inputDown(e){if(!running||!state||state.ended||moltTimer)return;audioUnlock();feedHeld=true;$('#feedBtn').classList.add('feeding');state.totalClicks++;if(e)e.preventDefault()}function inputUp(e){feedHeld=false;$('#feedBtn').classList.remove('feeding');if(e)e.preventDefault()}
$('#feedBtn').addEventListener('pointerdown',inputDown);window.addEventListener('pointerup',inputUp);window.addEventListener('pointercancel',inputUp);$('#closeOverlay').onclick=closeOverlay;$('#playBtn').onclick=startGame;$('#howBtn').onclick=openHow;$('#settingsBtn').onclick=openSettings;$('#languageBtn').onclick=()=>{$('#titleScreen').classList.add('hidden');$('#langScreen').classList.remove('hidden')};$$('[data-lang]').forEach(b=>b.onclick=()=>{setLang(b.dataset.lang);$('#langScreen').classList.add('hidden');showTitle()});$$('.tab').forEach(b=>b.onclick=()=>{if(b.classList.contains('locked'))return;sfx('click');let t=b.dataset.tab;if(t==='body')openBody();if(t==='growth')openGrowth();if(t==='genes')openGenes();if(t==='stats')openStats()});$('#rateBadge').onclick=showProduction;$('#devClose').onclick=()=>$('#devPanel').classList.remove('show');devButtons();window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='d'&&e.shiftKey)$('#devPanel').classList.toggle('show');if(e.code==='Space'&&!e.repeat)inputDown(e)});window.addEventListener('keyup',e=>{if(e.code==='Space')inputUp(e)});document.addEventListener('visibilitychange',()=>{if(document.hidden)saveCurrent()});window.addEventListener('beforeunload',saveCurrent);
function frame(ts){let dt=Math.min(.05,(ts-last)/1000);last=ts;update(dt);draw();if(devTele&&state)$('#telemetry').textContent=`experiment ${state.experimentTime.toFixed(1)}s / life ${state.lifecycleTime.toFixed(1)}s\nbio ${state.bio.toFixed(1)} / life ${state.lifetime.toFixed(1)}\nprotein ${state.protein.toFixed(1)} dna ${perm.dna}\nrate ${totalRate().toFixed(1)}/s passive ${passiveRate().toFixed(1)}\norgans ${state.organs.filter(Boolean).join(',')}\nsynergies ${[...state.synergies].join(',')}\nscav ${scavengers.length}/${desiredScavs()} jobs ${JSON.stringify(state.jobs)}\nresearch ${JSON.stringify(state.research)}\nevolution ${state.evolutionRank}/${EVOLUTIONS.length} instincts ${JSON.stringify(state.instincts)} cd ${JSON.stringify(state.cooldowns)}\ntrait ${state.lifeTrait} adapt ${state.adaptation} layers ${[...state.brokenLayers].join(',')}\nlab ${JSON.stringify(state.labModules)} alpha ${JSON.stringify({lv:state.alpha.level,xp:state.alpha.xp,bites:state.alpha.bites})}\nintegrity ${containmentIntegrity().toFixed(1)}% molts ${state.molts}`;requestAnimationFrame(frame)}
const savedRun=load(RUNSAVE,null);if(savedRun)state=restoreState(savedRun);applyText();if(!pref.lang){$('#langScreen').classList.remove('hidden')}else showTitle();requestAnimationFrame(frame);
</script>
