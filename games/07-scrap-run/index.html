<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#07141d" />
<title>Scrap Run — v3</title>
<style>
  :root {
    --ink: #eef7f4;
    --muted: #9db2b2;
    --panel: #102733;
    --panel-2: #163440;
    --line: #31525c;
    --accent: #f0bd4b;
    --cyan: #65d5dd;
    --danger: #ef6a58;
    --good: #78d596;
    --shadow: #020a0f;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 10%, #18343e 0%, #0a1820 42%, #040b10 100%);
    color: var(--ink);
    font-family: Inter, ui-rounded, "Arial Rounded MT Bold", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
  }

  button { font: inherit; }

  #shell {
    position: relative;
    width: min(100vw, 560px);
    height: min(100dvh, 980px);
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
    background: #07141d;
    box-shadow: 0 0 70px rgba(0, 0, 0, .58);
    border-inline: 1px solid rgba(116, 190, 194, .14);
  }

  #hud {
    position: relative;
    z-index: 5;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
    background: linear-gradient(180deg, #102935 0%, #0c202a 100%);
    border-bottom: 2px solid #326778;
    box-shadow: 0 5px 18px rgba(0,0,0,.3);
  }

  .hud-top {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 10px;
  }

  .brand {
    font-weight: 1000;
    letter-spacing: .6px;
    line-height: .9;
    font-size: clamp(20px, 5.7vw, 30px);
    text-shadow: 0 2px 0 #071016;
  }

  .bank {
    margin-top: 6px;
    font-size: clamp(12px, 3.4vw, 16px);
    font-weight: 900;
    color: var(--accent);
    letter-spacing: .2px;
  }

  .depth-block {
    text-align: right;
    font-weight: 900;
    line-height: 1.05;
    font-size: clamp(11px, 3.2vw, 15px);
    color: #d5e5e5;
  }

  .cargo-card {
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    min-height: 50px;
    padding: 6px 10px;
    border: 2px solid #4f7380;
    border-radius: 8px;
    background:
      linear-gradient(180deg, rgba(40, 79, 90, .45), rgba(14, 40, 51, .66));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.035);
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  .cargo-card.valuable {
    border-color: #55bd9a;
    background: linear-gradient(180deg, rgba(31, 91, 76, .55), rgba(13, 48, 45, .72));
    box-shadow: inset 0 0 18px rgba(105, 224, 177, .07);
  }

  .cargo-card.high-risk {
    border-color: #ef8b57;
    background: linear-gradient(180deg, rgba(112, 61, 35, .58), rgba(54, 29, 27, .78));
    box-shadow: 0 0 18px rgba(239, 106, 88, .12), inset 0 0 19px rgba(255, 176, 80, .06);
  }

  .cargo-card.jackpot {
    border-color: #ffd15f;
    background: linear-gradient(180deg, rgba(122, 82, 24, .62), rgba(53, 29, 19, .84));
    box-shadow: 0 0 24px rgba(255, 196, 72, .22), inset 0 0 24px rgba(255, 225, 134, .08);
    animation: cargoPulse 1.15s ease-in-out infinite alternate;
  }

  .cargo-card.returning {
    border-color: #f0bd4b;
  }

  @keyframes cargoPulse {
    from { box-shadow: 0 0 12px rgba(255, 196, 72, .14), inset 0 0 18px rgba(255, 225, 134, .05); }
    to { box-shadow: 0 0 30px rgba(255, 196, 72, .31), inset 0 0 28px rgba(255, 225, 134, .11); }
  }

  .cargo-copy { min-width: 0; }

  .cargo-label {
    color: #a9bec1;
    font-size: clamp(10px, 2.8vw, 13px);
    font-weight: 900;
    letter-spacing: .35px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cargo-value {
    color: #fff;
    font-size: clamp(22px, 6.2vw, 33px);
    font-weight: 1000;
    line-height: .95;
    text-shadow: 0 2px 0 rgba(0,0,0,.45);
  }

  .risk-word {
    color: var(--danger);
    font-size: .56em;
    margin-left: 4px;
    letter-spacing: .6px;
  }

  .cargo-count {
    color: #bfd2d3;
    font-size: clamp(10px, 2.8vw, 13px);
    font-weight: 850;
    text-align: right;
  }

  .hud-status {
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 21px;
    font-size: clamp(10px, 2.7vw, 13px);
    font-weight: 900;
    letter-spacing: .35px;
  }

  #statusText.outbound { color: var(--cyan); }
  #statusText.returning { color: var(--accent); }
  #armorText { color: #d8e8e5; text-align: right; }

  #contractBar {
    margin-top: 5px;
    min-height: 25px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 7px;
    padding: 4px 7px;
    border: 1px solid #31545e;
    border-radius: 7px;
    background: rgba(4, 16, 22, .45);
    color: #a9bfc0;
    font-size: clamp(9px, 2.35vw, 11px);
    font-weight: 900;
    letter-spacing: .25px;
    transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }

  #contractBar.complete {
    border-color: #68ce8d;
    background: rgba(29, 86, 59, .46);
    box-shadow: inset 0 0 14px rgba(120, 213, 150, .07);
  }

  .contract-tag {
    color: #0b1a1e;
    background: #f0bd4b;
    border-radius: 4px;
    padding: 2px 5px;
    font-size: 9px;
    font-weight: 1000;
    letter-spacing: .7px;
  }

  #contractText {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  #contractProgress {
    color: #f4d477;
    white-space: nowrap;
    text-align: right;
  }

  #contractBar.complete #contractProgress { color: #8ee3a8; }

  #gameWrap {
    position: relative;
    min-height: 0;
    overflow: hidden;
    background: #09141b;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    background: #0a151b;
  }

  #signalBanner {
    position: absolute;
    z-index: 4;
    top: 10px;
    left: 50%;
    width: min(92%, 430px);
    transform: translate(-50%, -140%);
    opacity: 0;
    pointer-events: none;
    padding: 9px 12px 8px;
    text-align: center;
    border-radius: 8px;
    border: 2px solid currentColor;
    background: rgba(8, 21, 28, .92);
    font-size: clamp(12px, 3.2vw, 15px);
    font-weight: 1000;
    letter-spacing: .8px;
    box-shadow: 0 8px 25px rgba(0,0,0,.42), inset 0 0 18px rgba(255,255,255,.04);
    transition: transform .24s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
  }

  #signalBanner.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }

  #modal {
    position: absolute;
    z-index: 10;
    inset: 9px;
    display: grid;
    place-items: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .16s ease;
  }

  #modal.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    width: min(100%, 455px);
    max-height: 96%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 15px;
    border-radius: 14px;
    border: 2px solid #3e6974;
    background:
      linear-gradient(180deg, rgba(19, 48, 60, .985), rgba(8, 25, 34, .985));
    box-shadow: 0 18px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07);
    text-align: center;
  }

  .modal-kicker {
    color: var(--accent);
    font-size: 11px;
    font-weight: 1000;
    letter-spacing: 1.2px;
  }

  .modal-title {
    margin: 3px 0 6px;
    font-size: clamp(25px, 7vw, 37px);
    line-height: .95;
    font-weight: 1000;
    letter-spacing: .35px;
    text-shadow: 0 3px 0 rgba(0,0,0,.35);
  }

  .modal-title.good { color: var(--good); }
  .modal-title.bad { color: var(--danger); }

  .modal-summary {
    color: #bfd0d0;
    font-size: clamp(12px, 3.1vw, 14px);
    line-height: 1.35;
    margin-bottom: 11px;
  }

  .haul-number {
    display: block;
    margin: 4px 0;
    color: var(--accent);
    font-size: clamp(25px, 6.8vw, 34px);
    font-weight: 1000;
  }

  .haul-breakdown {
    display: block;
    margin-top: 7px;
    color: #95b1b1;
    font-size: 10px;
    font-weight: 850;
    letter-spacing: .3px;
  }

  .order-result {
    display: block;
    margin: 8px auto 2px;
    width: fit-content;
    max-width: 100%;
    padding: 5px 9px;
    border: 1px solid #4f6870;
    border-radius: 7px;
    background: rgba(4, 15, 20, .42);
    color: #aebfc1;
    font-size: 10px;
    font-weight: 1000;
    letter-spacing: .35px;
  }

  .order-result.good { border-color: #5fbd7d; color: #8ee3a8; }
  .order-result.bad { border-color: #7d554b; color: #d49a8d; }

  .primary-btn,
  .upgrade-btn,
  .side-btn {
    border: 0;
    border-radius: 9px;
    color: #071319;
    font-weight: 1000;
    letter-spacing: .35px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .primary-btn {
    width: 100%;
    min-height: 48px;
    padding: 10px 14px;
    background: linear-gradient(180deg, #ffd66c, #dfa735);
    box-shadow: 0 4px 0 #79571f, 0 8px 17px rgba(0,0,0,.28);
    font-size: clamp(15px, 4vw, 18px);
  }

  .primary-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #79571f; }

  .instructions {
    margin: 10px 0 12px;
    padding: 9px 10px;
    border-radius: 9px;
    background: rgba(4, 14, 20, .48);
    color: #c4d8d8;
    font-size: clamp(11px, 2.9vw, 13px);
    line-height: 1.35;
  }

  .upgrade-title {
    margin: 13px 0 7px;
    color: #d8e7e5;
    font-size: 12px;
    font-weight: 1000;
    letter-spacing: .8px;
  }

  .upgrade-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .upgrade-card {
    min-width: 0;
    padding: 8px 6px 7px;
    border-radius: 9px;
    border: 1px solid #375965;
    background: rgba(21, 50, 61, .73);
  }

  .upgrade-name {
    font-size: clamp(10px, 2.7vw, 12px);
    font-weight: 1000;
    color: #eef8f5;
  }

  .upgrade-level {
    margin-top: 2px;
    color: var(--cyan);
    font-size: 10px;
    font-weight: 900;
  }

  .upgrade-effect {
    min-height: 31px;
    margin: 4px 0 6px;
    color: #a9c0c0;
    font-size: clamp(8px, 2.1vw, 10px);
    line-height: 1.2;
  }

  .upgrade-btn {
    width: 100%;
    min-height: 31px;
    padding: 5px 3px;
    background: linear-gradient(180deg, #75dce1, #48aeb8);
    box-shadow: 0 3px 0 #225f67;
    font-size: clamp(9px, 2.3vw, 11px);
  }

  .upgrade-btn:disabled {
    color: #7f9697;
    background: #243b43;
    box-shadow: 0 3px 0 #14242a;
    cursor: default;
  }

  .stats-row {
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px solid #2b4c57;
    color: #8fa8aa;
    font-size: 10px;
    line-height: 1.4;
  }

  #controls {
    position: relative;
    z-index: 5;
    min-height: 120px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: minmax(72px, 1fr) 132px minmax(72px, 1fr);
    align-items: center;
    gap: 9px;
    background: linear-gradient(180deg, #0d222c, #09171f);
    border-top: 2px solid #244754;
  }

  .control-side {
    display: grid;
    gap: 7px;
    justify-items: stretch;
  }

  .control-hint {
    color: #718d91;
    font-size: 9px;
    font-weight: 900;
    line-height: 1.25;
    text-align: center;
    letter-spacing: .3px;
  }

  .side-btn {
    min-height: 52px;
    padding: 7px 5px;
    color: #dcebea;
    background: linear-gradient(180deg, #1d4653, #14333e);
    border: 1px solid #3b6874;
    box-shadow: 0 3px 0 #061016;
    font-size: clamp(10px, 2.7vw, 13px);
  }

  .side-btn.action {
    color: #181105;
    background: linear-gradient(180deg, #ffd56a, #dda438);
    border-color: #ffe49a;
    box-shadow: 0 3px 0 #76551e;
  }

  .side-btn.action.returning {
    color: #eaf8f6;
    background: linear-gradient(180deg, #3c707b, #244d58);
    border-color: #5f929d;
    box-shadow: 0 3px 0 #102930;
  }

  .side-btn:disabled {
    opacity: .42;
    filter: grayscale(.4);
  }

  .dpad {
    width: 132px;
    height: 104px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 5px;
  }

  .dir-btn {
    position: relative;
    border: 1px solid #456c76;
    border-radius: 10px;
    background: linear-gradient(180deg, #204653, #15323d);
    box-shadow: 0 4px 0 #061219, inset 0 1px 0 rgba(255,255,255,.07);
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  .dir-btn:active,
  .dir-btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #061219, inset 0 1px 0 rgba(255,255,255,.04);
  }

  .dir-btn.up { grid-column: 2; grid-row: 1; }
  .dir-btn.left { grid-column: 1; grid-row: 2; }
  .dir-btn.down { grid-column: 2; grid-row: 2; }
  .dir-btn.right { grid-column: 3; grid-row: 2; }

  .chev {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 15px;
    height: 15px;
    border-top: 4px solid #d8e9e8;
    border-left: 4px solid #d8e9e8;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.35));
  }

  .up .chev { transform: translate(-50%, -35%) rotate(45deg); }
  .left .chev { transform: translate(-35%, -50%) rotate(-45deg); }
  .down .chev { transform: translate(-50%, -65%) rotate(-135deg); }
  .right .chev { transform: translate(-65%, -50%) rotate(135deg); }

  @media (max-height: 690px) {
    #hud { padding-top: calc(5px + env(safe-area-inset-top)); padding-bottom: 5px; }
    .cargo-card { min-height: 43px; margin-top: 5px; }
    #contractBar { min-height: 21px; margin-top: 3px; padding: 2px 5px; }
    #controls { min-height: 105px; padding-top: 5px; }
    .dpad { height: 90px; }
    .side-btn { min-height: 43px; }
  }

  @media (min-width: 760px) {
    #shell { border-radius: 14px; margin-top: max(0px, calc((100dvh - min(100dvh, 980px)) / 2)); }
  }
</style>
</head>
<body>
<main id="shell" aria-label="Scrap Run game">
  <header id="hud">
    <div class="hud-top">
      <div>
        <div class="brand">SCRAP RUN</div>
        <div class="bank">BANKED <span id="bankedValue">0</span></div>
      </div>
      <div class="depth-block">
        <div>DEPTH <span id="depthValue">0</span></div>
        <div>BEST <span id="bestValue">0</span></div>
      </div>
    </div>

    <div class="cargo-card" id="cargoCard">
      <div class="cargo-copy">
        <div class="cargo-label" id="cargoLabel">UNBANKED CARGO — RETURN HOME TO KEEP IT</div>
        <div class="cargo-value"><span id="cargoValue">0</span><span class="risk-word">AT RISK</span></div>
      </div>
      <div class="cargo-count"><span id="cargoCount">0</span> ITEMS</div>
    </div>

    <div class="hud-status">
      <span id="statusText" class="outbound">OUTBOUND — PUSH DEEPER OR TURN BACK</span>
      <span id="armorText">ARMOR: NONE</span>
    </div>

    <div id="contractBar" aria-live="polite">
      <span class="contract-tag">ORDER</span>
      <span id="contractText">NEW ORDER WHEN EXPEDITION STARTS</span>
      <span id="contractProgress">—</span>
    </div>
  </header>

  <section id="gameWrap">
    <canvas id="game" aria-label="Scrap Run playfield"></canvas>
    <div id="signalBanner" aria-live="polite"></div>
    <div id="modal" class="open" aria-modal="true" role="dialog">
      <div class="modal-card" id="modalCard"></div>
    </div>
  </section>

  <footer id="controls">
    <div class="control-side">
      <button id="soundBtn" class="side-btn" type="button">SOUND ON</button>
      <div class="control-hint">SWIPE THE PLAYFIELD<br>OR USE WASD / ARROWS</div>
    </div>

    <div class="dpad" aria-label="Directional controls">
      <button class="dir-btn up" data-dir="up" aria-label="Move forward"><span class="chev"></span></button>
      <button class="dir-btn left" data-dir="left" aria-label="Move left"><span class="chev"></span></button>
      <button class="dir-btn down" data-dir="down" aria-label="Move backward"><span class="chev"></span></button>
      <button class="dir-btn right" data-dir="right" aria-label="Move right"><span class="chev"></span></button>
    </div>

    <div class="control-side">
      <button id="returnBtn" class="side-btn action" type="button" disabled>TURN BACK</button>
      <div class="control-hint">PRESS R TO RETURN<br>RETRACE THE SAME LANES</div>
    </div>
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Constants and DOM
  // ---------------------------------------------------------------------------

  const STORAGE_KEY = 'scrapRunSave';
  const LEGACY_STORAGE_KEYS = ['scrapRunChatGPTV1'];
  const COLS = 9;
  const VIEW_W = 480;
  const GRID_MARGIN = 6;
  const CELL = (VIEW_W - GRID_MARGIN * 2) / COLS;
  const LANE_H = 56;
  const MAX_UPGRADE_LEVEL = 3;

  const RARITIES = [
    { id: 'common', name: 'SCRAP', label: 'COMMON SCRAP', color: '#c4d0ca', glow: '#8eaaa0', min: 18, max: 34 },
    { id: 'uncommon', name: 'COMPONENT', label: 'UNCOMMON COMPONENT', color: '#73d69a', glow: '#55bd7c', min: 45, max: 78 },
    { id: 'rare', name: 'POWER CELL', label: 'RARE CACHE', color: '#62d8f0', glow: '#46bce9', min: 110, max: 185 },
    { id: 'epic', name: 'PROTOTYPE TECH', label: 'EPIC TECH', color: '#c683ff', glow: '#9d52ef', min: 270, max: 470 },
    { id: 'legendary', name: 'LEGENDARY SALVAGE', label: 'LEGENDARY SALVAGE', color: '#ffd15f', glow: '#ff9d35', min: 760, max: 1300 }
  ];

  const UPGRADE_COSTS = {
    armor: [240, 650, 1500],
    magnet: [200, 550, 1300],
    boots: [220, 600, 1400]
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const gameWrap = document.getElementById('gameWrap');
  const modal = document.getElementById('modal');
  const modalCard = document.getElementById('modalCard');
  const signalBanner = document.getElementById('signalBanner');
  const bankedValue = document.getElementById('bankedValue');
  const depthValue = document.getElementById('depthValue');
  const bestValue = document.getElementById('bestValue');
  const cargoCard = document.getElementById('cargoCard');
  const cargoLabel = document.getElementById('cargoLabel');
  const cargoValue = document.getElementById('cargoValue');
  const cargoCount = document.getElementById('cargoCount');
  const statusText = document.getElementById('statusText');
  const armorText = document.getElementById('armorText');
  const returnBtn = document.getElementById('returnBtn');
  const soundBtn = document.getElementById('soundBtn');
  const contractBar = document.getElementById('contractBar');
  const contractText = document.getElementById('contractText');
  const contractProgress = document.getElementById('contractProgress');

  // ---------------------------------------------------------------------------
  // Persistent data
  // ---------------------------------------------------------------------------

  const defaultSave = () => ({
    banked: 0,
    upgrades: { armor: 0, magnet: 0, boots: 0 },
    bestDepth: 0,
    largestHaul: 0,
    highestLoot: 0,
    totalExtractions: 0,
    totalDeaths: 0,
    largestCargoLost: 0,
    ordersCompleted: 0,
    totalCargoBanked: 0,
    muted: false
  });

  function loadSave() {
    try {
      let raw = localStorage.getItem(STORAGE_KEY);
      let migrated = false;
      if (!raw) {
        for (const key of LEGACY_STORAGE_KEYS) {
          raw = localStorage.getItem(key);
          if (raw) { migrated = true; break; }
        }
      }
      if (!raw) return defaultSave();
      const parsed = JSON.parse(raw);
      const base = defaultSave();
      const merged = {
        ...base,
        ...parsed,
        upgrades: { ...base.upgrades, ...(parsed.upgrades || {}) }
      };
      if (migrated) localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
      return merged;
    } catch (err) {
      console.warn('Save data could not be read; starting fresh.', err);
      return defaultSave();
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
    } catch (err) {
      console.warn('Save data could not be written.', err);
    }
  }

  let save = loadSave();
  let displayBank = save.banked;
  let bankTween = null;

  // ---------------------------------------------------------------------------
  // Audio
  // ---------------------------------------------------------------------------

  let audioCtx = null;

  function ensureAudio() {
    if (save.muted) return null;
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function buzz(pattern) {
    try {
      if ('vibrate' in navigator) navigator.vibrate(pattern);
    } catch (_) {}
  }

  function tone({ freq = 440, endFreq = null, duration = 0.08, type = 'square', volume = 0.05, delay = 0 }) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq != null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  const sfx = {
    hop() { tone({ freq: 170, endFreq: 240, duration: .055, type: 'triangle', volume: .025 }); },
    land() { tone({ freq: 105, endFreq: 70, duration: .055, type: 'sine', volume: .035 }); },
    blocked() { tone({ freq: 90, endFreq: 75, duration: .05, type: 'square', volume: .022 }); },
    near() { tone({ freq: 660, endFreq: 880, duration: .07, type: 'triangle', volume: .032 }); },
    warning() {
      tone({ freq: 250, endFreq: 220, duration: .10, type: 'square', volume: .032 });
      tone({ freq: 360, endFreq: 330, duration: .10, type: 'square', volume: .026, delay: .12 });
    },
    crusher() {
      tone({ freq: 88, endFreq: 42, duration: .17, type: 'sawtooth', volume: .055 });
      tone({ freq: 46, endFreq: 33, duration: .20, type: 'square', volume: .035, delay: .015 });
    },
    armor() {
      tone({ freq: 130, endFreq: 65, duration: .18, type: 'sawtooth', volume: .05 });
      tone({ freq: 520, endFreq: 260, duration: .16, type: 'square', volume: .025, delay: .02 });
    },
    death() {
      tone({ freq: 180, endFreq: 42, duration: .36, type: 'sawtooth', volume: .065 });
      tone({ freq: 90, endFreq: 35, duration: .42, type: 'square', volume: .035, delay: .04 });
    },
    turn() {
      tone({ freq: 330, endFreq: 520, duration: .11, type: 'triangle', volume: .04 });
      tone({ freq: 520, endFreq: 420, duration: .11, type: 'triangle', volume: .03, delay: .08 });
    },
    pickup(rarityIndex) {
      const base = [350, 430, 550, 650, 760][rarityIndex];
      tone({ freq: base, endFreq: base * 1.32, duration: .09, type: 'triangle', volume: .04 });
      if (rarityIndex >= 2) tone({ freq: base * 1.5, endFreq: base * 1.9, duration: .14, type: 'sine', volume: .026, delay: .07 });
      if (rarityIndex >= 4) tone({ freq: 440, endFreq: 880, duration: .28, type: 'sine', volume: .035, delay: .12 });
    },
    extract() {
      [0, .09, .18, .28].forEach((delay, i) => tone({ freq: [330, 440, 550, 720][i], endFreq: [420, 560, 700, 980][i], duration: .18, type: 'triangle', volume: .045, delay }));
    },
    buy() {
      tone({ freq: 420, endFreq: 650, duration: .09, type: 'square', volume: .035 });
      tone({ freq: 620, endFreq: 840, duration: .1, type: 'triangle', volume: .03, delay: .07 });
    },
    order() {
      tone({ freq: 390, endFreq: 520, duration: .09, type: 'triangle', volume: .032 });
      tone({ freq: 520, endFreq: 760, duration: .15, type: 'sine', volume: .028, delay: .08 });
    },
    railWarn() {
      tone({ freq: 720, endFreq: 680, duration: .075, type: 'square', volume: .026 });
      tone({ freq: 720, endFreq: 680, duration: .075, type: 'square', volume: .026, delay: .16 });
    },
    train() {
      tone({ freq: 62, endFreq: 42, duration: .25, type: 'sawtooth', volume: .046 });
      tone({ freq: 94, endFreq: 58, duration: .22, type: 'square', volume: .021, delay: .03 });
    },
    record() {
      tone({ freq: 520, endFreq: 760, duration: .12, type: 'triangle', volume: .03 });
      tone({ freq: 780, endFreq: 1040, duration: .16, type: 'sine', volume: .024, delay: .09 });
    }
  };

  // ---------------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------------

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(t) { return t * t * (3 - 2 * t); }
  function mod(n, m) { return ((n % m) + m) % m; }
  function randRange(rng, min, max) { return min + (max - min) * rng(); }
  function randInt(rng, min, max) { return Math.floor(randRange(rng, min, max + 1)); }
  function choice(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function formatNumber(n) { return Math.max(0, Math.round(n)).toLocaleString('en-US'); }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function rng() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function roundRectPath(context, x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    context.beginPath();
    context.moveTo(x + rr, y);
    context.arcTo(x + w, y, x + w, y + h, rr);
    context.arcTo(x + w, y + h, x, y + h, rr);
    context.arcTo(x, y + h, x, y, rr);
    context.arcTo(x, y, x + w, y, rr);
    context.closePath();
  }

  function laneCenterY(depth) {
    return playerAnchorY() - (depth - run.cameraDepth) * LANE_H;
  }

  function colCenterX(col) {
    return GRID_MARGIN + (col + .5) * CELL;
  }

  function playerAnchorY() {
    return viewH * .67;
  }

  function weightedPick(rng, entries) {
    const total = entries.reduce((sum, item) => sum + Math.max(0, item.weight), 0);
    let roll = rng() * total;
    for (const item of entries) {
      roll -= Math.max(0, item.weight);
      if (roll <= 0) return item.value;
    }
    return entries[entries.length - 1].value;
  }

  const ZONES = [
    { id: 'outer', name: 'OUTER YARD', start: 0, accent: '#65d5dd', ground: '#24433c' },
    { id: 'freight', name: 'FREIGHT BELT', start: 12, accent: '#f0bd4b', ground: '#394038' },
    { id: 'deep', name: 'DEEP WORKS', start: 25, accent: '#c683ff', ground: '#343846' },
    { id: 'forgotten', name: 'FORGOTTEN LINE', start: 40, accent: '#ef8b57', ground: '#40342f' }
  ];

  function zoneForDepth(depth) {
    let zone = ZONES[0];
    for (const candidate of ZONES) if (depth >= candidate.start) zone = candidate;
    return zone;
  }

  function zoneGateAtDepth(depth) {
    return ZONES.find(zone => zone.start === depth && zone.start > 0) || null;
  }

  // ---------------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------------

  const run = {
    state: 'home',
    seed: 0,
    rng: mulberry32(1),
    lanes: new Map(),
    lastGenerated: -1,
    consecutiveHazards: 0,
    cameraDepth: 0,
    elapsed: 0,
    returning: false,
    cargoValue: 0,
    cargoItems: 0,
    runMaxDepth: 0,
    armorCharges: 0,
    nextTemptationDepth: 9,
    signalCooldown: 0,
    cargoByRarity: [0, 0, 0, 0, 0],
    bestItemThisRun: 0,
    cargoPromptIndex: 0,
    nearMisses: 0,
    returnStartDepth: 0,
    returnHalfShown: false,
    returnCloseShown: false,
    order: null,
    orderComplete: false,
    orderNotified: false,
    armorHits: 0,
    lastZoneId: 'outer',
    previousBestDepth: 0,
    newBestAnnounced: false,
    overlayDelay: 0,
    pendingOverlay: null,
    qaInvulnerable: false
  };

  const player = {
    col: 4,
    depth: 0,
    renderCol: 4,
    renderDepth: 0,
    hop: null,
    queue: [],
    blockedDelay: 0,
    invuln: 0,
    flash: 0,
    lastFacing: 'up',
    landingSquash: 0,
    nearCooldown: 0
  };

  let viewH = 620;
  let lastFrame = performance.now();
  let particles = [];
  let floaters = [];
  let shake = 0;
  let flashOverlay = 0;
  let swipeStart = null;
  let signalTimer = 0;
  let signalTargetDepth = null;
  let modalMode = 'start';
  let modalPayload = null;

  // ---------------------------------------------------------------------------
  // Canvas sizing
  // ---------------------------------------------------------------------------

  function resizeCanvas() {
    const rect = gameWrap.getBoundingClientRect();
    const dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);
    viewH = clamp(VIEW_W * (rect.height / Math.max(1, rect.width)), 410, 790);
    canvas.width = Math.round(VIEW_W * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }

  const resizeObserver = new ResizeObserver(resizeCanvas);
  resizeObserver.observe(gameWrap);
  window.addEventListener('resize', resizeCanvas, { passive: true });
  resizeCanvas();

  // ---------------------------------------------------------------------------
  // Lane and loot generation
  // ---------------------------------------------------------------------------

  function makeDecorations(rng, type) {
    const amount = type === 'safe' ? randInt(rng, 4, 8) : randInt(rng, 1, 3);
    const items = [];
    for (let i = 0; i < amount; i++) {
      items.push({
        x: randRange(rng, 12, VIEW_W - 12),
        y: randRange(rng, -LANE_H * .38, LANE_H * .38),
        size: randRange(rng, 2, 6),
        kind: randInt(rng, 0, 3),
        rot: randRange(rng, 0, Math.PI * 2)
      });
    }
    return items;
  }

  function makeTraffic(depth, type, rng) {
    const isFast = type === 'fast';
    const isIndustrial = type === 'industrial';
    const direction = rng() < .5 ? -1 : 1;
    const depthFactor = 1 + Math.min(depth, 65) * .008;
    const speedBase = isFast ? randRange(rng, 125, 158) : isIndustrial ? randRange(rng, 58, 82) : randRange(rng, 77, 107);
    let count;
    if (depth < 8) count = 2;
    else if (depth < 20) count = rng() < .55 ? 2 : 3;
    else count = rng() < .25 ? 2 : rng() < .82 ? 3 : 4;
    if (isIndustrial) count = Math.min(count, 3);

    const margin = 150;
    const cycle = VIEW_W + margin * 2;
    const spacing = cycle / count;
    const vehicles = [];
    const palette = ['#dd6d49', '#51aabd', '#e7b44f', '#d8e3dc', '#8c76c9', '#65bd83'];
    const pattern = !isIndustrial && count >= 3 && rng() < .42 ? 'convoy' : 'even';
    const convoyBases = count === 3
      ? [0, spacing * .70, spacing * 2]
      : [0, spacing * .72, spacing * 2, spacing * 2.72];

    for (let i = 0; i < count; i++) {
      const kindRoll = rng();
      let kind = 'car';
      let width = randRange(rng, 57, 76);
      if (isIndustrial) {
        kind = 'forklift';
        width = randRange(rng, 82, 101);
      } else if (kindRoll > .68) {
        kind = 'truck';
        width = randRange(rng, 94, 124);
      } else if (kindRoll > .48) {
        kind = 'van';
        width = randRange(rng, 75, 91);
      }
      width = Math.min(width, spacing - 68);
      const base = pattern === 'convoy' ? convoyBases[i] : i * spacing;
      vehicles.push({
        base: base + randRange(rng, -spacing * .045, spacing * .045),
        width,
        height: isIndustrial ? 34 : kind === 'truck' ? 33 : 29,
        kind,
        color: choice(rng, palette),
        lastNearAt: -99,
        accent: choice(rng, ['#d8f2ef', '#f9d98c', '#92dce5'])
      });
    }

    return {
      direction,
      speed: speedBase * depthFactor,
      cycle,
      margin,
      phase: randRange(rng, 0, cycle),
      pattern,
      vehicles
    };
  }

  function makeRail(depth, rng) {
    const direction = rng() < .5 ? -1 : 1;
    const length = randRange(rng, 235, 305);
    const depthFactor = 1 + Math.min(depth, 70) * .0032;
    const speed = randRange(rng, 205, 248) * depthFactor;
    const gap = randRange(rng, 350, 470);
    const cycle = VIEW_W + length + gap;
    return {
      direction,
      length,
      speed,
      gap,
      cycle,
      phase: randRange(rng, 0, cycle),
      color: choice(rng, ['#b85f3f', '#d19338', '#517b86']),
      lastWarnCycle: -1,
      lastPassCycle: -1
    };
  }

  function railTiming(lane) {
    const rail = lane.rail;
    const distance = rail.phase + rail.speed * run.elapsed;
    const cycle = Math.floor(distance / rail.cycle);
    const progress = mod(distance, rail.cycle);
    const x = rail.direction > 0
      ? progress - rail.length / 2
      : VIEW_W + rail.length / 2 - progress;
    const left = x - rail.length / 2;
    const right = x + rail.length / 2;
    const visible = right > -8 && left < VIEW_W + 8;
    const timeUntilEntry = (rail.cycle - progress) / rail.speed;
    return {
      x,
      left,
      right,
      visible,
      warning: !visible && timeUntilEntry <= .88,
      timeUntilEntry,
      cycle
    };
  }

  function makeCrusher(depth, rng) {
    const evenFirst = rng() < .5;
    const even = [0, 2, 4, 6, 8];
    const odd = [1, 3, 5, 7];
    const period = clamp(randRange(rng, 3.05, 3.65) - Math.min(depth, 55) * .006, 2.62, 3.65);
    return {
      period,
      offset: randRange(rng, 0, period),
      activeDuration: .34,
      warningDuration: .68,
      patterns: evenFirst ? [even, odd] : [odd, even],
      lastSlamCycle: -1
    };
  }

  function crusherTiming(lane) {
    const crusher = lane.crusher;
    const total = run.elapsed + crusher.offset;
    const cycle = Math.floor(total / crusher.period);
    const phase = mod(total, crusher.period);
    const activeColumns = crusher.patterns[mod(cycle, 2)];
    const nextColumns = crusher.patterns[mod(cycle + 1, 2)];
    if (phase < crusher.activeDuration) {
      return { state: 'slam', columns: activeColumns, cycle, amount: 1 - phase / crusher.activeDuration };
    }
    if (phase > crusher.period - crusher.warningDuration) {
      return {
        state: 'warning',
        columns: nextColumns,
        cycle: cycle + 1,
        amount: (phase - (crusher.period - crusher.warningDuration)) / crusher.warningDuration
      };
    }
    return { state: 'idle', columns: activeColumns, cycle, amount: 0 };
  }

  function rollRarity(depth, forcedTier = null) {
    if (forcedTier != null) return clamp(forcedTier, 0, RARITIES.length - 1);
    const d = clamp(depth / 55, 0, 1);
    const entries = [
      { value: 0, weight: .70 - .39 * d },
      { value: 1, weight: .235 + .05 * d },
      { value: 2, weight: .055 + .18 * d },
      { value: 3, weight: .009 + .125 * d },
      { value: 4, weight: .001 + .035 * d }
    ];
    return weightedPick(run.rng, entries);
  }

  function makeLoot(depth, laneType, forcedTier = null) {
    const rarityIndex = rollRarity(depth, forcedTier);
    const rarity = RARITIES[rarityIndex];
    const depthMultiplier = 1 + depth * .035;
    let value = Math.round(randRange(run.rng, rarity.min, rarity.max) * depthMultiplier / 5) * 5;
    const jackpotChance = depth >= 14 ? Math.min(.012 + depth * .0008, .065) : 0;
    const jackpot = rarityIndex >= 2 && run.rng() < jackpotChance;
    if (jackpot) value = Math.round(value * randRange(run.rng, 1.7, 2.35) / 5) * 5;

    let col;
    if (rarityIndex >= 2 && run.rng() < .72) col = run.rng() < .5 ? randInt(run.rng, 0, 2) : randInt(run.rng, 6, 8);
    else col = randInt(run.rng, 0, COLS - 1);

    return {
      depth,
      col,
      rarityIndex,
      value,
      jackpot,
      collected: false,
      announced: false,
      bob: randRange(run.rng, 0, Math.PI * 2),
      spin: randRange(run.rng, 0, Math.PI * 2),
      pulse: randRange(run.rng, 0, Math.PI * 2),
      signal: false
    };
  }

  function chooseLaneType(depth) {
    // A gentle opening teaches the timing before the route introduces machinery.
    if (depth <= 2) return 'safe';
    if (depth === 3) return 'traffic';
    if (depth === 4) return 'safe';
    if (depth === 5) return 'traffic';
    if (depth === 6) return run.rng() < .7 ? 'traffic' : 'industrial';
    if (depth === 7) return 'safe';
    if (depth === 8) return run.rng() < .65 ? 'traffic' : 'fast';
    if (depth === 9) return 'crusher';
    if (depth === 10) return 'safe';

    // Each district begins with a rest/cache lane, then introduces the rail hazard.
    if (zoneGateAtDepth(depth)) return 'safe';
    if (depth === 13 || depth === 26 || depth === 41) return 'rail';

    if (run.consecutiveHazards >= 3) return 'safe';

    const deep = clamp((depth - 7) / 55, 0, 1);
    const safeWeight = .22 - .055 * deep;
    const trafficWeight = .39 - .065 * deep;
    const fastWeight = .13 + .085 * deep;
    const industrialWeight = .11 + .035 * deep;
    const crusherWeight = .08 + .045 * deep;
    const railWeight = depth < 13 ? 0 : .07 + .055 * deep;

    return weightedPick(run.rng, [
      { value: 'safe', weight: safeWeight },
      { value: 'traffic', weight: trafficWeight },
      { value: 'fast', weight: fastWeight },
      { value: 'industrial', weight: industrialWeight },
      { value: 'crusher', weight: crusherWeight },
      { value: 'rail', weight: railWeight }
    ]);
  }

  function generateLane(depth) {
    const type = chooseLaneType(depth);
    if (type === 'safe') run.consecutiveHazards = 0;
    else run.consecutiveHazards += 1;

    const gateZone = zoneGateAtDepth(depth);
    const lane = {
      depth,
      type,
      zone: zoneForDepth(depth),
      gateZone,
      decorations: makeDecorations(run.rng, type),
      traffic: (type === 'safe' || type === 'crusher' || type === 'rail') ? null : makeTraffic(depth, type, run.rng),
      crusher: type === 'crusher' ? makeCrusher(depth, run.rng) : null,
      rail: type === 'rail' ? makeRail(depth, run.rng) : null,
      loot: null
    };

    const isTemptation = depth === run.nextTemptationDepth;
    const isGateCache = !!gateZone;
    let lootChance = type === 'safe' ? .55 : type === 'fast' ? .49 : type === 'rail' ? .45 : .39;
    lootChance += Math.min(depth * .002, .10);

    if (depth > 0 && (isTemptation || isGateCache || run.rng() < lootChance)) {
      let forced = null;
      if (isGateCache) {
        forced = gateZone.start >= 40 ? 4 : gateZone.start >= 25 ? 3 : 2;
      } else if (isTemptation) {
        if (depth >= 32 && run.rng() < .28) forced = 4;
        else if (depth >= 17 && run.rng() < .52) forced = 3;
        else forced = 2;
      }
      lane.loot = makeLoot(depth, type, forced);
      lane.loot.signal = isTemptation || isGateCache;
      lane.loot.zoneCache = isGateCache;
    }

    if (isTemptation) run.nextTemptationDepth += randInt(run.rng, 9, 14);
    run.lanes.set(depth, lane);
    run.lastGenerated = Math.max(run.lastGenerated, depth);
    return lane;
  }

  function generateThrough(depth) {
    const target = Math.max(0, Math.floor(depth));
    while (run.lastGenerated < target) {
      generateLane(run.lastGenerated + 1);
    }
  }

  function resetWorld() {
    run.seed = (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
    run.rng = mulberry32(run.seed);
    run.lanes = new Map();
    run.lastGenerated = -1;
    run.consecutiveHazards = 0;
    run.nextTemptationDepth = randInt(run.rng, 8, 11);
    generateThrough(14);
  }

  function makeOrder() {
    const attempts = save.totalExtractions + save.totalDeaths;
    const band = clamp(Math.floor(attempts / 4), 0, 4);
    let type;
    if (attempts < 2) {
      type = run.rng() < .5 ? 'depth' : 'haul';
    } else {
      type = weightedPick(run.rng, [
        { value: 'depth', weight: .27 },
        { value: 'haul', weight: .25 },
        { value: 'items', weight: .18 },
        { value: 'rare', weight: .18 },
        { value: 'clean', weight: .12 }
      ]);
    }

    if (type === 'depth') {
      const baseline = save.bestDepth > 0 ? Math.floor(save.bestDepth * .72) : 9;
      const target = clamp(baseline + randInt(run.rng, 1, 4), 10, 42);
      return { type, title: 'DEEP SWEEP', target, reward: Math.round((110 + target * 14) / 10) * 10, description: `Reach depth ${target} and extract` };
    }

    if (type === 'haul') {
      const baseline = save.largestHaul > 0 ? save.largestHaul * .62 : 210;
      const target = clamp(Math.round((baseline + randRange(run.rng, 60, 180)) / 50) * 50, 300, 1900);
      return { type, title: 'HEAVY HAUL', target, reward: Math.round((105 + target * .28) / 10) * 10, description: `Extract ${formatNumber(target)} cargo` };
    }

    if (type === 'items') {
      const target = clamp(3 + band + randInt(run.rng, 0, 2), 3, 8);
      return { type, title: 'PARTS ORDER', target, reward: 110 + target * 55, description: `Extract ${target} salvage items` };
    }

    if (type === 'rare') {
      const tier = save.bestDepth >= 25 && save.highestLoot >= 250 && run.rng() < .26 ? 3 : 2;
      const rarity = RARITIES[tier];
      return { type, title: tier === 3 ? 'PROTOTYPE REQUEST' : 'POWER REQUEST', target: 1, tier, reward: tier === 3 ? 680 : 360, description: `Extract 1 ${rarity.name}` };
    }

    const target = clamp(10 + band * 2 + randInt(run.rng, 0, 3), 10, 24);
    return { type: 'clean', title: 'CLEAN RETURN', target, reward: Math.round((230 + target * 18) / 10) * 10, description: `Reach depth ${target} and extract without a hit` };
  }

  function orderProgress(order = run.order, cargo = run.cargoValue, items = run.cargoItems, counts = run.cargoByRarity, depth = run.runMaxDepth) {
    if (!order) return { value: 0, target: 0, text: '—', complete: false };
    let value = 0;
    let text = '';
    if (order.type === 'depth') {
      value = depth;
      text = `${Math.min(value, order.target)}/${order.target}`;
    } else if (order.type === 'haul') {
      value = cargo;
      text = `${formatNumber(Math.min(value, order.target))}/${formatNumber(order.target)}`;
    } else if (order.type === 'items') {
      value = items;
      text = `${Math.min(value, order.target)}/${order.target}`;
    } else if (order.type === 'rare') {
      value = counts.slice(order.tier).reduce((sum, count) => sum + count, 0);
      text = `${Math.min(value, 1)}/1`;
    } else if (order.type === 'clean') {
      value = depth;
      text = run.armorHits > 0 ? 'FAILED' : `${Math.min(value, order.target)}/${order.target}`;
    }
    const complete = order.type === 'clean'
      ? run.armorHits === 0 && depth >= order.target
      : value >= order.target;
    return { value, target: order.target, text, complete };
  }

  function checkOrderProgress(notify = true) {
    const progress = orderProgress();
    run.orderComplete = progress.complete;
    if (progress.complete && !run.orderNotified) {
      run.orderNotified = true;
      if (notify) {
        sfx.order();
        buzz(25);
        showSignal(`ORDER READY · RETURN HOME FOR +${formatNumber(run.order.reward)}`, '#78d596');
        addFloater(VIEW_W / 2, Math.max(60, playerAnchorY() - 112), 'ORDER COMPLETE', '#8ee3a8', 1.05, 15);
      }
    }
    updateHUD();
    return progress.complete;
  }

  function orderResultText(order, complete) {
    if (!order) return '';
    return `${order.title}: ${complete ? `COMPLETE · +${formatNumber(order.reward)}` : 'NOT COMPLETED'}`;
  }

  // ---------------------------------------------------------------------------
  // Run flow and upgrades
  // ---------------------------------------------------------------------------

  function resetPlayer() {
    player.col = 4;
    player.depth = 0;
    player.renderCol = 4;
    player.renderDepth = 0;
    player.hop = null;
    player.queue.length = 0;
    player.blockedDelay = 0;
    player.invuln = 0;
    player.flash = 0;
    player.lastFacing = 'up';
    player.landingSquash = 0;
    player.nearCooldown = 0;
  }

  function startRun() {
    ensureAudio();
    modal.classList.remove('open');
    run.state = 'playing';
    run.elapsed = 0;
    run.returning = false;
    run.cargoValue = 0;
    run.cargoItems = 0;
    run.runMaxDepth = 0;
    run.cameraDepth = 0;
    run.armorCharges = save.upgrades.armor;
    run.cargoByRarity = [0, 0, 0, 0, 0];
    run.bestItemThisRun = 0;
    run.cargoPromptIndex = 0;
    run.nearMisses = 0;
    run.returnStartDepth = 0;
    run.returnHalfShown = false;
    run.returnCloseShown = false;
    run.order = null;
    run.orderComplete = false;
    run.orderNotified = false;
    run.armorHits = 0;
    run.lastZoneId = 'outer';
    run.previousBestDepth = save.bestDepth;
    run.newBestAnnounced = false;
    run.overlayDelay = 0;
    run.pendingOverlay = null;
    particles.length = 0;
    floaters.length = 0;
    shake = 0;
    flashOverlay = 0;
    resetPlayer();
    resetWorld();
    run.order = makeOrder();
    updateHUD();
    sfx.order();
    showSignal(`${run.order.title} · ${run.order.description.toUpperCase()} · +${formatNumber(run.order.reward)}`, '#f0bd4b');
  }

  function beginReturn() {
    if (run.state !== 'playing' || run.returning || player.depth <= 0) return;
    ensureAudio();
    run.returning = true;
    run.returnStartDepth = player.depth;
    run.returnHalfShown = false;
    run.returnCloseShown = false;
    player.queue.length = 0;
    sfx.turn();
    addFloater(VIEW_W / 2, Math.max(58, playerAnchorY() - 108), `RETURNING WITH ${formatNumber(run.cargoValue)} AT RISK`, '#ffd15f', 1.45, 17);
    showSignal(`RETRACE ${player.depth} LANES — THE SCRAPYARD IS DOWN`, '#ffd15f');
    updateHUD();
  }

  function checkReturnMilestones() {
    if (!run.returning || player.depth <= 0) return;
    if (!run.returnHalfShown && player.depth <= Math.max(4, Math.floor(run.returnStartDepth / 2))) {
      run.returnHalfShown = true;
      sfx.warning();
      showSignal(`HALFWAY HOME · ${formatNumber(run.cargoValue)} STILL AT RISK`, '#efb24f');
    }
    if (!run.returnCloseShown && player.depth <= 3) {
      run.returnCloseShown = true;
      sfx.turn();
      showSignal(`SCRAPYARD IN SIGHT · ${player.depth} LANES LEFT`, '#78d596');
    }
  }

  function finishExtraction() {
    if (run.state !== 'playing') return;
    run.state = 'extracted';
    player.queue.length = 0;
    player.hop = null;
    const haul = run.cargoValue;
    const items = run.cargoItems;
    const breakdown = [...run.cargoByRarity];
    const bestItem = run.bestItemThisRun;
    const nearMisses = run.nearMisses;
    const order = run.order ? { ...run.order } : null;
    const orderComplete = order ? orderProgress(order, haul, items, breakdown, run.runMaxDepth).complete : false;
    const orderBonus = orderComplete ? order.reward : 0;
    const totalBanked = haul + orderBonus;
    const oldBank = save.banked;

    save.banked += totalBanked;
    save.totalCargoBanked += haul;
    if (orderComplete) save.ordersCompleted += 1;
    run.orderComplete = orderComplete;
    run.cargoValue = 0;
    run.cargoItems = 0;
    save.largestHaul = Math.max(save.largestHaul, haul);
    save.totalExtractions += 1;
    persist();

    bankTween = { from: oldBank, to: save.banked, elapsed: 0, duration: 1.1 };
    sfx.extract();
    if (orderComplete) setTimeout(() => sfx.order(), 250);
    buzz([28, 35, 28, 35, 70]);
    extractionBurst();
    flashOverlay = .35;
    run.overlayDelay = .55;
    run.pendingOverlay = {
      type: 'extracted',
      haul,
      totalBanked,
      depth: run.runMaxDepth,
      breakdown,
      bestItem,
      nearMisses,
      order,
      orderComplete,
      orderBonus
    };
    updateHUD();
  }

  function die(cause = 'TRAFFIC') {
    if (run.state !== 'playing') return;
    run.state = 'dead';
    player.queue.length = 0;
    player.hop = null;
    const lost = run.cargoValue;
    const breakdown = [...run.cargoByRarity];
    const bestItem = run.bestItemThisRun;
    const order = run.order ? { ...run.order } : null;
    run.cargoValue = 0;
    run.cargoItems = 0;
    save.totalDeaths += 1;
    save.largestCargoLost = Math.max(save.largestCargoLost, lost);
    persist();
    sfx.death();
    buzz([90, 45, 120]);
    shake = Math.max(shake, 16);
    flashOverlay = .58;
    deathBurst();
    run.overlayDelay = .52;
    run.pendingOverlay = { type: 'dead', lost, depth: run.runMaxDepth, cause, breakdown, bestItem, order, orderComplete: false };
    updateHUD();
  }

  function armorEffect(level) {
    return level === 0 ? 'No collision protection' : `Blocks ${level} collision${level > 1 ? 's' : ''} each run`;
  }

  function magnetEffect(level) {
    return level === 0 ? 'Pickup requires contact' : `Pull radius ${[0, 1.35, 2.05, 2.75][level].toFixed(2)} tiles`;
  }

  function bootsEffect(level) {
    return level === 0 ? 'Standard hop speed' : `${[0, 17, 30, 40][level]}% faster hopping`;
  }

  function nextUpgradeCost(key) {
    const level = save.upgrades[key];
    return level >= MAX_UPGRADE_LEVEL ? null : UPGRADE_COSTS[key][level];
  }

  function buyUpgrade(key) {
    if (!Object.prototype.hasOwnProperty.call(save.upgrades, key)) return;
    const cost = nextUpgradeCost(key);
    if (cost == null || save.banked < cost) return;
    ensureAudio();
    save.banked -= cost;
    save.upgrades[key] += 1;
    displayBank = save.banked;
    persist();
    sfx.buy();
    renderModal(modalMode, modalPayload);
    updateHUD();
  }

  function upgradeCard(key, name, effectFn) {
    const level = save.upgrades[key];
    const cost = nextUpgradeCost(key);
    const maxed = cost == null;
    const disabled = maxed || save.banked < cost;
    return `
      <div class="upgrade-card">
        <div class="upgrade-name">${name}</div>
        <div class="upgrade-level">LV ${level}/${MAX_UPGRADE_LEVEL}</div>
        <div class="upgrade-effect">${effectFn(level)}</div>
        <button class="upgrade-btn" data-upgrade="${key}" ${disabled ? 'disabled' : ''}>
          ${maxed ? 'MAXED' : `BUY ${formatNumber(cost)}`}
        </button>
      </div>`;
  }

  function rarityBreakdownText(counts) {
    if (!Array.isArray(counts)) return '';
    return counts.map((count, index) => count > 0 ? `${RARITIES[index].name} ×${count}` : '').filter(Boolean).join(' · ');
  }

  function renderModal(mode, data = null) {
    modalMode = mode;
    if (mode === 'start') modalPayload = null;
    else if (data) modalPayload = data;
    data = data || modalPayload || {};
    let kicker = 'PROTOTYPE COMPLETE · V3';
    let title = 'SCRAP RUN';
    let titleClass = '';
    let summary = 'Cross dangerous lanes, recover valuable salvage, and physically survive the same route home before traffic takes everything.';
    let action = 'START EXPEDITION';

    if (mode === 'dead') {
      kicker = 'EXPEDITION FAILED';
      title = 'CARGO LOST';
      titleClass = 'bad';
      const causeText = data.cause === 'CRUSHER'
        ? 'A crusher flattened the expedition'
        : data.cause === 'RAIL'
          ? 'The scrap train erased the expedition'
          : 'Traffic ended the expedition';
      const breakdown = rarityBreakdownText(data.breakdown);
      const orderLine = data.order ? `<span class="order-result bad">${orderResultText(data.order, false)}</span>` : '';
      summary = `${causeText} at depth ${data.depth}.<span class="haul-number">${formatNumber(data.lost)} LOST</span>Banked currency and upgrades are safe.${orderLine}${breakdown ? `<span class="haul-breakdown">LOST: ${breakdown}</span>` : ''}`;
      action = 'RUN AGAIN';
    } else if (mode === 'extracted') {
      kicker = 'SAFE INSIDE THE SCRAPYARD';
      title = 'EXTRACTION SUCCESSFUL';
      titleClass = 'good';
      const breakdown = rarityBreakdownText(data.breakdown);
      const orderLine = data.order
        ? `<span class="order-result ${data.orderComplete ? 'good' : 'bad'}">${orderResultText(data.order, data.orderComplete)}</span>`
        : '';
      summary = `You survived the trip home from depth ${data.depth}.<span class="haul-number">+${formatNumber(data.totalBanked ?? data.haul)} BANKED</span>${data.orderBonus ? `${formatNumber(data.haul)} cargo + ${formatNumber(data.orderBonus)} order bonus.` : 'Spend it now or push for a bigger haul.'}${orderLine}${breakdown ? `<span class="haul-breakdown">RECOVERED: ${breakdown}${data.nearMisses ? ` · ${data.nearMisses} NEAR MISS${data.nearMisses === 1 ? '' : 'ES'}` : ''}</span>` : ''}`;
      action = 'NEXT EXPEDITION';
    }

    modalCard.innerHTML = `
      <div class="modal-kicker">${kicker}</div>
      <div class="modal-title ${titleClass}">${title}</div>
      <div class="modal-summary">${summary}</div>
      ${mode === 'start' ? `<div class="instructions"><strong>MOVE:</strong> swipe, WASD, arrows, or the directional pad.<br><strong>EXTRACT:</strong> press TURN BACK, then travel down to depth 0.<br><strong>ORDERS:</strong> each expedition has one optional bonus objective.<br><strong>DANGER:</strong> caches tempt you deeper; rail lights flash before a scrap train arrives.</div>` : ''}
      <button id="modalStartBtn" class="primary-btn" type="button">${action}</button>
      <div class="upgrade-title">SCRAPYARD UPGRADES — BANKED ${formatNumber(save.banked)}</div>
      <div class="upgrade-grid">
        ${upgradeCard('armor', 'ARMOR', armorEffect)}
        ${upgradeCard('magnet', 'MAGNET', magnetEffect)}
        ${upgradeCard('boots', 'BOOTS', bootsEffect)}
      </div>
      <div class="stats-row">
        BEST DEPTH ${formatNumber(save.bestDepth)} · BIGGEST HAUL ${formatNumber(save.largestHaul)} · BIGGEST LOSS ${formatNumber(save.largestCargoLost)}<br>
        EXTRACTIONS ${formatNumber(save.totalExtractions)} · DEATHS ${formatNumber(save.totalDeaths)} · ORDERS ${formatNumber(save.ordersCompleted)}<br>
        TOTAL CARGO BANKED ${formatNumber(save.totalCargoBanked)} · BEST ITEM ${formatNumber(save.highestLoot)}
      </div>`;

    modal.classList.add('open');
    document.getElementById('modalStartBtn').addEventListener('click', startRun);
    modalCard.querySelectorAll('[data-upgrade]').forEach(btn => {
      btn.addEventListener('click', () => buyUpgrade(btn.dataset.upgrade));
    });
  }

  // ---------------------------------------------------------------------------
  // Input and movement
  // ---------------------------------------------------------------------------

  function hopDuration() {
    return [0.155, 0.129, 0.108, 0.093][save.upgrades.boots];
  }

  function enqueueMove(dx, dd, facing) {
    if (run.state !== 'playing') return;
    ensureAudio();
    if (player.queue.length >= 4) return;
    player.queue.push({ dx, dd, facing });
    if (!player.hop && player.blockedDelay <= 0) beginNextHop();
  }

  function beginNextHop() {
    if (run.state !== 'playing' || player.hop || player.blockedDelay > 0 || player.queue.length === 0) return;
    const move = player.queue.shift();
    const targetCol = player.col + move.dx;
    const targetDepth = player.depth + move.dd;

    if (targetCol < 0 || targetCol >= COLS || targetDepth < 0 || (run.returning && move.dd > 0)) {
      player.blockedDelay = .045;
      player.lastFacing = move.facing;
      sfx.blocked();
      if (run.returning && move.dd > 0) {
        addFloater(colCenterX(player.col), laneCenterY(player.depth) - 24, 'RETURN TRIP COMMITTED', '#ffd15f', .68, 11);
      }
      return;
    }

    generateThrough(targetDepth + 12);
    player.lastFacing = move.facing;
    player.hop = {
      startCol: player.col,
      startDepth: player.depth,
      targetCol,
      targetDepth,
      elapsed: 0,
      duration: hopDuration()
    };
    sfx.hop();
  }

  function finishHop() {
    const hop = player.hop;
    if (!hop) return;
    player.col = hop.targetCol;
    player.depth = hop.targetDepth;
    player.renderCol = player.col;
    player.renderDepth = player.depth;
    player.hop = null;
    player.landingSquash = 1;
    spawnLandingDust();
    sfx.land();

    run.runMaxDepth = Math.max(run.runMaxDepth, player.depth);
    if (run.runMaxDepth > save.bestDepth) {
      save.bestDepth = run.runMaxDepth;
      persist();
    }
    if (!run.returning && !run.newBestAnnounced && run.runMaxDepth > run.previousBestDepth && run.runMaxDepth >= Math.max(8, run.previousBestDepth + 1)) {
      run.newBestAnnounced = true;
      sfx.record();
      showSignal(`NEW BEST DEPTH · ${run.runMaxDepth}`, '#65d5dd');
    }

    const zone = zoneForDepth(player.depth);
    if (!run.returning && zone.id !== run.lastZoneId) {
      run.lastZoneId = zone.id;
      sfx.warning();
      buzz([18, 35, 18]);
      showSignal(`ENTERING ${zone.name} · DISTRICT CACHE AHEAD`, zone.accent);
    }

    generateThrough(player.depth + 12);
    collectNearbyLoot();
    checkOrderProgress();

    if (run.returning && player.depth === 0) {
      finishExtraction();
      return;
    }
    if (run.returning) checkReturnMilestones();

    updateHUD();
    if (player.queue.length > 0) beginNextHop();
  }

  function moveByName(name) {
    if (name === 'up') enqueueMove(0, 1, 'up');
    else if (name === 'down') enqueueMove(0, -1, 'down');
    else if (name === 'left') enqueueMove(-1, 0, 'left');
    else if (name === 'right') enqueueMove(1, 0, 'right');
  }

  document.querySelectorAll('.dir-btn').forEach(btn => {
    const press = (event) => {
      event.preventDefault();
      btn.classList.add('pressed');
      moveByName(btn.dataset.dir);
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', () => btn.classList.remove('pressed'));
    btn.addEventListener('pointercancel', () => btn.classList.remove('pressed'));
    btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));
  });

  window.addEventListener('keydown', (event) => {
    const key = event.key.toLowerCase();
    const movement = {
      arrowup: 'up', w: 'up',
      arrowdown: 'down', s: 'down',
      arrowleft: 'left', a: 'left',
      arrowright: 'right', d: 'right'
    }[key];

    if (movement) {
      event.preventDefault();
      moveByName(movement);
      return;
    }

    if (key === 'r') {
      event.preventDefault();
      beginReturn();
      return;
    }

    if ((key === 'enter' || key === ' ') && modal.classList.contains('open')) {
      event.preventDefault();
      startRun();
    }
  }, { passive: false });

  canvas.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    ensureAudio();
    swipeStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
  });

  canvas.addEventListener('pointerup', (event) => {
    if (!swipeStart || swipeStart.id !== event.pointerId) return;
    event.preventDefault();
    const dx = event.clientX - swipeStart.x;
    const dy = event.clientY - swipeStart.y;
    const threshold = 20;
    if (Math.max(Math.abs(dx), Math.abs(dy)) >= threshold) {
      if (Math.abs(dx) > Math.abs(dy)) moveByName(dx > 0 ? 'right' : 'left');
      else moveByName(dy > 0 ? 'down' : 'up');
    } else {
      // A quick tap is a forward hop, keeping one-thumb play fast.
      moveByName('up');
    }
    swipeStart = null;
  });

  canvas.addEventListener('pointercancel', () => { swipeStart = null; });
  returnBtn.addEventListener('click', beginReturn);

  soundBtn.addEventListener('click', () => {
    save.muted = !save.muted;
    persist();
    if (!save.muted) {
      ensureAudio();
      tone({ freq: 440, endFreq: 660, duration: .1, type: 'triangle', volume: .035 });
    }
    updateHUD();
  });

  // ---------------------------------------------------------------------------
  // Pickups, particles, and effects
  // ---------------------------------------------------------------------------

  function lootScreenPosition(loot) {
    return {
      x: colCenterX(loot.col),
      y: laneCenterY(loot.depth) - 2 + Math.sin(run.elapsed * 3.2 + loot.bob) * 3
    };
  }

  function collectNearbyLoot() {
    const magnetLevel = save.upgrades.magnet;
    const radiusTiles = [0.10, 1.35, 2.05, 2.75][magnetLevel];
    const radius = radiusTiles * CELL;
    const px = colCenterX(player.col);
    const py = laneCenterY(player.depth);

    for (let d = Math.max(0, player.depth - 3); d <= player.depth + 3; d++) {
      const lane = run.lanes.get(d);
      if (!lane || !lane.loot || lane.loot.collected) continue;
      const loot = lane.loot;
      const pos = lootScreenPosition(loot);
      const dist = Math.hypot(pos.x - px, pos.y - py);
      const directContact = loot.depth === player.depth && loot.col === player.col;
      if (directContact || (magnetLevel > 0 && dist <= radius)) collectLoot(loot, pos, magnetLevel > 0 && !directContact);
    }
  }

  function collectLoot(loot, pos, magneted) {
    if (loot.collected) return;
    loot.collected = true;
    run.cargoValue += loot.value;
    run.cargoItems += 1;
    run.cargoByRarity[loot.rarityIndex] += 1;
    run.bestItemThisRun = Math.max(run.bestItemThisRun, loot.value);
    save.highestLoot = Math.max(save.highestLoot, loot.value);
    persist();
    const rarity = RARITIES[loot.rarityIndex];
    sfx.pickup(loot.rarityIndex);
    if (loot.rarityIndex >= 4) buzz([28, 30, 28, 30, 55]);
    else if (loot.rarityIndex >= 2) buzz(24);

    const count = 7 + loot.rarityIndex * 5;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 25 + Math.random() * (45 + loot.rarityIndex * 15);
      particles.push({
        x: pos.x,
        y: pos.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 15,
        gravity: 40,
        life: .45 + Math.random() * .35,
        maxLife: .8,
        size: 2 + Math.random() * (2 + loot.rarityIndex),
        color: rarity.color,
        shape: loot.rarityIndex >= 3 ? 'diamond' : 'square'
      });
    }

    if (magneted) {
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: pos.x,
          y: pos.y,
          vx: (colCenterX(player.col) - pos.x) * (2.2 + Math.random()),
          vy: (laneCenterY(player.depth) - pos.y) * (2.2 + Math.random()),
          gravity: 0,
          life: .25,
          maxLife: .25,
          size: 2.2,
          color: '#7ee9ec',
          shape: 'square'
        });
      }
    }

    addFloater(pos.x, pos.y - 12, `+${formatNumber(loot.value)} ${rarity.name}${loot.jackpot ? ' JACKPOT' : ''}`, rarity.color, loot.rarityIndex >= 3 ? 1.4 : 1.0, loot.rarityIndex >= 3 ? 16 : 13);
    if (loot.rarityIndex >= 3) {
      flashOverlay = Math.max(flashOverlay, loot.rarityIndex === 4 ? .42 : .23);
      shake = Math.max(shake, loot.rarityIndex === 4 ? 8 : 3.5);
    }
    if (loot.signal) {
      showSignal(`${rarity.label} SECURED · ${formatNumber(run.cargoValue)} TOTAL AT RISK`, rarity.color);
    }
    checkCargoPrompt();
    checkOrderProgress();
  }

  function checkCargoPrompt() {
    const prompts = [250, 650, 1400, 2800];
    let crossed = 0;
    while (run.cargoPromptIndex < prompts.length && run.cargoValue >= prompts[run.cargoPromptIndex]) {
      crossed = prompts[run.cargoPromptIndex++];
    }
    if (crossed > 0) {
      sfx.warning();
      const copy = crossed >= 1400 ? 'JACKPOT LOAD — GET IT HOME?' : 'VALUABLE LOAD — TURN BACK?';
      showSignal(`${formatNumber(run.cargoValue)} CARGO AT RISK · ${copy}`, crossed >= 1400 ? '#ffd15f' : '#ef8b57');
    }
  }

  function addFloater(x, y, text, color, life = 1, size = 13) {
    floaters.push({ x, y, text, color, life, maxLife: life, size });
  }

  function spawnLandingDust() {
    const x = colCenterX(player.col);
    const y = laneCenterY(player.depth) + 15;
    for (let i = 0; i < 7; i++) {
      particles.push({
        x: x + randRange(Math.random, -7, 7),
        y,
        vx: randRange(Math.random, -35, 35),
        vy: randRange(Math.random, -24, -8),
        gravity: 55,
        life: randRange(Math.random, .22, .38),
        maxLife: .38,
        size: randRange(Math.random, 2, 4),
        color: '#9cb4aa',
        shape: 'circle'
      });
    }
  }

  function deathBurst() {
    const x = colCenterX(player.renderCol);
    const y = laneCenterY(player.renderDepth);
    for (let i = 0; i < 24; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 45 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 35,
        gravity: 125,
        life: .55 + Math.random() * .55,
        maxLife: 1.1,
        size: 3 + Math.random() * 5,
        color: choice(Math.random, ['#f0b64b', '#ef6a58', '#65d5dd', '#dbe9e5']),
        shape: Math.random() < .5 ? 'diamond' : 'square'
      });
    }
  }

  function extractionBurst() {
    const x = colCenterX(player.col);
    const y = laneCenterY(0);
    for (let i = 0; i < 46; i++) {
      const angle = randRange(Math.random, -Math.PI * .9, -Math.PI * .1);
      const speed = 55 + Math.random() * 150;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 105,
        life: .8 + Math.random() * .8,
        maxLife: 1.6,
        size: 3 + Math.random() * 5,
        color: choice(Math.random, ['#ffd15f', '#65d5dd', '#78d596', '#eef7f4']),
        shape: Math.random() < .55 ? 'diamond' : 'square'
      });
    }
  }

  // ---------------------------------------------------------------------------
  // Collision and near misses
  // ---------------------------------------------------------------------------

  function vehicleX(lane, vehicle) {
    const traffic = lane.traffic;
    return mod(vehicle.base + traffic.phase + traffic.direction * traffic.speed * run.elapsed, traffic.cycle) - traffic.margin;
  }

  function absorbOrDie(cause, x, y) {
    if (run.armorCharges > 0) {
      run.armorCharges -= 1;
      run.armorHits += 1;
      player.invuln = cause === 'RAIL' ? 1.85 : 1.15;
      player.flash = 1;
      shake = Math.max(shake, 10);
      flashOverlay = Math.max(flashOverlay, .28);
      sfx.armor();
      addFloater(x, y - 25, `ARMOR BLOCKED ${cause}`, '#7ee9ec', 1.0, 14);
      for (let i = 0; i < 14; i++) {
        particles.push({
          x, y,
          vx: randRange(Math.random, -100, 100),
          vy: randRange(Math.random, -95, 15),
          gravity: 110,
          life: randRange(Math.random, .35, .7),
          maxLife: .7,
          size: randRange(Math.random, 2, 5),
          color: '#6ee7ec',
          shape: 'diamond'
        });
      }
      buzz([55, 35, 30]);
      if (run.order && run.order.type === 'clean' && run.armorHits === 1) {
        showSignal('CLEAN RETURN ORDER FAILED · THE RUN CONTINUES', '#ef8b57');
      }
      checkOrderProgress(false);
    } else {
      die(cause);
    }
  }

  function handleCollision() {
    if (run.state !== 'playing' || player.invuln > 0 || run.qaInvulnerable) return;
    const nearestDepth = Math.round(player.renderDepth);
    if (Math.abs(player.renderDepth - nearestDepth) > .31) return;
    const lane = run.lanes.get(nearestDepth);
    if (!lane) return;

    const px = colCenterX(player.renderCol);
    const py = laneCenterY(nearestDepth);
    const playerHalf = 13;

    if (lane.rail) {
      const timing = railTiming(lane);
      if (timing.visible && px > timing.left - playerHalf && px < timing.right + playerHalf) {
        absorbOrDie('RAIL', px, py);
      }
      return;
    }

    if (lane.crusher) {
      const timing = crusherTiming(lane);
      const col = Math.round(player.renderCol);
      if (timing.state === 'slam' && Math.abs(player.renderCol - col) < .31 && timing.columns.includes(col)) {
        absorbOrDie('CRUSHER', px, py);
      }
      return;
    }

    if (!lane.traffic) return;
    for (const vehicle of lane.traffic.vehicles) {
      const vx = vehicleX(lane, vehicle);
      const half = vehicle.width / 2;
      if (Math.abs(px - vx) < half + playerHalf) {
        absorbOrDie('TRAFFIC', px, py);
        return;
      }
    }
  }

  function checkNearMiss() {
    if (run.state !== 'playing' || player.nearCooldown > 0 || player.invuln > 0) return;
    const nearestDepth = Math.round(player.renderDepth);
    if (Math.abs(player.renderDepth - nearestDepth) > .24) return;
    const lane = run.lanes.get(nearestDepth);
    if (!lane || !lane.traffic) return;

    const px = colCenterX(player.renderCol);
    const playerHalf = 13;
    const direction = lane.traffic.direction;

    for (const vehicle of lane.traffic.vehicles) {
      const vx = vehicleX(lane, vehicle);
      const half = vehicle.width / 2;
      let passedGap = Infinity;
      if (direction > 0 && vx > px) passedGap = (vx - half) - (px + playerHalf);
      if (direction < 0 && vx < px) passedGap = (px - playerHalf) - (vx + half);
      if (passedGap > 1 && passedGap < 13 && run.elapsed - vehicle.lastNearAt > 1.6) {
        vehicle.lastNearAt = run.elapsed;
        player.nearCooldown = .75;
        run.nearMisses += 1;
        sfx.near();
        addFloater(px, laneCenterY(nearestDepth) - 28, 'CLOSE!', '#f6de79', .65, 13);
        shake = Math.max(shake, 1.8);
        return;
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------

  function update(dt) {
    dt = Math.min(dt, .05);
    run.elapsed += dt;

    if (bankTween) {
      bankTween.elapsed += dt;
      const t = clamp(bankTween.elapsed / bankTween.duration, 0, 1);
      displayBank = Math.round(lerp(bankTween.from, bankTween.to, smoothstep(t)));
      if (t >= 1) bankTween = null;
    } else {
      displayBank = save.banked;
    }

    if (run.state === 'playing') {
      player.blockedDelay = Math.max(0, player.blockedDelay - dt);
      player.invuln = Math.max(0, player.invuln - dt);
      player.flash = Math.max(0, player.flash - dt * 3.5);
      player.landingSquash = Math.max(0, player.landingSquash - dt * 7);
      player.nearCooldown = Math.max(0, player.nearCooldown - dt);

      if (player.hop) {
        player.hop.elapsed += dt;
        const t = clamp(player.hop.elapsed / player.hop.duration, 0, 1);
        const eased = smoothstep(t);
        player.renderCol = lerp(player.hop.startCol, player.hop.targetCol, eased);
        player.renderDepth = lerp(player.hop.startDepth, player.hop.targetDepth, eased);
        if (t >= 1) finishHop();
      } else if (player.queue.length > 0 && player.blockedDelay <= 0) {
        beginNextHop();
      }

      const follow = 1 - Math.pow(.001, dt);
      run.cameraDepth = lerp(run.cameraDepth, player.renderDepth, follow * .34);
      generateThrough(player.depth + 12);
      handleCollision();
      checkNearMiss();
      updateCrusherAudio();
      updateRailAudio();
      scanForSignals(dt);
    } else {
      run.cameraDepth = lerp(run.cameraDepth, player.renderDepth, 1 - Math.pow(.04, dt));
    }

    if (run.overlayDelay > 0) {
      run.overlayDelay -= dt;
      if (run.overlayDelay <= 0 && run.pendingOverlay) {
        renderModal(run.pendingOverlay.type, run.pendingOverlay);
        run.pendingOverlay = null;
      }
    }

    signalTimer = Math.max(0, signalTimer - dt);
    if (signalTargetDepth != null && player.depth >= signalTargetDepth) signalTimer = 0;
    if (signalTimer === 0) {
      signalBanner.classList.remove('show');
      signalTargetDepth = null;
    }
    shake = Math.max(0, shake - dt * 28);
    flashOverlay = Math.max(0, flashOverlay - dt * 1.8);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += (p.gravity || 0) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      if (f.life <= 0) { floaters.splice(i, 1); continue; }
      f.y -= 22 * dt;
    }

    updateHUD();
  }

  function updateCrusherAudio() {
    const nearest = Math.round(player.renderDepth);
    for (let d = nearest - 4; d <= nearest + 6; d++) {
      const lane = run.lanes.get(d);
      if (!lane || !lane.crusher) continue;
      const timing = crusherTiming(lane);
      if (timing.state === 'slam' && lane.crusher.lastSlamCycle !== timing.cycle) {
        lane.crusher.lastSlamCycle = timing.cycle;
        const y = laneCenterY(d);
        if (y > -LANE_H && y < viewH + LANE_H) {
          sfx.crusher();
          shake = Math.max(shake, 2.4);
        }
      }
    }
  }

  function updateRailAudio() {
    const nearest = Math.round(player.renderDepth);
    for (let d = nearest - 4; d <= nearest + 7; d++) {
      const lane = run.lanes.get(d);
      if (!lane || !lane.rail) continue;
      const timing = railTiming(lane);
      const y = laneCenterY(d);
      if (y < -LANE_H || y > viewH + LANE_H) continue;

      const incomingCycle = timing.cycle + 1;
      if (timing.warning && lane.rail.lastWarnCycle !== incomingCycle) {
        lane.rail.lastWarnCycle = incomingCycle;
        sfx.railWarn();
        if (Math.abs(d - player.renderDepth) <= 1.2) buzz([18, 45, 18]);
      }
      if (timing.visible && lane.rail.lastPassCycle !== timing.cycle) {
        lane.rail.lastPassCycle = timing.cycle;
        sfx.train();
      }
      if (timing.visible && Math.abs(d - player.renderDepth) < 1.4) {
        shake = Math.max(shake, .45);
      }
    }
  }

  function scanForSignals(dt) {
    run.signalCooldown = Math.max(0, run.signalCooldown - dt);
    if (run.returning || run.signalCooldown > 0) return;

    for (let d = player.depth + 3; d <= player.depth + 10; d++) {
      const lane = run.lanes.get(d);
      const loot = lane && lane.loot;
      if (!loot || loot.collected || loot.announced || loot.rarityIndex < 2) continue;
      loot.announced = true;
      run.signalCooldown = 4.2;
      const rarity = RARITIES[loot.rarityIndex];
      showSignal(`${rarity.label}${loot.jackpot ? ' — JACKPOT SIGNAL' : ''} · ${d - player.depth} LANES AHEAD`, rarity.color, d);
      return;
    }
  }

  function showSignal(text, color, targetDepth = null) {
    signalBanner.textContent = text;
    signalBanner.style.color = color;
    signalTargetDepth = targetDepth;
    signalBanner.classList.remove('show');
    void signalBanner.offsetWidth;
    signalBanner.classList.add('show');
    signalTimer = 2.7;
  }

  // ---------------------------------------------------------------------------
  // HUD
  // ---------------------------------------------------------------------------

  function cargoRiskInfo(value) {
    if (value >= 1800) return { cls: 'jackpot', label: 'JACKPOT CARGO — EVERY HOP PUTS IT AT RISK' };
    if (value >= 750) return { cls: 'high-risk', label: 'HIGH-RISK CARGO — TURN BACK TO SECURE IT' };
    if (value >= 250) return { cls: 'valuable', label: 'VALUABLE CARGO — RETURN HOME TO BANK IT' };
    return { cls: '', label: 'UNBANKED CARGO — RETURN HOME TO KEEP IT' };
  }

  function updateHUD() {
    bankedValue.textContent = formatNumber(displayBank);
    depthValue.textContent = formatNumber(player.depth);
    bestValue.textContent = formatNumber(save.bestDepth);
    cargoValue.textContent = formatNumber(run.cargoValue);
    cargoCount.textContent = formatNumber(run.cargoItems);
    soundBtn.textContent = save.muted ? 'SOUND OFF' : 'SOUND ON';
    const risk = cargoRiskInfo(run.cargoValue);
    const zone = zoneForDepth(player.depth);
    cargoCard.className = `cargo-card${risk.cls ? ` ${risk.cls}` : ''}${run.returning && run.state === 'playing' ? ' returning' : ''}`;
    cargoLabel.textContent = run.returning && run.state === 'playing'
      ? `${formatNumber(run.cargoValue)} CARGO — ${player.depth} ${player.depth === 1 ? 'LANE' : 'LANES'} FROM SAFETY`
      : risk.label;

    if (run.state === 'playing' && run.returning) {
      statusText.textContent = `RETURNING · ${zone.name} — HOME ${player.depth} ${player.depth === 1 ? 'LANE' : 'LANES'} DOWN`;
      statusText.className = 'returning';
      returnBtn.textContent = 'RETURNING';
      returnBtn.classList.add('returning');
      returnBtn.disabled = true;
    } else {
      statusText.textContent = run.state === 'playing' ? `OUTBOUND · ${zone.name} — PUSH OR TURN BACK` : 'AT THE SCRAPYARD';
      statusText.className = 'outbound';
      returnBtn.textContent = 'TURN BACK';
      returnBtn.classList.remove('returning');
      returnBtn.disabled = run.state !== 'playing' || player.depth <= 0;
    }

    if (run.state === 'playing') {
      armorText.textContent = run.armorCharges > 0 ? `ARMOR: ${run.armorCharges} READY` : 'ARMOR: EMPTY';
    } else {
      armorText.textContent = save.upgrades.armor > 0 ? `ARMOR LV ${save.upgrades.armor}` : 'ARMOR: NONE';
    }

    if (run.state === 'playing' && run.order) {
      const progress = orderProgress();
      contractBar.classList.toggle('complete', progress.complete);
      contractText.textContent = `${run.order.title} · ${run.order.description}`;
      contractProgress.textContent = progress.complete
        ? `READY +${formatNumber(run.order.reward)}`
        : `${progress.text} · +${formatNumber(run.order.reward)}`;
    } else {
      contractBar.classList.remove('complete');
      contractText.textContent = 'OPTIONAL SCRAPYARD ORDER EACH EXPEDITION';
      contractProgress.textContent = `${formatNumber(save.ordersCompleted)} DONE`;
    }
  }

  // ---------------------------------------------------------------------------
  // Drawing — environment
  // ---------------------------------------------------------------------------

  function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, viewH);
    gradient.addColorStop(0, '#0d1c23');
    gradient.addColorStop(1, '#071116');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, VIEW_W, viewH);
    const zone = zoneForDepth(player.depth);
    ctx.fillStyle = zone.accent + '0c';
    ctx.fillRect(0, 0, VIEW_W, viewH);

    ctx.fillStyle = 'rgba(99, 182, 184, .055)';
    for (let i = 0; i < 22; i++) {
      const x = mod(i * 83 + run.elapsed * 3.5, VIEW_W + 40) - 20;
      const y = mod(i * 137 + run.elapsed * 1.4, viewH + 40) - 20;
      ctx.fillRect(x, y, 1.5, 1.5);
    }
  }

  function drawLane(lane, y) {
    const top = y - LANE_H / 2;
    if (lane.type === 'safe') drawSafeLane(lane, top);
    else if (lane.type === 'industrial') drawIndustrialLane(lane, top);
    else if (lane.type === 'crusher') drawCrusherLane(lane, top);
    else if (lane.type === 'rail') drawRailLane(lane, top);
    else drawRoadLane(lane, top);

    drawLaneLabel(lane, top);
    if (lane.traffic) drawTraffic(lane, y);
    if (lane.rail) drawRailTrain(lane, y);
    if (lane.loot && !lane.loot.collected) drawLoot(lane.loot);
  }

  function drawSafeLane(lane, top) {
    ctx.fillStyle = lane.depth === 0 ? '#173b36' : (lane.zone ? lane.zone.ground : '#24433c');
    ctx.fillRect(0, top, VIEW_W, LANE_H);
    ctx.fillStyle = 'rgba(132, 185, 151, .08)';
    ctx.fillRect(0, top + 4, VIEW_W, 2);
    ctx.fillRect(0, top + LANE_H - 6, VIEW_W, 2);

    if (lane.depth === 0) {
      ctx.fillStyle = 'rgba(240, 189, 75, .16)';
      ctx.fillRect(0, top, VIEW_W, LANE_H);
      ctx.strokeStyle = '#d9aa45';
      ctx.lineWidth = 3;
      ctx.setLineDash([15, 10]);
      ctx.beginPath();
      ctx.moveTo(0, top + 4);
      ctx.lineTo(VIEW_W, top + 4);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.save();
      ctx.globalAlpha = .35;
      ctx.fillStyle = '#f6df91';
      ctx.font = '900 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
