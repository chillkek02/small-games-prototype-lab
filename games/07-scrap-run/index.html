      ctx.fillText('SCRAPYARD EXTRACTION LINE', VIEW_W / 2, top + 17);
      ctx.restore();
    }

    if (lane.gateZone) {
      ctx.save();
      ctx.globalAlpha = .18;
      ctx.fillStyle = lane.gateZone.accent;
      ctx.fillRect(0, top, VIEW_W, LANE_H);
      ctx.globalAlpha = .72;
      ctx.strokeStyle = lane.gateZone.accent;
      ctx.lineWidth = 2;
      ctx.setLineDash([11, 8]);
      ctx.beginPath();
      ctx.moveTo(0, top + 5); ctx.lineTo(VIEW_W, top + 5);
      ctx.moveTo(0, top + LANE_H - 5); ctx.lineTo(VIEW_W, top + LANE_H - 5);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = .34;
      ctx.fillStyle = '#ffffff';
      ctx.font = '1000 17px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(lane.gateZone.name, VIEW_W / 2, top + 38);
      ctx.restore();
    }

    for (const deco of lane.decorations) drawScrapDecoration(deco, top + LANE_H / 2);
  }

  function drawScrapDecoration(deco, centerY) {
    ctx.save();
    ctx.translate(deco.x, centerY + deco.y);
    ctx.rotate(deco.rot);
    ctx.globalAlpha = .34;
    if (deco.kind === 0) {
      ctx.strokeStyle = '#6e8f86';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, deco.size, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-deco.size, 0); ctx.lineTo(deco.size, 0);
      ctx.stroke();
    } else if (deco.kind === 1) {
      ctx.fillStyle = '#8a7661';
      ctx.fillRect(-deco.size, -deco.size * .35, deco.size * 2, deco.size * .7);
    } else if (deco.kind === 2) {
      ctx.fillStyle = '#59776f';
      ctx.beginPath();
      ctx.moveTo(-deco.size, deco.size);
      ctx.lineTo(0, -deco.size);
      ctx.lineTo(deco.size, deco.size);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = '#4f6862';
      ctx.fillRect(-deco.size * .35, -deco.size, deco.size * .7, deco.size * 2);
      ctx.fillRect(-deco.size, -deco.size * .35, deco.size * 2, deco.size * .7);
    }
    ctx.restore();
  }

  function dashedBoundary(y, color, dash = 20, gap = 17, width = 3) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash([dash, gap]);
    ctx.lineDashOffset = 0;
    ctx.beginPath();
    ctx.moveTo(8, y);
    ctx.lineTo(VIEW_W - 8, y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawRoadLane(lane, top) {
    const fast = lane.type === 'fast';
    ctx.fillStyle = fast ? '#242b35' : '#2c3740';
    ctx.fillRect(0, top, VIEW_W, LANE_H);

    // Divider markings live on the lane boundaries. Vehicles travel in the clear band between them.
    dashedBoundary(top + 2, fast ? '#d46a66' : '#c4b766', fast ? 17 : 28, fast ? 13 : 20, fast ? 3.2 : 2.6);
    dashedBoundary(top + LANE_H - 2, fast ? '#d46a66' : '#c4b766', fast ? 17 : 28, fast ? 13 : 20, fast ? 3.2 : 2.6);

    ctx.globalAlpha = .12;
    ctx.fillStyle = '#d8e5e3';
    ctx.fillRect(0, top + LANE_H * .31, VIEW_W, 1);
    ctx.fillRect(0, top + LANE_H * .68, VIEW_W, 1);
    ctx.globalAlpha = 1;
  }

  function drawIndustrialLane(lane, top) {
    ctx.fillStyle = '#493720';
    ctx.fillRect(0, top, VIEW_W, LANE_H);
    ctx.fillStyle = '#3a2b1c';
    for (let x = -20; x < VIEW_W + 20; x += 26) {
      ctx.save();
      ctx.translate(x, top + 4);
      ctx.rotate(-.62);
      ctx.fillStyle = '#d4983f';
      ctx.fillRect(-4, -9, 8, 23);
      ctx.restore();
      ctx.save();
      ctx.translate(x + 13, top + LANE_H - 4);
      ctx.rotate(-.62);
      ctx.fillStyle = '#d4983f';
      ctx.fillRect(-4, -13, 8, 23);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(209, 158, 67, .25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, top + LANE_H / 2);
    ctx.lineTo(VIEW_W, top + LANE_H / 2);
    ctx.stroke();
    for (const deco of lane.decorations) {
      ctx.fillStyle = 'rgba(230, 177, 75, .26)';
      ctx.beginPath();
      ctx.arc(deco.x, top + LANE_H / 2 + deco.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawRailLane(lane, top) {
    const timing = railTiming(lane);
    ctx.fillStyle = '#342f2d';
    ctx.fillRect(0, top, VIEW_W, LANE_H);

    // Concrete crossing plates make every grid column readable as a viable route.
    for (let col = 0; col < COLS; col++) {
      const x = colCenterX(col);
      ctx.fillStyle = col % 2 === 0 ? 'rgba(105, 112, 111, .18)' : 'rgba(80, 87, 88, .14)';
      roundRectPath(ctx, x - CELL * .42, top + 7, CELL * .84, LANE_H - 14, 3);
      ctx.fill();
    }

    ctx.fillStyle = '#171b1d';
    for (let x = -12; x < VIEW_W + 18; x += 27) {
      ctx.save();
      ctx.translate(x, top + LANE_H / 2);
      ctx.rotate(.03);
      ctx.fillRect(-4, -22, 8, 44);
      ctx.restore();
    }

    ctx.strokeStyle = '#0d1214';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0, top + 16); ctx.lineTo(VIEW_W, top + 16);
    ctx.moveTo(0, top + 40); ctx.lineTo(VIEW_W, top + 40);
    ctx.stroke();
    ctx.strokeStyle = '#7e898a';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, top + 15); ctx.lineTo(VIEW_W, top + 15);
    ctx.moveTo(0, top + 39); ctx.lineTo(VIEW_W, top + 39);
    ctx.stroke();

    const pulse = .45 + .55 * Math.sin(run.elapsed * 16);
    const entryX = lane.rail.direction > 0 ? 16 : VIEW_W - 16;
    ctx.save();
    ctx.translate(entryX, top + 28);
    ctx.fillStyle = '#13191c';
    ctx.fillRect(-4, -20, 8, 40);
    ctx.fillStyle = '#2b373b';
    roundRectPath(ctx, -10, -19, 20, 18, 4); ctx.fill();
    ctx.fillStyle = timing.warning ? `rgba(255, 84, 61, ${.55 + pulse * .45})` : '#5f2b27';
    ctx.beginPath(); ctx.arc(0, -10, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = timing.warning ? '#ffd08a' : '#4d595d';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -10, 7.5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    if (timing.warning) {
      ctx.save();
      ctx.globalAlpha = .18 + pulse * .14;
      ctx.fillStyle = '#ef6a58';
      ctx.fillRect(0, top, VIEW_W, LANE_H);
      ctx.globalAlpha = .86;
      ctx.fillStyle = '#ffd15f';
      ctx.font = '1000 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('TRAIN INBOUND', VIEW_W / 2, top + 34);
      ctx.restore();
    }
  }

  function drawRailTrain(lane, y) {
    const timing = railTiming(lane);
    if (!timing.visible) return;
    const rail = lane.rail;
    const length = rail.length;
    const h = 40;

    ctx.save();
    ctx.translate(timing.x, y + 1);
    ctx.scale(rail.direction, 1);

    ctx.fillStyle = 'rgba(0,0,0,.43)';
    ctx.beginPath();
    ctx.ellipse(0, h * .46, length * .49, h * .25, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#101619';
    roundRectPath(ctx, -length / 2, -h * .42, length, h * .84, 5); ctx.fill();

    const locoW = 72;
    const freightLeft = -length / 2 + 5;
    const freightRight = length / 2 - locoW - 5;
    const freightWidth = Math.max(40, freightRight - freightLeft);
    const carCount = Math.max(2, Math.floor(freightWidth / 53));
    const carW = freightWidth / carCount;

    for (let i = 0; i < carCount; i++) {
      const x = freightLeft + i * carW;
      ctx.fillStyle = i % 2 ? shadeColor(rail.color, -.14) : shadeColor(rail.color, -.04);
      ctx.strokeStyle = '#0b1114';
      ctx.lineWidth = 2;
      roundRectPath(ctx, x + 1.5, -h * .35, carW - 4, h * .70, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(12, 20, 22, .40)';
      ctx.fillRect(x + 7, -h * .23, carW - 15, h * .46);

      // Code-drawn scrap loads give each freight car a rough silhouette.
      ctx.fillStyle = i % 3 === 0 ? '#8ca09a' : i % 3 === 1 ? '#b17a45' : '#607d7b';
      ctx.fillRect(x + 10, -8, Math.max(7, carW * .24), 14);
      ctx.fillStyle = '#677672';
      ctx.beginPath();
      ctx.arc(x + carW * .58, 1, Math.min(8, carW * .14), 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c6d0ca';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(x + carW * .72, -10); ctx.lineTo(x + carW * .84, 9);
      ctx.stroke();
    }

    const locoX = length / 2 - locoW;
    ctx.fillStyle = rail.color;
    ctx.strokeStyle = '#091114';
    ctx.lineWidth = 3;
    roundRectPath(ctx, locoX, -h / 2, locoW, h, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = shadeColor(rail.color, .11);
    roundRectPath(ctx, locoX + 23, -h * .39, locoW - 27, h * .78, 5); ctx.fill();
    ctx.fillStyle = '#80d7df';
    roundRectPath(ctx, locoX + 31, -h * .29, 23, 11, 3); ctx.fill();
    ctx.fillStyle = '#15363e';
    ctx.fillRect(locoX + 35, -h * .25, 6, 6);
    ctx.fillRect(locoX + 45, -h * .25, 6, 6);
    ctx.fillStyle = '#f0bd4b';
    ctx.fillRect(locoX + 5, h * .12, locoW - 10, 5);

    ctx.fillStyle = '#fff1a8';
    ctx.beginPath(); ctx.arc(length / 2 - 5, 0, 5.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 230, 140, .18)';
    ctx.beginPath(); ctx.arc(length / 2 + 2, 0, 17, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#090f12';
    for (let x = -length / 2 + 20; x < length / 2 - 10; x += 38) {
      roundRectPath(ctx, x - 7, h * .29, 14, 9, 3); ctx.fill();
      roundRectPath(ctx, x - 7, -h * .49, 14, 9, 3); ctx.fill();
    }

    ctx.restore();
  }

  function drawCrusherLane(lane, top) {
    const timing = crusherTiming(lane);
    ctx.fillStyle = '#252c31';
    ctx.fillRect(0, top, VIEW_W, LANE_H);
    ctx.fillStyle = '#1b2227';
    for (let x = 0; x < VIEW_W; x += 32) {
      ctx.fillRect(x, top + 2, 2, LANE_H - 4);
    }
    ctx.strokeStyle = '#59656b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, top + 3); ctx.lineTo(VIEW_W, top + 3);
    ctx.moveTo(0, top + LANE_H - 3); ctx.lineTo(VIEW_W, top + LANE_H - 3);
    ctx.stroke();

    for (let col = 0; col < COLS; col++) {
      const x = colCenterX(col);
      const targeted = timing.columns.includes(col);
      const warningPulse = .45 + .55 * Math.sin(run.elapsed * 15);
      ctx.save();
      ctx.translate(x, top + LANE_H / 2);
      ctx.fillStyle = targeted && timing.state === 'warning'
        ? `rgba(239, 92, 72, ${.28 + warningPulse * .35})`
        : 'rgba(103, 120, 125, .18)';
      roundRectPath(ctx, -20, -19, 40, 38, 5); ctx.fill();
      ctx.strokeStyle = targeted && timing.state === 'warning' ? '#ef6a58' : '#4e5b60';
      ctx.lineWidth = targeted && timing.state === 'warning' ? 2.5 : 1.2;
      roundRectPath(ctx, -20, -19, 40, 38, 5); ctx.stroke();

      if (targeted && timing.state === 'warning') {
        ctx.fillStyle = '#ffd15f';
        ctx.beginPath();
        ctx.moveTo(0, -10); ctx.lineTo(9, 9); ctx.lineTo(-9, 9); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#4b2d18';
        ctx.fillRect(-1.5, -4, 3, 8);
        ctx.fillRect(-1.5, 6, 3, 3);
      }

      if (targeted && timing.state === 'slam') {
        const slam = clamp(timing.amount * 2.2, 0, 1);
        ctx.fillStyle = 'rgba(0,0,0,.45)';
        ctx.beginPath(); ctx.ellipse(0, 14, 23, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#78868a';
        ctx.strokeStyle = '#12191c';
        ctx.lineWidth = 3;
        roundRectPath(ctx, -22, -25 + (1 - slam) * -20, 44, 43, 5); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#4f5b5f';
        ctx.fillRect(-17, -19 + (1 - slam) * -20, 34, 7);
        ctx.fillStyle = '#ef8b57';
        ctx.fillRect(-17, 7 + (1 - slam) * -20, 34, 5);
      } else {
        ctx.fillStyle = '#566267';
        ctx.fillRect(-14, -28, 28, 6);
        ctx.fillStyle = '#303a3f';
        ctx.fillRect(-4, -23, 8, 7);
      }
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = .55;
    ctx.fillStyle = '#d59b3f';
    for (let x = -12; x < VIEW_W + 12; x += 30) {
      ctx.save(); ctx.translate(x, top + 5); ctx.rotate(-.6); ctx.fillRect(-3, -8, 6, 17); ctx.restore();
      ctx.save(); ctx.translate(x + 15, top + LANE_H - 5); ctx.rotate(-.6); ctx.fillRect(-3, -8, 6, 17); ctx.restore();
    }
    ctx.restore();
  }

  function drawLaneLabel(lane, top) {
    if (top < -20 || top > viewH) return;
    const colors = {
      safe: '#b2cac8',
      traffic: '#b2cac8',
      fast: '#f29a91',
      industrial: '#edbe6d',
      crusher: '#f19a7f',
      rail: '#ffd08a'
    };
    const labels = {
      safe: lane.gateZone ? `${lane.gateZone.name} CACHE FIELD` : 'SAFE SCRAP FIELD',
      traffic: 'TRAFFIC ROAD',
      fast: 'FAST ROAD',
      industrial: 'INDUSTRIAL FORKLIFT LANE',
      crusher: 'INDUSTRIAL CRUSHER BAY',
      rail: 'SCRAP FREIGHT RAIL'
    };
    ctx.save();
    ctx.globalAlpha = .72;
    ctx.fillStyle = colors[lane.type] || '#b2cac8';
    ctx.font = '900 8px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${labels[lane.type] || 'UNKNOWN LANE'} · DEPTH ${lane.depth}`, 4, top + 11);
    ctx.restore();
  }

  function drawTraffic(lane, y) {
    for (const vehicle of lane.traffic.vehicles) {
      const x = vehicleX(lane, vehicle);
      if (x + vehicle.width / 2 < -8 || x - vehicle.width / 2 > VIEW_W + 8) continue;
      if (vehicle.kind === 'forklift') drawForklift(x, y + 3, vehicle, lane.traffic.direction);
      else drawVehicle(x, y + 2, vehicle, lane.traffic.direction);
    }
  }

  function drawVehicle(x, y, vehicle, direction) {
    const w = vehicle.width;
    const h = vehicle.height;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(direction, 1);

    ctx.fillStyle = 'rgba(0,0,0,.34)';
    ctx.beginPath();
    ctx.ellipse(0, h * .45, w * .46, h * .28, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#101a1f';
    roundRectPath(ctx, -w * .39, -h * .12, w * .18, h * .56, 4); ctx.fill();
    roundRectPath(ctx, w * .20, -h * .12, w * .18, h * .56, 4); ctx.fill();

    ctx.fillStyle = vehicle.color;
    ctx.strokeStyle = '#10191e';
    ctx.lineWidth = 3;
    roundRectPath(ctx, -w / 2, -h / 2, w, h, 7);
    ctx.fill(); ctx.stroke();

    if (vehicle.kind === 'truck') {
      ctx.fillStyle = shadeColor(vehicle.color, -.13);
      roundRectPath(ctx, -w * .48, -h * .39, w * .57, h * .78, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(8,15,18,.45)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-w * .20, -h * .36, 1, h * .72);
      ctx.fillStyle = vehicle.accent;
      roundRectPath(ctx, w * .12, -h * .35, w * .28, h * .36, 3); ctx.fill();
    } else {
      ctx.fillStyle = vehicle.accent;
      roundRectPath(ctx, -w * .14, -h * .37, w * .36, h * .34, 4); ctx.fill();
      ctx.fillStyle = 'rgba(7,32,39,.55)';
      ctx.fillRect(-w * .10, -h * .33, 2, h * .25);
      ctx.fillStyle = shadeColor(vehicle.color, .12);
      roundRectPath(ctx, -w * .43, h * .05, w * .25, h * .23, 3); ctx.fill();
    }

    ctx.fillStyle = '#f7df86';
    ctx.fillRect(w * .43, -h * .28, 4, 6);
    ctx.fillRect(w * .43, h * .14, 4, 6);
    ctx.fillStyle = '#e55348';
    ctx.fillRect(-w * .47, -h * .28, 4, 6);
    ctx.fillRect(-w * .47, h * .14, 4, 6);
    ctx.restore();
  }

  function drawForklift(x, y, vehicle, direction) {
    const w = vehicle.width;
    const h = vehicle.height;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(direction, 1);

    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(0, h * .45, w * .46, h * .25, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#10191d';
    ctx.beginPath(); ctx.arc(-w * .22, h * .32, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * .17, h * .32, 6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#e0a53f';
    ctx.strokeStyle = '#121b1e';
    ctx.lineWidth = 3;
    roundRectPath(ctx, -w * .38, -h * .31, w * .51, h * .62, 5); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#83cbd0';
    roundRectPath(ctx, -w * .18, -h * .60, w * .26, h * .48, 3); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#1a2a2d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-w * .20, -h * .60); ctx.lineTo(-w * .20, h * .12);
    ctx.moveTo(w * .09, -h * .60); ctx.lineTo(w * .09, h * .12);
    ctx.stroke();

    ctx.fillStyle = '#202c2f';
    ctx.fillRect(w * .12, -h * .56, 5, h * 1.08);
    ctx.fillRect(w * .23, -h * .56, 5, h * 1.08);
    ctx.fillStyle = '#b9b4a1';
    ctx.fillRect(w * .16, h * .27, w * .35, 4);
    ctx.fillRect(w * .16, h * .05, w * .35, 4);

    ctx.fillStyle = '#f5da77';
    ctx.fillRect(-w * .42, -h * .18, 4, 7);
    ctx.restore();
  }

  function shadeColor(hex, amount) {
    const value = parseInt(hex.slice(1), 16);
    const r = clamp((value >> 16) + Math.round(255 * amount), 0, 255);
    const g = clamp(((value >> 8) & 255) + Math.round(255 * amount), 0, 255);
    const b = clamp((value & 255) + Math.round(255 * amount), 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  // ---------------------------------------------------------------------------
  // Drawing — loot and player
  // ---------------------------------------------------------------------------

  function drawLootBeacon(loot, pos, rarity) {
    if (!loot.signal || run.returning) return;
    const pulse = .45 + .55 * Math.sin(run.elapsed * 4.2 + loot.pulse);
    ctx.save();
    const beam = ctx.createLinearGradient(pos.x, pos.y - 46, pos.x, pos.y + 30);
    beam.addColorStop(0, rarity.glow + '00');
    beam.addColorStop(.55, rarity.glow + '38');
    beam.addColorStop(1, rarity.glow + '00');
    ctx.fillStyle = beam;
    ctx.fillRect(pos.x - 18 - pulse * 4, pos.y - 52, 36 + pulse * 8, 82);
    ctx.strokeStyle = rarity.color;
    ctx.globalAlpha = .45 + pulse * .45;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(pos.x, pos.y + 10, 21 + pulse * 8, 7 + pulse * 2, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawLoot(loot) {
    const pos = lootScreenPosition(loot);
    if (pos.y < -35 || pos.y > viewH + 35) return;
    const rarity = RARITIES[loot.rarityIndex];
    const pulse = .5 + .5 * Math.sin(run.elapsed * (loot.rarityIndex >= 3 ? 5.2 : 3.1) + loot.pulse);
    const scale = 1 + pulse * (.03 + loot.rarityIndex * .012);
    drawLootBeacon(loot, pos, rarity);

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.scale(scale, scale);

    if (loot.rarityIndex >= 2) {
      const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 26 + loot.rarityIndex * 6);
      glow.addColorStop(0, rarity.glow + 'aa');
      glow.addColorStop(1, rarity.glow + '00');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 28 + loot.rarityIndex * 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(0,0,0,.34)';
    ctx.beginPath();
    ctx.ellipse(0, 14, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    if (loot.rarityIndex === 0) drawScrapLoot(rarity);
    else if (loot.rarityIndex === 1) drawComponentLoot(rarity);
    else if (loot.rarityIndex === 2) drawPowerCellLoot(rarity);
    else if (loot.rarityIndex === 3) drawEpicLoot(rarity, loot.spin);
    else drawLegendaryLoot(rarity, loot.spin);

    ctx.restore();

    if (loot.rarityIndex >= 2) {
      ctx.save();
      ctx.font = `1000 ${loot.rarityIndex === 4 ? 11 : 9}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = rarity.color;
      ctx.strokeStyle = '#071016';
      ctx.lineWidth = 3;
      const label = `${loot.signal ? 'SIGNAL: ' : ''}${rarity.label}${loot.jackpot ? ' JACKPOT' : ''}`;
      ctx.strokeText(label, pos.x, pos.y - 25);
      ctx.fillText(label, pos.x, pos.y - 25);
      ctx.restore();
    }
  }

  function drawScrapLoot(rarity) {
    ctx.strokeStyle = '#182226';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = rarity.color;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      const r = i % 2 ? 9 : 13;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#647b73';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  }

  function drawComponentLoot(rarity) {
    ctx.strokeStyle = '#14221d';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = rarity.color;
    roundRectPath(ctx, -12, -10, 24, 20, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#173d31';
    ctx.fillRect(-6, -4, 12, 8);
    ctx.strokeStyle = '#d7f6df';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-9, -6); ctx.lineTo(-4, -6); ctx.lineTo(-4, -1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, 6); ctx.lineTo(4, 6); ctx.lineTo(4, 1); ctx.stroke();
  }

  function drawPowerCellLoot(rarity) {
    ctx.strokeStyle = '#10242b';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = rarity.color;
    roundRectPath(ctx, -10, -14, 20, 28, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e7ffff';
    ctx.fillRect(-3, -17, 6, 4);
    ctx.fillStyle = '#1a6577';
    ctx.fillRect(-4, -8, 8, 16);
    ctx.fillStyle = '#e7ffff';
    ctx.beginPath();
    ctx.moveTo(2, -8); ctx.lineTo(-3, 0); ctx.lineTo(1, 0); ctx.lineTo(-2, 8); ctx.lineTo(5, -2); ctx.lineTo(1, -2); ctx.closePath();
    ctx.fill();
  }

  function drawEpicLoot(rarity, spin) {
    ctx.save();
    ctx.rotate(run.elapsed * .7 + spin);
    ctx.strokeStyle = '#301340';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = rarity.color;
    ctx.beginPath();
    ctx.moveTo(0, -15); ctx.lineTo(13, -3); ctx.lineTo(8, 14); ctx.lineTo(-8, 14); ctx.lineTo(-13, -3); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2d8ff';
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(6, 0); ctx.lineTo(0, 8); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(232,204,255,.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 19, 7, -run.elapsed * .45, 0, Math.PI * 2); ctx.stroke();
  }

  function drawLegendaryLoot(rarity, spin) {
    ctx.save();
    ctx.rotate(-run.elapsed * .6 + spin);
    ctx.strokeStyle = '#5e3410';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = rarity.color;
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 6;
      const r = i % 2 ? 8 : 17;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff2b0';
    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#ffe9a0';
    ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 8, run.elapsed * .6, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 8, run.elapsed * .6 + Math.PI / 2, 0, Math.PI * 2); ctx.stroke();
  }

  function drawScrapyardBase(edgeY) {
    if (edgeY >= viewH || edgeY < -40) return;
    const y = Math.max(-20, edgeY);
    ctx.save();
    const grad = ctx.createLinearGradient(0, y, 0, viewH);
    grad.addColorStop(0, '#162d2c');
    grad.addColorStop(1, '#091719');
    ctx.fillStyle = grad;
    ctx.fillRect(0, y, VIEW_W, viewH - y);

    ctx.strokeStyle = 'rgba(84, 126, 119, .20)';
    ctx.lineWidth = 1;
    for (let gx = 20; gx < VIEW_W; gx += 44) {
      ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, viewH); ctx.stroke();
    }
    for (let gy = y + 28; gy < viewH; gy += 36) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(VIEW_W, gy); ctx.stroke();
    }

    // Storage bins and scrap piles frame the extraction pad without obscuring play.
    const binY = Math.min(viewH - 34, y + 82);
    for (const bx of [35, VIEW_W - 83]) {
      ctx.fillStyle = '#213941';
      ctx.strokeStyle = '#091317';
      ctx.lineWidth = 3;
      roundRectPath(ctx, bx, binY, 48, 32, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#d49a3e';
      ctx.fillRect(bx + 5, binY + 5, 38, 5);
      ctx.fillStyle = '#617b78';
      ctx.fillRect(bx + 8, binY + 16, 9, 8);
      ctx.fillStyle = '#829c94';
      ctx.fillRect(bx + 21, binY + 13, 7, 11);
      ctx.fillStyle = '#506a66';
      ctx.fillRect(bx + 31, binY + 17, 8, 7);
    }

    const padY = Math.min(viewH - 28, y + 60);
    ctx.fillStyle = 'rgba(240, 189, 75, .10)';
    roundRectPath(ctx, VIEW_W / 2 - 62, padY - 17, 124, 55, 11); ctx.fill();
    ctx.strokeStyle = 'rgba(240, 189, 75, .48)';
    ctx.lineWidth = 2;
    roundRectPath(ctx, VIEW_W / 2 - 62, padY - 17, 124, 55, 11); ctx.stroke();
    ctx.fillStyle = '#f0bd4b';
    ctx.globalAlpha = .58;
    for (let i = -1; i <= 1; i++) {
      const x = VIEW_W / 2 + i * 24;
      ctx.beginPath();
      ctx.moveTo(x, padY + 23); ctx.lineTo(x - 8, padY + 11); ctx.lineTo(x - 3, padY + 11); ctx.lineTo(x - 3, padY + 2); ctx.lineTo(x + 3, padY + 2); ctx.lineTo(x + 3, padY + 11); ctx.lineTo(x + 8, padY + 11); ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#8fa9a3';
    ctx.font = '900 9px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('HOME BAY · BANK CARGO HERE', VIEW_W / 2, padY + 50);
    ctx.restore();
  }

  function nearestSignalLoot() {
    let target = null;
    for (let d = player.depth + 1; d <= player.depth + 14; d++) {
      const lane = run.lanes.get(d);
      if (lane && lane.loot && lane.loot.signal && !lane.loot.collected) { target = lane.loot; break; }
    }
    return target;
  }

  function drawSignalCompass() {
    if (run.returning || run.state !== 'playing') return;
    const loot = nearestSignalLoot();
    if (!loot) return;
    const pos = lootScreenPosition(loot);
    if (pos.y >= 36) return;
    const rarity = RARITIES[loot.rarityIndex];
    const x = clamp(pos.x, 54, VIEW_W - 54);
    const pulse = .5 + .5 * Math.sin(run.elapsed * 5);
    ctx.save();
    ctx.translate(x, 22);
    ctx.globalAlpha = .75 + pulse * .25;
    ctx.fillStyle = rarity.color;
    ctx.strokeStyle = '#081015';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 13); ctx.lineTo(-11, -3); ctx.lineTo(-4, -3); ctx.lineTo(-4, -12); ctx.lineTo(4, -12); ctx.lineTo(4, -3); ctx.lineTo(11, -3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.font = '1000 9px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(`${loot.depth - player.depth} LANES`, 0, 27);
    ctx.fillText(`${loot.depth - player.depth} LANES`, 0, 27);
    ctx.restore();
  }

  function drawReturnVignette() {
    if (!run.returning || run.state !== 'playing') return;
    const risk = clamp(run.cargoValue / 1800, 0, 1);
    const pulse = .5 + .5 * Math.sin(run.elapsed * 3.3);
    const gradient = ctx.createRadialGradient(VIEW_W / 2, viewH * .55, Math.min(VIEW_W, viewH) * .26, VIEW_W / 2, viewH * .55, Math.max(VIEW_W, viewH) * .62);
    gradient.addColorStop(.55, 'rgba(0,0,0,0)');
    gradient.addColorStop(1, `rgba(239, 134, 62, ${.035 + risk * .06 + pulse * .018})`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, VIEW_W, viewH);
  }

  function drawPlayer() {
    const x = colCenterX(player.renderCol);
    const yBase = laneCenterY(player.renderDepth);
    let hopT = 0;
    let hopLift = 0;
    if (player.hop) {
      hopT = clamp(player.hop.elapsed / player.hop.duration, 0, 1);
      hopLift = Math.sin(hopT * Math.PI) * 13;
    }
    const y = yBase - hopLift;
    const air = Math.sin(hopT * Math.PI);
    const squash = player.landingSquash;
    const scaleX = 1 + squash * .13 - air * .06;
    const scaleY = 1 - squash * .12 + air * .10;
    const tilt = player.lastFacing === 'left' ? -.09 : player.lastFacing === 'right' ? .09 : 0;

    ctx.save();
    ctx.globalAlpha = run.state === 'dead' ? .25 : 1;
    ctx.fillStyle = `rgba(0,0,0,${.34 - air * .15})`;
    ctx.beginPath();
    ctx.ellipse(x, yBase + 17, 17 - air * 3, 6 - air * 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.scale(scaleX, scaleY);
    if (player.invuln > 0 && Math.floor(run.elapsed * 18) % 2 === 0) ctx.globalAlpha = .38;

    if (run.armorCharges > 0) {
      ctx.strokeStyle = 'rgba(99, 224, 234, .72)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0, 0, 23 + Math.sin(run.elapsed * 5) * 1.5, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Cargo rack behind the bot grows slightly with carried items.
    if (run.cargoItems > 0) {
      ctx.fillStyle = '#3c2c20';
      ctx.strokeStyle = '#111a1e';
      ctx.lineWidth = 2;
      roundRectPath(ctx, -15, 6, 30, 13, 3); ctx.fill(); ctx.stroke();
      const visibleBits = Math.min(4, run.cargoItems);
      for (let i = 0; i < visibleBits; i++) {
        ctx.fillStyle = ['#aebcb8', '#6fcf98', '#61cce3', '#b97af0'][i % 4];
        ctx.fillRect(-10 + i * 6, 2 - (i % 2) * 3, 5, 7);
      }
    }

    // Feet / little suspension legs.
    ctx.fillStyle = '#19252a';
    roundRectPath(ctx, -15, 11, 10, 8, 3); ctx.fill();
    roundRectPath(ctx, 5, 11, 10, 8, 3); ctx.fill();
    ctx.fillStyle = '#d18a2f';
    ctx.fillRect(-12, 8, 5, 6);
    ctx.fillRect(7, 8, 5, 6);

    // Main orange utility body.
    ctx.fillStyle = '#eea43f';
    ctx.strokeStyle = '#101a1f';
    ctx.lineWidth = 3;
    roundRectPath(ctx, -18, -11, 36, 27, 7); ctx.fill(); ctx.stroke();

    // Side grabber arms.
    ctx.fillStyle = '#cc7c2d';
    roundRectPath(ctx, -23, -5, 7, 14, 3); ctx.fill(); ctx.stroke();
    roundRectPath(ctx, 16, -5, 7, 14, 3); ctx.fill(); ctx.stroke();

    // Head/visor gives an immediately readable face.
    ctx.fillStyle = '#f5b84d';
    roundRectPath(ctx, -14, -22, 28, 18, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#75d9df';
    roundRectPath(ctx, -10, -18, 20, 9, 4); ctx.fill();
    ctx.fillStyle = '#153941';
    ctx.fillRect(-6, -16, 4, 4);
    ctx.fillRect(3, -16, 4, 4);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillRect(-8, -17, 5, 2);

    // Antenna and beacon.
    ctx.strokeStyle = '#18242a';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(4, -22); ctx.lineTo(8, -30); ctx.stroke();
    ctx.fillStyle = run.returning ? '#ffd15f' : '#72dce1';
    ctx.beginPath(); ctx.arc(8, -31, 3.5 + Math.sin(run.elapsed * 5) * .4, 0, Math.PI * 2); ctx.fill();
    ctx.stroke();

    // Chest badge.
    ctx.fillStyle = '#8c5427';
    roundRectPath(ctx, -6, -2, 12, 9, 3); ctx.fill();
    ctx.fillStyle = '#f8d681';
    ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(3, 2); ctx.lineTo(0, 5); ctx.lineTo(-3, 2); ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawHomeArrow() {
    if (!run.returning || run.state !== 'playing') return;
    const pulse = .5 + .5 * Math.sin(run.elapsed * 5.5);
    const x = VIEW_W - 34;
    const y = viewH - 32;
    ctx.save();
    ctx.globalAlpha = .72 + pulse * .28;
    ctx.fillStyle = '#ffd15f';
    ctx.strokeStyle = '#4a3411';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y + 15);
    ctx.lineTo(x - 13, y - 2);
    ctx.lineTo(x - 5, y - 2);
    ctx.lineTo(x - 5, y - 18);
    ctx.lineTo(x + 5, y - 18);
    ctx.lineTo(x + 5, y - 2);
    ctx.lineTo(x + 13, y - 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.font = '1000 9px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff1b6';
    ctx.fillText(`HOME ${player.depth}`, x, y - 23);
    ctx.restore();
  }

  function drawParticlesAndFloaters() {
    for (const p of particles) {
      const alpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      } else if (p.shape === 'diamond') {
        ctx.translate(p.x, p.y); ctx.rotate(Math.PI / 4); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      } else {
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.restore();
    }

    for (const f of floaters) {
      const alpha = clamp(f.life / f.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = Math.min(1, alpha * 1.6);
      ctx.font = `1000 ${f.size}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#071016';
      ctx.lineWidth = 4;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
  }

  function draw() {
    drawBackground();
    const shakeX = shake > 0 ? randRange(Math.random, -shake, shake) : 0;
    const shakeY = shake > 0 ? randRange(Math.random, -shake * .6, shake * .6) : 0;

    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawScrapyardBase(laneCenterY(0) + LANE_H / 2);
    const behind = Math.ceil((viewH - playerAnchorY()) / LANE_H) + 2;
    const ahead = Math.ceil(playerAnchorY() / LANE_H) + 2;
    const minDepth = Math.max(0, Math.floor(run.cameraDepth - behind));
    const maxDepth = Math.ceil(run.cameraDepth + ahead);
    generateThrough(maxDepth + 2);

    for (let depth = maxDepth; depth >= minDepth; depth--) {
      const lane = run.lanes.get(depth);
      if (!lane) continue;
      const y = laneCenterY(depth);
      if (y < -LANE_H || y > viewH + LANE_H) continue;
      drawLane(lane, y);
    }

    drawSignalCompass();
    drawHomeArrow();
    if (run.state !== 'dead' || run.overlayDelay > 0) drawPlayer();
    drawParticlesAndFloaters();
    ctx.restore();
    drawReturnVignette();

    if (flashOverlay > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(.34, flashOverlay);
      ctx.fillStyle = run.state === 'dead' ? '#ff5e4c' : '#fff4c2';
      ctx.fillRect(0, 0, VIEW_W, viewH);
      ctx.restore();
    }

    // Subtle vignette keeps the play area visually focused.
    const vignette = ctx.createRadialGradient(VIEW_W / 2, viewH * .53, viewH * .1, VIEW_W / 2, viewH * .53, Math.max(VIEW_W, viewH) * .65);
    vignette.addColorStop(.6, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,.27)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, VIEW_W, viewH);
  }

  // ---------------------------------------------------------------------------
  // Main loop and diagnostics
  // ---------------------------------------------------------------------------

  function frame(now) {
    const dt = (now - lastFrame) / 1000;
    lastFrame = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function getDiagnosticState() {
    return {
      state: run.state,
      depth: player.depth,
      col: player.col,
      cargoValue: run.cargoValue,
      cargoItems: run.cargoItems,
      returning: run.returning,
      armorCharges: run.armorCharges,
      queueLength: player.queue.length,
      hopping: !!player.hop,
      lanesGenerated: run.lanes.size,
      runMaxDepth: run.runMaxDepth,
      nearMisses: run.nearMisses,
      zone: zoneForDepth(player.depth).name,
      order: run.order ? { ...run.order, progress: orderProgress() } : null,
      crusherLanes: [...run.lanes.values()].filter(lane => lane.type === 'crusher').length,
      railLanes: [...run.lanes.values()].filter(lane => lane.type === 'rail').length,
      save: JSON.parse(JSON.stringify(save))
    };
  }

  if (new URLSearchParams(location.search).has('qa') || window.__SCRAP_RUN_QA__ === true) {
    window.__scrapRunQA = {
      start: startRun,
      move: moveByName,
      turnBack: beginReturn,
      state: getDiagnosticState,
      setInvulnerable(value) { run.qaInvulnerable = !!value; },
      forceCargo(value = 500, items = 3) { run.cargoValue = value; run.cargoItems = items; updateHUD(); },
      teleport(depth, col = 4) {
        generateThrough(depth + 12);
        player.depth = Math.max(0, Math.floor(depth));
        player.renderDepth = player.depth;
        player.col = clamp(Math.floor(col), 0, COLS - 1);
        player.renderCol = player.col;
        run.cameraDepth = player.depth;
        run.runMaxDepth = Math.max(run.runMaxDepth, player.depth);
        updateHUD();
      },
      collectFirstNearby() {
        for (const lane of run.lanes.values()) {
          if (lane.loot && !lane.loot.collected) {
            const loot = lane.loot;
            loot.depth = player.depth;
            loot.col = player.col;
            collectLoot(loot, { x: colCenterX(player.col), y: laneCenterY(player.depth) }, false);
            return true;
          }
        }
        return false;
      },
      die,
      extract: finishExtraction,
      findLane(type) {
        for (const lane of run.lanes.values()) if (lane.type === type) return lane.depth;
        return -1;
      },
      crusherState(depth) {
        const lane = run.lanes.get(depth);
        return lane && lane.crusher ? crusherTiming(lane) : null;
      },
      railState(depth) {
        const lane = run.lanes.get(depth);
        return lane && lane.rail ? railTiming(lane) : null;
      },
      setOrder(order) {
        run.order = { ...order };
        run.orderComplete = false;
        run.orderNotified = false;
        checkOrderProgress(false);
      },
      buy: buyUpgrade,
      saveKey: STORAGE_KEY
    };
  }

  renderModal('start');
  updateHUD();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
