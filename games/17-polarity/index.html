<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07121b"><meta name="robots" content="noindex,nofollow,noarchive"><title>Project Polarity v1</title><style>html,body{margin:0;width:100%;height:100%;background:#07121b;color:#dff;font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif}#boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;letter-spacing:.12em}small{display:block;color:#7897a0;margin-top:8px;letter-spacing:.06em;line-height:1.45}</style></head><body><div id="boot">BOOTING PROJECT POLARITY V1…<small>UNPACKING PROTOTYPE</small></div><script>(async()=>{try{if(typeof DecompressionStream==='undefined')throw new Error('This browser needs a newer Chrome, Edge, Safari, or Firefox build.');const files=['payload-a.txt','payload-b.txt','payload-c1.txt','payload-c2.txt'];const parts=await Promise.all(files.map(async file=>{const response=await fetch(file,{cache:'no-store'});if(!response.ok)throw new Error(`Missing ${file}`);return (await response.text()).trim();}));const encoded=parts.join('');const bytes=Uint8Array.from(atob(encoded),char=>char.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(error){console.error(error);const boot=document.getElementById('boot');if(boot)boot.innerHTML=`PROTOTYPE COULD NOT BOOT<small>${String(error&&error.message||error)}</small>`;}})();</script></body></html>
