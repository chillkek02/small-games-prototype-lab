<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#24180f" />
<title>Project Gatekeeper v7</title>
<style>
  :root{
    --ink:#f7ecd2;--muted:#c6b38d;--gold:#e7b653;--green:#4e9e69;--red:#a94b3d;
    --wood:#2a190f;--paper:#e6d1a1;--paper2:#d5b87e;--dark:#160e09;--line:#6f4a28;
    --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0906;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 15%,#49301b 0,#1c120b 50%,#0c0805 100%)}
  #shell{position:relative;width:min(100vw,540px,calc(100vh * .5625));height:auto;aspect-ratio:9/16;overflow:hidden;background:#24160d;box-shadow:0 0 0 1px #5d3b1f,0 24px 90px #000c}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #topButtons{position:absolute;z-index:34;right:10px;top:10px;display:flex;gap:6px}
  button{appearance:none;border:1px solid #8a6035;background:#2d1b10;color:#f8edcf;border-radius:10px;padding:8px 10px;font-weight:900;letter-spacing:.03em;box-shadow:0 5px 14px #0007;font-size:11px}
  button:active{transform:translateY(1px) scale(.98)}
  #toast{position:absolute;z-index:55;left:50%;top:13%;transform:translate(-50%,-10px);max-width:84%;text-align:center;padding:9px 13px;border-radius:999px;background:#160e09eb;border:1px solid #9d7448;color:#f7ecd2;font-weight:900;font-size:12px;opacity:0;pointer-events:none;transition:.16s ease;box-shadow:0 8px 28px #0009}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #devPanel{position:absolute;z-index:64;right:8px;top:48px;width:205px;background:#150d08f4;border:1px solid #8e6236;border-radius:12px;padding:9px;display:none;box-shadow:0 16px 48px #000b}
  #devPanel.show{display:block}
  #devPanel h3{font-size:10px;margin:1px 0 7px;color:#e7b653;letter-spacing:.08em}
  #devPanel button{width:100%;font-size:10px;padding:7px;margin:3px 0;text-align:left}
  #telemetry{position:absolute;z-index:63;left:8px;top:52px;display:none;background:#130c08ed;border:1px solid #7f5b37;border-radius:10px;padding:8px;color:#e1cc9f;font:9px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none;white-space:pre;box-shadow:0 8px 30px #0009}
  #telemetry.show{display:block}
  #modal{position:absolute;inset:0;z-index:72;background:#0a0705df;display:none;align-items:center;justify-content:center;padding:22px}
  #modal.show{display:flex}
  #modalCard{width:100%;max-width:430px;max-height:90%;overflow-y:auto;touch-action:pan-y;background:linear-gradient(#2a1a10,#1d120b);border:1px solid #9d7447;border-radius:18px;padding:18px;box-shadow:0 28px 80px #000d;position:relative}
  #modalCard:before{content:"";position:absolute;inset:7px;border:1px solid #60401f;border-radius:12px;pointer-events:none}
  #modalKicker{font-size:10px;font-weight:900;letter-spacing:.16em;color:#d7a949;text-transform:uppercase;margin-bottom:6px;position:relative}
  #modalTitle{margin:0 0 9px;font-family:Georgia,serif;font-size:26px;color:#fff0c9;position:relative}
  #modalText{white-space:pre-line;color:#d8c6a1;line-height:1.45;font-size:13px;margin:0;position:relative}
  #modalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;position:relative}
  #modalActions button{flex:1;min-width:120px;background:#5a3920;border-color:#a97b45;padding:11px 12px}
  @media(min-width:700px){#shell{border-radius:18px}}
</style>
</head>
<body>
<div id="app"><div id="shell">
  <canvas id="game" width="540" height="960" aria-label="Project Gatekeeper game canvas"></canvas>
  <div id="topButtons">
    <button id="soundBtn">SOUND ON</button>
    <button id="devBtn">DEV</button>
  </div>
  <div id="toast"></div>
  <div id="telemetry"></div>
  <div id="devPanel">
    <h3>PROJECT GATEKEEPER v7 — DEV / CAPTURE</h3>
    <button data-dev="fraud">Load obvious permit fraud</button>
    <button data-dev="cleric">Load strategic illegal cleric</button>
    <button data-dev="contraband">Load searchable contraband</button>
    <button data-dev="alias">Load sigil / alias case</button>
    <button data-dev="missing">Load missing-document case</button>
    <button data-dev="quest">Load quest-statement mismatch</button>
    <button data-dev="writ">Load Royal Writ exception</button>
    <button data-dev="circle">Load sealed-request target</button>
    <button data-dev="returner">Load corrected-paper return</button>
    <button data-dev="emergency">Trigger emergency order</button>
    <button data-dev="party">Fill strong party</button>
    <button data-dev="danger">Force dangerous expedition</button>
    <button data-dev="relic">Force relic-ready party</button>
    <button data-dev="streak">Set clean-seal streak to 3</button>
    <button data-dev="nextday">Jump to next day</button>
    <button data-dev="slow">Toggle slow motion</button>
    <button data-dev="telemetry">Show / hide telemetry</button>
    <button data-dev="reset">Reset records</button>
    <button data-dev="close">Close</button>
  </div>
  <div id="modal">
    <div id="modalCard">
      <div id="modalKicker"></div>
      <h2 id="modalTitle">Project Gatekeeper</h2>
      <p id="modalText"></p>
      <div id="modalActions"></div>
    </div>
  </div>
</div></div>
<script>
'use strict';

/* =========================================================
   SMALL GAMES KIT v0.1 — adapted for PROJECT GATEKEEPER v7
   Self-contained HTML/CSS/JS. No external libraries/assets.
   Preserved: responsive shell, touch + keyboard input, game loop,
   scene support, RNG helpers, localStorage, procedural audio,
   particles, shake, flashes, floating text, tweens, HUD-style canvas,
   modals/toasts, telemetry, and developer/capture tools.
   ========================================================= */

const SGK=(()=>{
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const rand=(a=0,b=1)=>a+Math.random()*(b-a);
  const irand=(a,b)=>Math.floor(rand(a,b+1));
  const choose=a=>a[Math.floor(Math.random()*a.length)];
  const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
  const weightedChoice=e=>{const total=e.reduce((s,x)=>s+x.weight,0);let r=Math.random()*total;for(const x of e){r-=x.weight;if(r<=0)return x.value}return e[e.length-1]?.value};
  function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

  const PREFIX='sgk_gatekeeper_v1_';
  const Save={
    get(k,f=null){try{const r=localStorage.getItem(PREFIX+k);return r===null?f:JSON.parse(r)}catch{return f}},
    set(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v));return true}catch{return false}},
    reset(){try{Object.keys(localStorage).filter(k=>k.startsWith(PREFIX)).forEach(k=>localStorage.removeItem(k))}catch{}}
  };
  const Telemetry={
    data:Save.get('telemetry',{sessions:0,runsStarted:0,runsCompleted:0,wins:0,daysCompleted:0,applicants:0,correct:0,citations:0,approved:0,rejected:0,expeditions:0,survived:0,deaths:0,returns:0,restarts:0,playMs:0}),
    init(){this.data.sessions++;this.persist()},startRun(){this.data.runsStarted++;this.persist()},
    tick(ms){this.data.playMs+=ms},inc(k,n=1){this.data[k]=(this.data[k]||0)+n;this.persist()},
    completeRun(win){this.data.runsCompleted++;if(win)this.data.wins++;this.persist()},restart(){this.data.restarts++;this.persist()},
    persist(){Save.set('telemetry',this.data)},reset(){this.data={sessions:1,runsStarted:0,runsCompleted:0,wins:0,daysCompleted:0,applicants:0,correct:0,citations:0,approved:0,rejected:0,expeditions:0,survived:0,deaths:0,returns:0,restarts:0,playMs:0};this.persist()}
  };

  const Input={
    keys:new Set(),pressed:new Set(),queue:[],pointer:{x:0,y:0,down:false,startX:0,startY:0},
    init(){
      addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!this.keys.has(k))this.pressed.add(k);this.keys.add(k);if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='`')UI.toggleDev()},{passive:false});
      addEventListener('keyup',e=>this.keys.delete(e.key.toLowerCase()));
      const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
      canvas.addEventListener('pointerdown',e=>{const p=pos(e);this.pointer={x:p.x,y:p.y,down:true,startX:p.x,startY:p.y};Audio.unlock();try{canvas.setPointerCapture(e.pointerId)}catch{}});
      canvas.addEventListener('pointermove',e=>{const p=pos(e);this.pointer.x=p.x;this.pointer.y=p.y});
      canvas.addEventListener('pointerup',e=>{const p=pos(e);this.pointer.x=p.x;this.pointer.y=p.y;this.pointer.down=false;this.queue.push({type:'tap',x:p.x,y:p.y})});
    },
    tap(){const i=this.queue.findIndex(x=>x.type==='tap');return i>=0?this.queue.splice(i,1)[0]:null},
    key(k){if(this.pressed.has(k)){this.pressed.delete(k);return true}return false},
    endFrame(){this.pressed.clear()}
  };

  const Audio={
    ctx:null,master:null,enabled:Save.get('sound',true),
    unlock(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.enabled?.18:0;this.master.connect(this.ctx.destination)}catch{}},
    setEnabled(v){this.enabled=v;Save.set('sound',v);if(this.master)this.master.gain.value=v?.18:0},
    tone(freq=440,dur=.08,type='sine',vol=.3,slide=0,delay=0){if(!this.enabled)return;this.unlock();if(!this.ctx)return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.03)},
    click(){this.tone(330,.045,'square',.14,70)},
    arrival(){this.tone(310,.06,'triangle',.16,80);this.tone(440,.05,'triangle',.12,30,.06)},
    page(){this.tone(250,.035,'triangle',.08,70)},
    compare(ok){if(ok){this.tone(760,.07,'sine',.2,220);this.tone(980,.08,'sine',.16,80,.06)}else this.tone(250,.06,'triangle',.1,40)},
    stamp(approved){this.tone(approved?105:85,.13,'square',.3,-20);this.tone(approved?380:230,.06,'triangle',.12,-80,.03)},
    citation(){this.tone(145,.14,'sawtooth',.28,-55);this.tone(105,.18,'square',.18,-25,.09)},
    coin(){this.tone(740,.055,'sine',.18,110);this.tone(980,.06,'sine',.12,80,.05)},
    gate(){this.tone(90,.25,'sawtooth',.16,-25);this.tone(72,.28,'square',.1,15,.12)},
    death(){this.tone(180,.16,'sawtooth',.24,-110);this.tone(90,.22,'triangle',.16,-35,.1)},
    success(){[520,660,820].forEach((f,i)=>this.tone(f,.11,'triangle',.2,70,i*.07))},
    day(){[390,520,650].forEach((f,i)=>this.tone(f,.1,'triangle',.16,40,i*.07))},
    bell(){this.tone(520,.18,'triangle',.22,-30);this.tone(390,.24,'triangle',.18,-20,.12)},
    question(){this.tone(300,.06,'triangle',.13,120);this.tone(460,.07,'triangle',.1,40,.06)},
    search(){this.tone(210,.05,'square',.1,90);this.tone(340,.07,'triangle',.12,70,.05)},
    detain(){this.tone(92,.18,'square',.25,-20);this.tone(150,.12,'sawtooth',.18,-40,.08)},
    verify(ok=true){this.tone(ok?620:180,.08,ok?'sine':'sawtooth',.17,ok?190:-60);this.tone(ok?880:110,.09,'triangle',.13,ok?90:-30,.06)},
    upgrade(){[430,570,740].forEach((f,i)=>this.tone(f,.085,'triangle',.14,50,i*.055))},
    alert(){this.tone(330,.09,'square',.16,70);this.tone(480,.12,'triangle',.14,120,.08)},
    audit(ok=true){this.tone(ok?520:260,.1,ok?'triangle':'square',.16,ok?110:-50);this.tone(ok?760:180,.12,'sine',.13,ok?80:-20,.07)},
    returner(){this.tone(410,.07,'triangle',.12,80);this.tone(610,.08,'sine',.11,60,.05)},
    fired(){[220,170,120].forEach((f,i)=>this.tone(f,.18,'sawtooth',.25,-40,i*.09))}
  };

  const Juice={
    shake:{power:0,time:0,max:.16},flash:{alpha:0,color:'#fff'},particles:[],floats:[],tweens:[],
    addShake(power=8,time=.16){this.shake.power=Math.max(this.shake.power,power);this.shake.time=Math.max(this.shake.time,time);this.shake.max=Math.max(this.shake.max,time)},
    addFlash(color='#fff',alpha=.25){this.flash.color=color;this.flash.alpha=Math.max(this.flash.alpha,alpha)},
    particleBurst(x,y,count=12,o={}){for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),sp=rand(o.speedMin||30,o.speedMax||130);this.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.35,.8),maxLife:.8,size:rand(o.sizeMin||2,o.sizeMax||6),color:o.color||choose(['#e7b653','#b65d47','#f4e3b7','#7b9c67']),gravity:o.gravity??120})}},
    floatText(x,y,text,color='#fff',size=18){this.floats.push({x,y,text,color,size,life:1,maxLife:1})},
    tween(obj,to,d=.2,e=t=>1-(1-t)*(1-t),done=null){const from={};Object.keys(to).forEach(k=>from[k]=obj[k]);this.tweens.push({obj,to,from,d,t:0,e,done})},
    update(dt){if(this.shake.time>0){this.shake.time-=dt;if(this.shake.time<=0)this.shake.power=0}this.flash.alpha=Math.max(0,this.flash.alpha-dt*2.7);for(const p of this.particles){p.life-=dt;p.vy+=p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.18,dt)}this.particles=this.particles.filter(p=>p.life>0);for(const f of this.floats){f.life-=dt;f.y-=34*dt}this.floats=this.floats.filter(f=>f.life>0);for(const tw of this.tweens){tw.t+=dt;const q=clamp(tw.t/tw.d,0,1),z=tw.e(q);Object.keys(tw.to).forEach(k=>tw.obj[k]=lerp(tw.from[k],tw.to[k],z));if(q>=1)tw.finished=true}const d=this.tweens.filter(t=>t.finished);this.tweens=this.tweens.filter(t=>!t.finished);d.forEach(t=>t.done&&t.done())},
    beginCamera(){if(this.shake.power>0){const d=clamp(this.shake.time/this.shake.max,0,1);ctx.save();ctx.translate(rand(-1,1)*this.shake.power*d,rand(-1,1)*this.shake.power*d);return true}return false},
    endCamera(s){if(s)ctx.restore()},
    drawOverlay(){for(const p of this.particles){ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of this.floats){ctx.globalAlpha=clamp(f.life/f.maxLife,0,1);ctx.fillStyle=f.color;ctx.font=`900 ${f.size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;if(this.flash.alpha>0){ctx.globalAlpha=this.flash.alpha;ctx.fillStyle=this.flash.color;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}}
  };

  const UI={
    toastTimer:null,toast(msg,ms=1400){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>e.classList.remove('show'),ms)},
    modal(kicker,title,text,actions=[{label:'OK'}]){const m=document.getElementById('modal'),a=document.getElementById('modalActions');document.getElementById('modalKicker').textContent=kicker||'';document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;a.innerHTML='';actions.forEach(act=>{const b=document.createElement('button');b.textContent=act.label||'OK';b.onclick=()=>{Audio.unlock();Audio.click();m.classList.remove('show');act.onClick&&act.onClick()};a.appendChild(b)});m.classList.add('show')},
    modalOpen(){return document.getElementById('modal').classList.contains('show')},
    toggleDev(force){const p=document.getElementById('devPanel');p.classList.toggle('show',force===undefined?!p.classList.contains('show'):force)},
    telemetry(show){document.getElementById('telemetry').classList.toggle('show',show)}
  };

  const Draw={
    rr(x,y,w,h,r,fill,stroke=null,line=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}},
    text(t,x,y,s=16,c='#fff',a='left',w=700,font='system-ui'){ctx.fillStyle=c;ctx.textAlign=a;ctx.textBaseline='middle';ctx.font=`${w} ${s}px ${font}`;ctx.fillText(t,x,y)},
    circle(x,y,r,fill,stroke=null,line=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}},
    line(x1,y1,x2,y2,c='#fff',w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
  };
  const Scenes={current:null,set(s){this.current?.exit?.();this.current=s;this.current?.enter?.()},update(dt){this.current?.update?.(dt)},draw(){this.current?.draw?.()}};
  let last=performance.now(),timeScale=1,running=false;
  function loop(now){if(!running)return;const raw=Math.min(.05,(now-last)/1000);last=now;Telemetry.tick(raw*1000);const dt=raw*timeScale;Juice.update(dt);Scenes.update(dt);ctx.clearRect(0,0,W,H);const s=Juice.beginCamera();Scenes.draw();Juice.endCamera(s);Juice.drawOverlay();Input.endFrame();updateTelemetry();requestAnimationFrame(loop)}
  function updateTelemetry(){const el=document.getElementById('telemetry');if(!el.classList.contains('show'))return;const d=Telemetry.data;el.textContent=`sessions ${d.sessions}\nruns ${d.runsStarted}\ndays ${d.daysCompleted}\napplicants ${d.applicants}\ncorrect ${d.correct}\ncitations ${d.citations}\nexpeditions ${d.expeditions}\nsurvived ${d.survived}\ndeaths ${d.deaths}\nreturns ${d.returns}\nplay ${(d.playMs/60000).toFixed(1)}m\nparticles ${Juice.particles.length}`}
  function start(scene){Input.init();Telemetry.init();Scenes.set(scene);running=true;last=performance.now();requestAnimationFrame(loop)}
  return{canvas,ctx,W,H,clamp,lerp,rand,irand,choose,shuffle,weightedChoice,mulberry32,Save,Telemetry,Input,Audio,Juice,UI,Draw,Scenes,start,setTimeScale:v=>timeScale=v};
})();

/* =========================================================
   PROJECT GATEKEEPER v7
   ========================================================= */

const Gatekeeper=(()=>{
  const {ctx,Draw}=SGK;
  const DAYS=[
    {name:'GOBLIN WARRENS',subtitle:'A friendly little death-hole.',day:1,minLevel:2,permit:false,guild:false,cert:false,wanted:false,shiftSeconds:105,targetCases:5,priorityPurpose:null,priorityBonus:0,
      threats:['Goblin swarms','Light melee'],regs:['LEVEL 2+ REQUIRED'],advice:['Bring enough damage','A sturdy frontliner helps'],targets:{combat:17,defense:9,healing:2,utility:2},tags:['swarm']},
    {name:'OLD IRON MINES',subtitle:'Now with more traps than floor.',day:2,minLevel:2,permit:true,guild:false,cert:false,wanted:false,shiftSeconds:125,targetCases:6,priorityPurpose:null,priorityBonus:0,
      threats:['Armored goblins','Rusty traps'],regs:['LEVEL 2+ REQUIRED','VALID DUNGEON PERMIT'],advice:['Piercing or blunt damage','Trap utility recommended'],targets:{combat:20,defense:11,healing:3,utility:7},tags:['armor','traps']},
    {name:'POISON MARSH',subtitle:'The air tastes medically concerning.',day:3,minLevel:3,permit:true,guild:true,questRule:true,cert:false,wanted:false,poisonRule:true,shiftSeconds:145,targetCases:6,priorityPurpose:'Rescue Delver',priorityBonus:18,
      threats:['Poison spores','Disease pools'],regs:['LEVEL 3+ REQUIRED','VALID DUNGEON PERMIT','GUILD BADGE MUST MATCH IDENTITY','GUILD BADGES USE ROUND RED SEAL','QUEST CONTRACT MUST MATCH DECLARATION','POISON RESIST OR ANTIDOTE'],advice:['Healing strongly recommended','Utility avoids bog hazards'],targets:{combat:22,defense:12,healing:7,utility:6},tags:['poison','disease']},
    {name:'UNDEAD CRYPT',subtitle:'Please return all borrowed skeletons.',day:4,minLevel:4,permit:true,guild:true,questRule:true,cert:true,wanted:true,banNecro:true,writRule:true,shiftSeconds:165,targetCases:7,priorityPurpose:'Recover Relic',priorityBonus:22,

  function partyValues(party){
    const v={combat:0,defense:0,healing:0,utility:0,holy:false,silver:false,piercing:false,blunt:false,fire:0,poison:0,curse:0,synergies:[],risk:0};
    for(const a of party){const c=CLASS[a.className]||CLASS.Knight,lv=a.level*.72;v.combat+=c.combat+lv+a.weapon.power;v.defense+=c.defense+lv*.45+a.armor.def;v.healing+=c.healing+(a.healingPotions*.7);v.utility+=c.utility+lv*.25+(a.utilityBonus||0);v.holy ||= a.weapon.tag==='holy'||a.className==='Paladin'||a.className==='Cleric';v.silver ||= a.weapon.tag==='silver';v.piercing ||= a.weapon.tag==='piercing';v.blunt ||= a.weapon.tag==='blunt';v.fire+=a.fireRes?1:0;v.poison+=(a.poisonRes||a.antidote)?1:0;v.curse+=a.curseRes||a.className==='Cleric'||a.className==='Paladin'?1:0;if(a.trait==='Clumsy')v.risk+=.06;if(a.trait==='Veteran')v.risk-=.04;}
    const classes=party.map(a=>a.className);
    if(classes.includes('Knight')&&classes.includes('Cleric')){v.defense+=3;v.healing+=2;v.synergies.push('KNIGHT + CLERIC: guarded healing')}
    if(classes.includes('Rogue')&&classes.includes('Ranger')){v.utility+=5;v.synergies.push('ROGUE + RANGER: trap hunters')}
    if(classes.includes('Mage')&&classes.includes('Scholar')){v.utility+=4;v.combat+=2;v.synergies.push('MAGE + SCHOLAR: arcane insight')}
    if(classes.includes('Barbarian')&&classes.includes('Cleric')){v.combat+=3;v.healing-=1;v.synergies.push('BARBARIAN + CLERIC: reckless momentum')}
    if(classes.includes('Paladin')&&classes.some(x=>x==='Cleric')){v.combat+=2;v.defense+=2;v.synergies.push('HOLY PAIR: undead specialists')}
    if(classes.includes('Engineer')&&classes.includes('Knight')){v.defense+=2;v.utility+=2;v.synergies.push('ENGINEER + KNIGHT: reinforced front')}
    return v;
  }
  function partyForecast(party,candidate=null){
    const d=DAYS[state.day-1],projected=candidate&&party.length<3?[...party,candidate]:[...party],v=partyValues(projected);
    const ratios={combat:v.combat/d.targets.combat,defense:v.defense/d.targets.defense,healing:v.healing/d.targets.healing,utility:v.utility/d.targets.utility};
    const needs=[];if(ratios.combat<.92)needs.push('COMBAT');if(ratios.defense<.92)needs.push('DEFENSE');if(ratios.healing<.92)needs.push('HEALING');if(ratios.utility<.92)needs.push('UTILITY');
    if(d.tags.includes('poison')&&v.poison===0)needs.push('POISON PREP');if(d.tags.includes('fire')&&v.fire===0&&v.healing<d.targets.healing)needs.push('FIRE PREP');if(d.tags.includes('armor')&&!(v.piercing||v.blunt))needs.push('ARMOR BREAK');if(d.tags.includes('undead')&&!(v.holy||v.silver))needs.push('HOLY/SILVER');
    const priorityReady=!!(d.priorityPurpose&&projected.some(a=>a.contractProvided&&a.contractPurpose===d.priorityPurpose));
    return{projected,v,ratios,needs:[...new Set(needs)],priorityReady,synergy:v.synergies[0]||''};
  }
  function startExpedition(forceDanger=false,forceRelic=false){
    if(state.ended)return;mode='expedition';expTimer=0;SGK.Telemetry.inc('expeditions');state.stats.parties++;state.dayStats.parties++;state.completedExpeditions++;const day=DAYS[state.day-1];const party=[...state.party];const v=partyValues(party);const events=[];const priorityMatched=!!(day.priorityPurpose&&party.some(a=>a.contractProvided&&a.contractPurpose===day.priorityPurpose));if(day.priorityPurpose)events.push({good:priorityMatched,text:priorityMatched?`Priority contract covered: ${day.priorityPurpose}.`:`No ${day.priorityPurpose} contract in this party.`});
    const checks=[];
    function add(label,value,target,bonus=0){const ratio=(value+bonus)/target;checks.push({label,value,target,ratio,pass:ratio>=.92})}
    add('COMBAT',v.combat,day.targets.combat);add('DEFENSE',v.defense,day.targets.defense);add('HEALING',v.healing,day.targets.healing);add('UTILITY',v.utility,day.targets.utility);
    let hazardBonus=0;
    if(day.tags.includes('poison')&&v.poison===0){hazardBonus-=.18;events.push({good:false,text:'Poison spores overwhelm the unprotected party.'})}else if(day.tags.includes('poison'))events.push({good:true,text:'Poison protection holds.'});
    if(day.tags.includes('fire')&&v.fire===0&&v.healing<day.targets.healing){hazardBonus-=.2;events.push({good:false,text:'Fire traps burn through their supplies.'})}else if(day.tags.includes('fire'))events.push({good:true,text:v.fire?'Fire resistance blunts the worst heat.':'Healing keeps the burns under control.'});
    if(day.tags.includes('armor')&&!(v.piercing||v.blunt)){hazardBonus-=.13;events.push({good:false,text:'Armored enemies shrug off weak hits.'})}else if(day.tags.includes('armor'))events.push({good:true,text:'Armor-breaking weapons find openings.'});
    if(day.tags.includes('undead')&&!(v.holy||v.silver)){hazardBonus-=.18;events.push({good:false,text:'The dead refuse to stay dead.'})}else if(day.tags.includes('undead'))events.push({good:true,text:'Holy / silver damage breaks the undead ranks.'});
    if(day.tags.includes('traps')&&v.utility<day.targets.utility*.8){hazardBonus-=.1;events.push({good:false,text:'A trap claims blood before the first fight.'})}else if(day.tags.includes('traps'))events.push({good:true,text:'Scouts catch the worst traps.'});

    const deathReasons=new Map();

      else if(day.tags.includes('poison')&&v.poison===0)reason='Poison Spores';
      else if(day.tags.includes('undead')&&!(v.holy||v.silver))reason='Undead Knight';
      else if(day.tags.includes('traps')&&v.utility<day.targets.utility*.8)reason='Dungeon Trap';

    const priorityPayout=success&&priorityMatched?day.priorityBonus:0;const loot=success?Math.round(55+state.day*24+survivors.length*18+Math.max(0,avg-1)*60+(priorityMatched?day.priorityBonus*1.8:0)+(relic?18:0)):Math.round(12+survivors.length*8);const commission=success?Math.max(12,Math.round(loot*.35)):0;
    expedition={party,v,checks,events,avg,survival,dead,survivors,deathReasons,success,loot,commission,priorityMatched,priorityPayout,relic,feats,cleanBonus:0,relicBonus:0,headline:'',done:false};state.party=[];SGK.Audio.gate();
  }

  function update(dt){

    if(a.className==='Mage'||a.className==='Necromancer'){ctx.fillStyle=a.className==='Necromancer'?'#342342':'#4c4779';ctx.beginPath();ctx.moveTo(-34,-25);ctx.lineTo(6,-70);ctx.lineTo(30,-23);ctx.closePath();ctx.fill();ctx.fillRect(-38,-26,76,9)}
    else if(a.className==='Rogue'){ctx.fillStyle='#3a332c';ctx.beginPath();ctx.arc(0,0,44,Math.PI,Math.PI*2);ctx.lineTo(36,14);ctx.lineTo(-36,14);ctx.closePath();ctx.fill()}
    else if(a.className==='Knight'||a.className==='Paladin'){ctx.fillStyle='#83857d';ctx.beginPath();ctx.arc(0,-4,43,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-43,-7,86,14);ctx.fillStyle='#25231f';for(let x=-22;x<=22;x+=11)ctx.fillRect(x,-8,4,18)}
    else{ctx.fillStyle=hair;ctx.beginPath();ctx.arc(0,-10,37,Math.PI,Math.PI*2);ctx.lineTo(35,3);ctx.quadraticCurveTo(0,-5,-35,3);ctx.closePath();ctx.fill()}
    const eyeY=7,blink=Math.sin(applicantBob*1.9+(a.portraitSeed%31))>.965;if(blink){Draw.line(-18,eyeY,-8,eyeY,'#1e1814',3);Draw.line(8,eyeY,18,eyeY,'#1e1814',3)}else{Draw.circle(-13,eyeY,4,'#1e1814');Draw.circle(13,eyeY,4,'#1e1814')}if(a.trait==='Fearless'){Draw.line(-21,-2,-7,1,'#452f22',3);Draw.line(7,1,21,-2,'#452f22',3)}
    ctx.strokeStyle='#5b3826';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,20,10,a.trait==='Hotheaded'?0:0.15*Math.PI,a.trait==='Hotheaded'?Math.PI:0.85*Math.PI);ctx.stroke();
    if(a.species==='Dwarf'||rng()>.64){ctx.fillStyle=hair;ctx.beginPath();ctx.moveTo(-22,24);ctx.quadraticCurveTo(0,70,22,24);ctx.quadraticCurveTo(0,40,-22,24);ctx.fill()}
    if(rng()>.72){ctx.strokeStyle='#7f4738';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(18,-8);ctx.lineTo(4,26);ctx.stroke()}
    // shoulders / class color
    const cc={Knight:'#6d7374',Cleric:'#b7a76b',Rogue:'#3f4b3a',Ranger:'#587248',Mage:'#5d4d7b',Barbarian:'#7b4134',Paladin:'#b69b5f',Scholar:'#6b5841',Engineer:'#7c6238',Necromancer:'#422e4f'}[a.className]||'#66523f';ctx.fillStyle=cc;ctx.beginPath();ctx.ellipse(0,66,58,28,0,0,Math.PI*2);ctx.fill();ctx.restore()}
  function drawMiniPortrait(a,x,y){ctx.save();ctx.translate(x,y);ctx.scale(.42,.42);drawPortrait(a,0,0,0);ctx.restore()}
  function pickR(r,a){return a[Math.floor(r()*a.length)]}
  function short(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}

  function enter(){resetRun()}
  function dev(cmd){
    if(!state||state.ended)return;
    if(cmd==='fraud'){current=makeApplicant({name:'Bram Stone',className:'Rogue',level:Math.max(3,DAYS[state.day-1].minLevel),forceLegal:false,invalidType:state.day>=2?'nameMismatch':'level',quote:'One extra letter should not matter.'});mode='desk';tab=state.day>=2?1:0;SGK.UI.toast('CAPTURE CASE LOADED')}
    if(cmd==='cleric'){if(state.day<2)state.day=5;state.shiftLeft=DAYS[4].shiftSeconds;current=makeApplicant({name:'Sister Pella',className:'Cleric',level:7,forceLegal:false,invalidType:'expired',quote:'The license expired. My healing did not.'});current.fireRes=true;current.special='STRATEGIC TEMPTATION';mode='desk';tab=1;SGK.UI.toast('STRATEGIC ILLEGAL CASE LOADED')}
    if(cmd==='contraband'){state.day=5;state.shiftLeft=effectiveShiftSeconds(DAYS[4]);current=makeApplicant({name:'Nimble Nan',className:'Rogue',level:6,forceLegal:false,invalidType:'contraband',quote:'My backpack always hums like that.'});mode='desk';tab=2;SGK.UI.toast('SEARCHABLE CONTRABAND CASE LOADED')}
    if(cmd==='alias'){state.day=4;state.shiftLeft=effectiveShiftSeconds(DAYS[3]);current=makeApplicant({name:'Gribble Nix',className:'Rogue',level:5,forceLegal:false,invalidType:'alias',quote:'I shortened my name for dramatic reasons.'});mode='desk';tab=1;SGK.UI.toast('SIGIL / ALIAS CASE LOADED')}
    if(cmd==='missing'){state.day=Math.max(3,state.day);state.shiftLeft=effectiveShiftSeconds(DAYS[state.day-1]);current=makeApplicant({name:'Fenwick Bolt',className:'Engineer',level:5,forceLegal:false,invalidType:'missingContract',quote:'I definitely brought the important paper.'});current.forgottenContract=true;mode='desk';tab=3;SGK.UI.toast('MISSING-DOCUMENT CASE LOADED')}
    if(cmd==='quest'){state.day=Math.max(3,state.day);state.shiftLeft=effectiveShiftSeconds(DAYS[state.day-1]);current=makeApplicant({name:'Lysa Quickstep',className:'Ranger',level:5,forceLegal:false,invalidType:'questPurpose',quote:'I am here for one extremely specific reason.'});current.canCorrectStatement=true;mode='desk';tab=3;SGK.UI.toast('QUEST STATEMENT CASE LOADED')}
    if(cmd==='writ'){state.day=4;state.shiftLeft=effectiveShiftSeconds(DAYS[3]);current=makeApplicant({name:'Lady Ember Vale',className:'Ranger',level:5,forceLegal:false,invalidType:'expired',quote:'The gold seal outranks the red ink.'});current.royalWrit=true;{const c=legalCheck(current,DAYS[3]);current.legal=c.ok;current.illegalReasons=c.reasons;}mode='desk';tab=1;SGK.UI.toast('ROYAL WRIT EXCEPTION LOADED')}
    if(cmd==='circle'){state.day=4;state.shiftLeft=effectiveShiftSeconds(DAYS[3]);state.story.circleRequest={target:'Rook Underhill',action:'APPROVE',reward:35,resolved:false,fulfilled:false,text:'Approve Rook Underhill.'};current=makeApplicant({name:'Rook Underhill',className:'Rogue',level:6,forceLegal:false,invalidType:'wanted',quote:'Wanted posters are basically fan art.'});current.special='WANTED • SEALED NOTE TARGET';mode='desk';tab=0;SGK.UI.toast('SEALED REQUEST TARGET LOADED')}
    if(cmd==='returner'){state.day=Math.max(2,state.day);state.shiftLeft=effectiveShiftSeconds(DAYS[state.day-1]);current=makeApplicant({name:'Fenwick Bolt',className:'Engineer',level:Math.max(4,DAYS[state.day-1].minLevel),forceLegal:true,quote:'I have returned with aggressively valid paperwork.'});current.resubmission=true;current.special='RETURNED — PAPERS CORRECTED';mode='desk';tab=1;SGK.UI.toast('CORRECTED-PAPER RETURN LOADED')}
    if(cmd==='emergency'){state.day=state.day<4?4:state.day;state.shiftLeft=effectiveShiftSeconds(DAYS[state.day-1]);state.pendingEmergency=state.day===5?{type:'firePrep',title:'LAVA SURGE',text:'For the rest of today, every entrant needs FIRE RESISTANCE or at least 2 HEALING POTIONS.'}:{type:'holyEntry',title:'CRYPT SEAL FRACTURED',text:'For the rest of today, every entrant needs HOLY / SILVER gear or a HOLY CLASS.'};showEmergencyNotice()}
    if(cmd==='party'){state.party=[makeApplicant({className:'Knight',level:6,forceLegal:true}),makeApplicant({className:'Cleric',level:6,forceLegal:true}),makeApplicant({className:'Rogue',level:6,forceLegal:true})];startExpedition(false)}
    if(cmd==='danger'){state.party=[makeApplicant({className:'Barbarian',level:DAYS[state.day-1].minLevel,forceLegal:true}),makeApplicant({className:'Barbarian',level:DAYS[state.day-1].minLevel,forceLegal:true}),makeApplicant({className:'Rogue',level:DAYS[state.day-1].minLevel,forceLegal:true})];startExpedition(true)}
    if(cmd==='relic'){const lv=Math.max(6,DAYS[state.day-1].minLevel+2);state.party=[makeApplicant({className:'Rogue',level:lv,forceLegal:true}),makeApplicant({className:'Ranger',level:lv,forceLegal:true}),makeApplicant({className:'Cleric',level:lv,forceLegal:true})];state.party.forEach(a=>{a.utilityBonus=(a.utilityBonus||0)+4;a.fireRes=true;a.poisonRes=true});startExpedition(false,true)}
    if(cmd==='streak'){state.streak=3;state.bestStreak=Math.max(state.bestStreak,3);SGK.UI.toast('CLEAN SEAL STREAK SET TO 3 — NEXT CORRECT RULING PAYS',1800)}
    if(cmd==='nextday'){if(state.day<5){advanceDay()}else completeRun()}
  }
  return{enter,update,draw,dev,get state(){return state},get debug(){return{mode,current,compareRows,compareResult,book,summary,expedition}}};
})();

// UI bindings
const soundBtn=document.getElementById('soundBtn');
function refreshSound(){soundBtn.textContent=SGK.Audio.enabled?'SOUND ON':'SOUND OFF'}refreshSound();
soundBtn.onclick=()=>{SGK.Audio.unlock();SGK.Audio.setEnabled(!SGK.Audio.enabled);refreshSound();SGK.Audio.click()};
document.getElementById('devBtn').onclick=()=>{SGK.Audio.unlock();SGK.Audio.click();SGK.UI.toggleDev()};
document.getElementById('devPanel').onclick=e=>{const cmd=e.target?.dataset?.dev;if(!cmd)return;SGK.Audio.unlock();SGK.Audio.click();if(cmd==='close')SGK.UI.toggleDev(false);else if(cmd==='slow'){slow=!slow;SGK.setTimeScale(slow?.32:1);SGK.UI.toast(slow?'SLOW MOTION ON':'SLOW MOTION OFF')}else if(cmd==='telemetry'){tele=!tele;SGK.UI.telemetry(tele)}else if(cmd==='reset'){SGK.Save.reset();SGK.Telemetry.reset();SGK.UI.toast('LOCAL RECORDS RESET')}else Gatekeeper.dev(cmd)};
let slow=false,tele=false;

SGK.UI.modal('PROTOTYPE #12','PROJECT GATEKEEPER',`You run the desk outside a dangerous fantasy dungeon.\n\n1. Inspect the adventurer before the shift clock runs out.\n2. Compare facts to TODAY'S REGULATIONS.\n3. Question discrepancies; serious fraud can be detained.\n4. APPROVE or REJECT — approved adventurers fill a 3-person party.\n5. The party must actually survive the dungeon.\n6. Process enough cases to pay the gatehouse bills.\n7. Special writs and sealed requests can create lawful exceptions or dangerous temptations.\n8. Rejected applicants may return with corrected papers; later shifts can change rules mid-day.
9. The PARTY FORECAST shows survival needs and how the current applicant would affect them — it never tells you whether their papers are legal.
10. Correct-decision streaks earn Clean Seal commendations; flawless expeditions and relic finds pay extra.\n\nLegal does not always mean smart. Fast does not always mean correct.`,[{label:'OPEN THE GATE',onClick:()=>{SGK.Audio.unlock();SGK.start(Gatekeeper)}}]);
</script>
