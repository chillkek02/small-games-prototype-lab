<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#180d27" />
<title>Project Cauldron v7</title>
<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#app{position:fixed;inset:0;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 12%,#402352 0,#170d24 42%,#09050f 100%)}
#shell{--fit:1;position:relative;flex:0 0 540px;width:540px;height:960px;overflow:hidden;background:#160d21;box-shadow:0 0 0 1px #5b3974,0 26px 90px #000b;transform:scale(var(--fit));transform-origin:center center}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.panel{background:#180c25e8;border:1px solid #69467f;border-radius:14px;box-shadow:0 8px 28px #0008;backdrop-filter:blur(8px)}
.brand{padding:9px 11px;pointer-events:auto;user-select:none;-webkit-user-select:none}.brand b{display:block;font-size:13px;letter-spacing:.08em}.brand small{display:block;margin-top:2px;color:#c9b5d8;font-size:10px}
.stats{padding:8px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;text-align:center}.stat span{display:block;color:#bca9cb;font-size:8px;font-weight:900;letter-spacing:.08em}.stat b{display:block;margin-top:2px;font-size:13px}.stat.gold b{color:var(--gold)}.stat.rep b{color:#ff9eb2}
#orderPanel{position:absolute;z-index:20;left:12px;right:12px;top:70px;min-height:112px;padding:9px 11px;background:linear-gradient(#f5deb5,#e7c792);color:var(--parchInk);border:2px solid #9d6f4b;border-radius:14px;box-shadow:0 8px 25px #0008;pointer-events:none}
#orderTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.customer{font-weight:1000;font-size:12px;letter-spacing:.04em}.drops{font-weight:1000;font-size:11px;color:#6c3a48}.drops.danger{color:#b11e3b;animation:pulse .65s infinite alternate}
#orderNeed{margin-top:5px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:850}.ingredientPip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#3b2450;color:white;border:2px solid #5c3a6e;box-shadow:inset 0 0 0 2px #ffffff18;font-size:9px}.orderProgress{margin-left:auto;font-size:13px}.reward{margin-top:2px;color:#7c5631;font-size:10px;font-weight:900}.orderFooter{margin-top:5px;padding-top:5px;border-top:1px solid #9d6f4b55;display:flex;align-items:center;gap:8px;font-size:9px;font-weight:1000}.streak{color:#8b3c4f;white-space:nowrap}.nextOrder{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#69415b;text-align:right}.nextOrder b{color:#3f2533}.miniNeeds{display:flex;align-items:center;gap:5px;min-width:0}.miniNeed{display:flex;align-items:center;gap:4px;white-space:nowrap}.miniNeed .ingredientPip{width:23px;height:23px;font-size:7px}.orderEmpty{display:grid;place-items:center;min-height:65px;color:#76566b;font-size:12px;font-weight:900}
#controls{position:absolute;z-index:35;left:10px;right:10px;bottom:9px;display:grid;grid-template-columns:1.25fr .9fr .72fr .55fr;gap:7px;pointer-events:none}
.ctrl{pointer-events:auto;min-height:58px;border-radius:13px;border:1px solid #76538e;background:linear-gradient(#422456,#261431);box-shadow:0 8px 24px #0008;padding:7px 8px;font-weight:1000;font-size:11px;letter-spacing:.03em}.ctrl:active{transform:translateY(1px) scale(.99)}.ctrl.primary{background:linear-gradient(#7b3f92,#4a245d);border-color:#b26bc8}.ctrl.ready{box-shadow:0 0 0 2px #8ff0d0,0 8px 24px #0008}.ctrl[disabled]{opacity:.42;filter:saturate(.5)}
#soundBtn{font-size:10px}.tiny{font-size:9px;color:#d8c5e1;display:block;margin-top:2px;font-weight:800}

#choiceModal{position:absolute;z-index:100;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#090510e8;backdrop-filter:blur(5px)}#choiceModal.show{display:flex}
#choiceCard{width:100%;max-width:470px;max-height:92%;overflow:auto;background:linear-gradient(#251431,#140b1c);border:1px solid #76528c;border-radius:20px;padding:17px;box-shadow:0 28px 80px #000d}
#choiceTitle{margin:0;font-size:23px;line-height:1.05}#choiceText{margin:7px 0 13px;color:#cdbbd8;font-size:12px;line-height:1.45;white-space:pre-line}

#devPanel{position:absolute;z-index:90;right:8px;top:166px;width:214px;max-height:69%;overflow:auto;background:#0c0711f5;border:1px solid #79558c;border-radius:13px;padding:9px;display:none;box-shadow:0 18px 45px #000d}#devPanel.show{display:block}#devPanel h3{font-size:10px;margin:0 0 7px;color:#ffd978;letter-spacing:.09em}#devPanel button{width:100%;margin:3px 0;padding:7px 8px;border-radius:9px;border:1px solid #674776;background:#24132e;text-align:left;font-size:9px;font-weight:900}
#telemetry{position:absolute;z-index:85;left:8px;top:166px;display:none;max-width:250px;background:#090510e8;border:1px solid #5e4270;border-radius:10px;padding:8px;color:#d9cbe2;font:9px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none;white-space:pre-wrap}#telemetry.show{display:block}
#qaResult{display:none}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@media (min-width:700px){#shell{border-radius:20px}}
</style>
</head>
<body>
<div id="app"><div id="shell">
<canvas id="game" width="540" height="960" aria-label="Project Cauldron game canvas"></canvas>
<div id="topbar">
  <div class="panel brand"><b>PROJECT CAULDRON <span style="color:#ffd978">v7</span></b><small id="subline">Drop • Merge • Bottle • Gamble</small><small id="dropReadout" style="color:#f2d7ff;font-weight:900;margin-top:3px">DROP DEW • NEXT HERB</small></div>
  <div class="panel stats"><div class="stat"><span>SCORE</span><b id="scoreVal">0</b></div><div class="stat gold"><span>GOLD</span><b id="goldVal">0</b></div><div class="stat rep"><span>REP</span><b id="repVal">3/3</b></div></div>
</div>
<div id="orderPanel"><div class="orderEmpty">Choose a customer order to open the shop.</div></div>
<div id="controls">
  <button class="ctrl primary" id="bottleBtn">BOTTLE<span class="tiny">exact order item</span></button>
  <button class="ctrl" id="ladleBtn" disabled>LADLE<span class="tiny">locked</span></button>
  <button class="ctrl" id="soundBtn">SOUND<span class="tiny">ON</span></button>
  <button class="ctrl" id="helpBtn">HELP<span class="tiny">rules + tips</span></button>
</div>
<div id="toast"></div>
<div id="choiceModal"><div id="choiceCard"><h2 id="choiceTitle"></h2><div id="choiceText"></div><div id="choiceActions"></div></div></div>
<div id="devPanel">
<h3>DEVELOPER / CAPTURE</h3>
<button data-dev="chain">FORCE CHAIN REACTION</button>
<button data-dev="greed">FORCE GREEDY MERGE</button>
<button data-dev="streak">FORCE SERVICE STREAK</button>
<button data-dev="grand">FORCE GRAND TRANSMUTATION</button>
<button data-dev="elixir">NEARLY COMPLETE PHILOSOPHER'S ELIXIR</button>
<button data-dev="royal">FORCE ROYAL CUSTOMER</button>
<button data-dev="rare">FORCE RARE ORDER</button>
<button data-dev="danger">FILL CAULDRON NEAR DANGER</button>
<button data-dev="ladle">GIVE MAGIC LADLE</button>
<button data-dev="late">JUMP TO LATE RUN</button>
<button data-dev="slow">TOGGLE SLOW MOTION</button>
<button data-dev="telemetry">SHOW TELEMETRY</button>
<button data-dev="reset">RESET RECORDS</button>
<button data-dev="close">CLOSE PANEL</button>
</div>
<div id="telemetry"></div><pre id="qaResult"></pre>
</div></div>
<script>
'use strict';
/* SMALL GAMES KIT v0.1 — adapted for Project Cauldron. */
const SGK=(()=>{
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;

  const Telemetry={data:Save.get('telemetry',{sessions:0,runsStarted:0,restarts:0,immediateRestarts:0,ordersAccepted:0,ordersCompleted:0,ordersFailed:0,merges:0,biggestCombo:0,highestTier:1,deaths:0,playMs:0,drops:0,bottles:0,overflowDeaths:0,reputationDeaths:0,runsCompleted:0,totalRunMs:0}),runStart:0,
    init(){this.data.sessions++;this.persist()},startRun(){this.data.runsStarted++;this.runStart=performance.now();this.persist()},bump(k,n=1){this.data[k]=(this.data[k]||0)+n;this.persist()},max(k,v){this.data[k]=Math.max(this.data[k]||0,v);this.persist()},tick(ms){this.data.playMs+=ms},persist(){Save.set('telemetry',this.data)},reset(){this.data={sessions:1,runsStarted:0,restarts:0,immediateRestarts:0,ordersAccepted:0,ordersCompleted:0,ordersFailed:0,merges:0,biggestCombo:0,highestTier:1,deaths:0,playMs:0,drops:0,bottles:0,overflowDeaths:0,reputationDeaths:0,runsCompleted:0,totalRunMs:0};this.persist()}};

,restart(){this.tone(270,.08,'triangle',.18,180)}};
  const Juice={shake:{p:0,t:0},flash:{a:0,c:'#fff'},particles:[],floats:[],tweens:[],addShake(p=6,t=.15){this.shake.p=Math.max(this.shake.p,p);this.shake.t=Math.max(this.shake.t,t)},addFlash(c='#fff',a=.2){this.flash.c=c;this.flash.a=Math.max(this.flash.a,a)},particleBurst(x,y,count=12,o={}){for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(o.speedMin||35,o.speedMax||140);this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.8),max:.8,size:rand(o.sizeMin||2,o.sizeMax||6),c:o.color||choose(['#ffd978','#9ff0da','#cf8cff','#fff4cf']),g:o.gravity??100})}},floatText(x,y,text,c='#fff',size=18){this.floats.push({x,y,text,c,size,life:1,max:1})},tween(obj,to,d=.2,e=t=>1-(1-t)*(1-t),done=null){const from={};Object.keys(to).forEach(k=>from[k]=obj[k]);this.tweens.push({obj,to,from,d,t:0,e,done})},update(dt){if(this.shake.t>0){this.shake.t-=dt;if(this.shake.t<=0)this.shake.p=0}this.flash.a=Math.max(0,this.flash.a-dt*2.8);for(const p of this.particles){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.16,dt)}this.particles=this.particles.filter(p=>p.life>0);for(const f of this.floats){f.life-=dt;f.y-=34*dt}this.floats=this.floats.filter(f=>f.life>0);for(const tw of this.tweens){tw.t+=dt;const q=clamp(tw.t/tw.d,0,1),z=tw.e(q);Object.keys(tw.to).forEach(k=>tw.obj[k]=lerp(tw.from[k],tw.to[k],z));if(q>=1)tw.finished=true}const d=this.tweens.filter(t=>t.finished);this.tweens=this.tweens.filter(t=>!t.finished);d.forEach(t=>t.done?.())},begin(){if(this.shake.p>0){ctx.save();const d=clamp(this.shake.t/.16,0,1);ctx.translate(rand(-1,1)*this.shake.p*d,rand(-1,1)*this.shake.p*d);return true}return false},end(s){if(s)ctx.restore()},draw(){for(const p of this.particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of this.floats){ctx.globalAlpha=clamp(f.life/f.max,0,1);ctx.fillStyle=f.c;ctx.font=`1000 ${f.size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;if(this.flash.a>0){ctx.globalAlpha=this.flash.a;ctx.fillStyle=this.flash.c;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}}};
  const UI={toastTimer:null,toast(msg,ms=1200){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('showToast');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>e.classList.remove('showToast'),ms)},choices(title,text,cards){const m=document.getElementById('choiceModal'),a=document.getElementById('choiceActions');document.getElementById('choiceTitle').textContent=title;document.getElementById('choiceText').textContent=text||'';a.innerHTML='';cards.forEach(card=>{const b=document.createElement('button');b.className='choice'+(card.gold?' gold':'');b.innerHTML=`<strong>${card.title}</strong>${card.body?`<small>${card.body}</small>`:''}`;b.onclick=()=>{Audio.unlock();Audio.accept();if(card.close!==false)m.classList.remove('show');card.onClick?.()};a.appendChild(b)});m.classList.add('show')},closeChoices(){document.getElementById('choiceModal').classList.remove('show')},toggleDev(v){document.getElementById('devPanel').classList.toggle('show',v===undefined?!document.getElementById('devPanel').classList.contains('show'):v)},telemetry(v){document.getElementById('telemetry').classList.toggle('show',v)}};
  const Draw={circle(x,y,r,fill,stroke=null,line=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}},roundRect(x,y,w,h,r,fill,stroke=null,line=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}},text(s,x,y,size=14,c='#fff',align='left',weight=800){ctx.fillStyle=c;ctx.font=`${weight} ${size}px system-ui`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}};

const CauldronGame=(()=>{
  const {canvas,ctx,W,H,clamp,rand,weightedChoice,Save,Telemetry,Audio,Juice,UI,Draw}=SGK;
  function fitGameToPhone(){const shell=document.getElementById('shell'),app=document.getElementById('app');if(!shell||!app)return;const vv=window.visualViewport;const vw=vv?.width||window.innerWidth||540,vh=vv?.height||window.innerHeight||960;const cs=getComputedStyle(app),px=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0),py=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);const scale=Math.max(.45,Math.min(1,(vw-px)/540,(vh-py)/960));shell.style.setProperty('--fit',scale.toFixed(5))}
  fitGameToPhone();addEventListener('resize',fitGameToPhone,{passive:true});window.visualViewport?.addEventListener('resize',fitGameToPhone,{passive:true});window.visualViewport?.addEventListener('scroll',fitGameToPhone,{passive:true});
  // v3: a steeper size + mass curve makes tiny ingredients useful gap-fillers and
  // late ingredients true board anchors. Density is deliberately tier-scaled.
  const TIERS=[
    {name:'Dew Drop',r:15,d:.82,c:'#7ce7ff',edge:'#d7fbff',value:10,abbr:'DEW'},
    {name:'Moon Herb',r:19,d:.88,c:'#77dc8a',edge:'#d7ffc9',value:25,abbr:'HERB'},
    {name:'Glow Mushroom',r:24,d:.95,c:'#f26acb',edge:'#ffd2f2',value:55,abbr:'GLOW'},
    {name:'Goblin Eye',r:30,d:1.03,c:'#b8e85b',edge:'#efffb7',value:120,abbr:'EYE'},
    {name:'Moonstone',r:37,d:1.13,c:'#83aef2',edge:'#d8e7ff',value:260,abbr:'MOON'},
    {name:'Mana Crystal',r:45,d:1.25,c:'#9b73f8',edge:'#e8dcff',value:560,abbr:'MANA'},
    {name:'Spirit Orb',r:54,d:1.40,c:'#73e4db',edge:'#d4fffb',value:1200,abbr:'ORB'},
