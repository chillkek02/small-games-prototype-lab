<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0810"><meta name="robots" content="noindex,nofollow,noarchive"><title>Project Crown Eater v6</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0810;color:#eef7f5;font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif}#boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;letter-spacing:.12em}small{display:block;color:#8fa9aa;margin-top:8px;letter-spacing:.06em;line-height:1.45}</style></head><body><div id="boot">BOOTING PROJECT CROWN EATER V6…<small>ASSEMBLING PROTOTYPE</small></div><script>(async()=>{try{const cb=Date.now();const files=['source-01.txt','source-02-03.txt'];const parts=await Promise.all(files.map(async file=>{const r=await fetch(file+'?cb='+cb,{cache:'no-store'});if(!r.ok)throw new Error(`Missing ${file}`);return r.text();}));const doc=parts.join('');document.open();document.write(doc);document.close();}catch(error){console.error(error);const boot=document.getElementById('boot');if(boot)boot.innerHTML=`PROTOTYPE COULD NOT BOOT<small>${String(error&&error.message||error)}</small>`;}})();</script></body></html>
