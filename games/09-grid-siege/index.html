<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#100d0a" />
<title>Grid Siege v2 — Final</title>
<style>
  :root{
    --bg:#100d0a;
    --panel:#171d21;
    --panel2:#222a2e;
    --ink:#fff6dc;
    --muted:#b8aa8e;
    --gold:#f3c85b;
    --good:#68d9a2;
    --danger:#ff665c;
    --amber:#f39a44;
    --line:#5a4932;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;background:#080705;color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  }
  #app{
    position:fixed;inset:0;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 15%,#3b2d1f 0,#17110c 42%,#080705 100%);
  }
  #shell{
    position:relative;
    width:min(100vw,540px,calc(100vh * .5625));
    width:min(100vw,540px,calc(100dvh * .5625));
    aspect-ratio:9/16;
    max-width:540px;max-height:960px;
    overflow:hidden;background:#17110c;
    box-shadow:0 0 0 1px #6b5135,0 24px 90px #000d;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  #hud{
    position:absolute;z-index:20;left:9px;right:9px;top:9px;display:grid;
    grid-template-columns:1.35fr .95fr .9fr;gap:6px;pointer-events:none;
  }
  .hudCard{
    min-width:0;height:70px;padding:8px 9px;border-radius:12px;
    border:1px solid #756043;background:linear-gradient(180deg,#211d19ee,#111416ee);
    box-shadow:0 7px 22px #0008,inset 0 1px #ffffff12;backdrop-filter:blur(7px);
  }
  #title{font-weight:950;letter-spacing:.075em;font-size:13px;color:#fff2c9;white-space:nowrap}
  #waveText{font-weight:850;font-size:12px;color:var(--gold);margin-top:5px}
  #threatText{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hudLabel{font-size:9px;letter-spacing:.08em;color:#b9a98b;font-weight:850}
  #health{font-size:18px;font-weight:950;color:#8fe0b3;margin-top:3px;white-space:nowrap}
  #health.low{color:#ff766b;animation:pulseHealth .7s ease-in-out infinite alternate}
  #score{font-size:19px;font-weight:950;color:var(--gold);margin-top:3px;text-align:right;white-space:nowrap}
  #scoreLabel{text-align:right}
  #comboHud{font-size:9px;color:#d9c7a6;text-align:right;margin-top:2px;white-space:nowrap}
  @keyframes pulseHealth{from{filter:brightness(1)}to{filter:brightness(1.55)}}

  #toast{
    position:absolute;z-index:60;left:50%;top:12.5%;transform:translate(-50%,-9px);
    max-width:88%;padding:9px 14px;border-radius:999px;background:#101316ef;border:1px solid #806b48;
    color:#fff4ce;font-weight:950;font-size:11px;letter-spacing:.035em;text-align:center;
    box-shadow:0 10px 26px #0009;opacity:0;pointer-events:none;transition:.18s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #cornerControls{
    position:absolute;z-index:35;left:11px;right:11px;bottom:8px;
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;pointer-events:none;
  }
  #cornerControls .group{display:contents}
  #cornerControls button{width:100%;pointer-events:auto}
  button{
    appearance:none;border:1px solid #6c5a40;background:linear-gradient(180deg,#2d2922,#171a1c);
    color:var(--ink);border-radius:10px;padding:8px 11px;font-weight:900;letter-spacing:.025em;
    box-shadow:0 5px 15px #0007,inset 0 1px #ffffff13;touch-action:manipulation;
  }
  button:active{transform:translateY(1px) scale(.985)}
  .tinyBtn{font-size:9px;padding:7px 9px;opacity:.9}

  #devPanel{
    position:absolute;z-index:90;right:8px;bottom:44px;width:222px;padding:10px;display:none;
    background:#0e1114f5;border:1px solid #7c6748;border-radius:13px;box-shadow:0 20px 55px #000d;
  }
  #devPanel.show{display:block}
  #devPanel h3{font-size:10px;margin:0 0 7px;color:var(--gold);letter-spacing:.1em}
  #devPanel button{width:100%;font-size:10px;padding:7px 8px;margin:3px 0;text-align:left}

  #telemetry{
    position:absolute;z-index:85;left:8px;top:84px;display:none;pointer-events:none;white-space:pre;
    padding:8px;border-radius:9px;border:1px solid #745f42;background:#080b0de8;color:#d6c7a9;
    font:9px/1.42 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 8px 22px #0008;
  }
  #telemetry.show{display:block}

  #modal{
    position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;
    padding:18px;background:radial-gradient(circle at 50% 42%,#241c14dd,#050403ef);
  }
  #modal.show{display:flex}
  #modalCard{
    width:100%;max-width:470px;max-height:calc(100% - 8px);overflow-y:auto;padding:19px;border-radius:18px;border:1px solid #8b734d;
    background:
      linear-gradient(135deg,#2f271c 0,#17191a 50%,#111315 100%);
    box-shadow:0 30px 90px #000e,inset 0 1px #fff2c020;
  }
  #modalCard h2{margin:0 0 8px;font-size:25px;line-height:1.02;color:#fff0bd;letter-spacing:.025em}
  #modalCard p{margin:0;color:#d1c3a8;line-height:1.48;font-size:13px;white-space:pre-line}
  #modalStats{display:none;margin-top:13px;padding:10px;border-radius:11px;background:#0d1113a8;border:1px solid #4f493b;color:#e9ddc3;font-size:11px;line-height:1.55;white-space:pre-line}
  #modalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
  #modalActions>button{flex:1;min-width:120px}
  #upgradeChoices{display:none;grid-template-columns:1fr;gap:8px;margin-top:14px}
  .upgradeCard{
    width:100%;padding:12px 13px;text-align:left;border-radius:13px;border:1px solid #8b734d;
    background:linear-gradient(135deg,#4b3b26,#232321 70%);color:#fff5d7;
  }
  .upgradeCard strong{display:block;font-size:13px;letter-spacing:.055em;color:#ffd866;margin-bottom:4px}
  .upgradeCard span{display:block;font-size:11px;line-height:1.35;color:#e2d4ba;font-weight:650;letter-spacing:0}
  .upgradeCard:active{border-color:#f2ca62;background:linear-gradient(135deg,#5f4a2d,#2a2924 70%)}

  @media (min-width:700px){
    #shell{border-radius:19px}
    #devPanel{right:12px}
  }
  @media (max-height:620px) and (orientation:landscape){
    #app{align-items:center}
  }
</style>
</head>
<body>
<div id="app">
  <div id="shell">
    <canvas id="game" width="540" height="960" aria-label="Grid Siege game board"></canvas>

    <div id="hud">
      <div class="hudCard">
        <div id="title">GRID SIEGE • FINAL</div>
        <div id="waveText">WAVE 1 / 10</div>
        <div id="threatText">FORTRESS READY</div>
      </div>
      <div class="hudCard">
        <div class="hudLabel">KEEP HEALTH</div>
        <div id="health">10 / 10</div>
        <div class="hudLabel" id="killHud">0 DEFEATED</div>
      </div>
      <div class="hudCard">
        <div class="hudLabel" id="scoreLabel">SCORE</div>
        <div id="score">0</div>
        <div id="comboHud">NO COMBO</div>
      </div>
    </div>

    <div id="toast"></div>
    <div id="telemetry"></div>

    <div id="cornerControls">
      <div class="group"><button class="tinyBtn" id="soundBtn">SOUND ON</button></div>
      <div class="group"><button class="tinyBtn" id="helpBtn">HOW TO PLAY</button></div>
      <div class="group"><button class="tinyBtn" id="devBtn">CAPTURE</button></div>
    </div>

    <div id="devPanel">
      <h3>GRID SIEGE FINAL — CAPTURE</h3>
      <button data-dev="tutorial">Replay interactive training</button>
      <button data-dev="crossfire">Create near-complete Crossfire</button>
      <button data-dev="multiline">Force a large multi-line setup</button>
      <button data-dev="boss">Jump to Siege Engine</button>
      <button data-dev="formation">Spawn dramatic enemy formation</button>
      <button data-dev="upgrade">Grant a strong upgrade</button>
      <button data-dev="slow">Toggle slow motion</button>
      <button data-dev="telemetry">Hide / show telemetry</button>
      <button data-dev="reset">Reset records + telemetry</button>
      <button data-dev="close">Close panel</button>
    </div>

    <div id="modal">
      <div id="modalCard">
        <h2 id="modalTitle">Grid Siege</h2>
        <p id="modalText"></p>
        <div id="modalStats"></div>
        <div id="upgradeChoices"></div>
        <div id="modalActions"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   SMALL GAMES KIT v0.1 — adapted for GRID SIEGE v2 FINAL
   Self-contained HTML/CSS/JS. No libraries or external assets.
   Preserved systems: responsive shell, input, scene/game loop,
   RNG helpers, weighted choices, rarity helper, localStorage,
   procedural audio, particles, shake, flashes, floating text,
   tweens, HUD/modals/toasts, telemetry, and capture tools.
   ========================================================= */

const SGK = (() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const rand=(a=0,b=1)=>a+Math.random()*(b-a);
  const irand=(a,b)=>Math.floor(rand(a,b+1));
  const choose=arr=>arr[Math.floor(Math.random()*arr.length)];
  const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const weightedChoice=entries=>{
    const valid=entries.filter(e=>e.weight>0);const total=valid.reduce((s,e)=>s+e.weight,0);
    if(!valid.length)return null;let r=Math.random()*total;
    for(const e of valid){r-=e.weight;if(r<=0)return e.value}return valid[valid.length-1].value;
  };
  const rarityRoll=(luck=0)=>weightedChoice([
    {value:'common',weight:60-Math.min(25,luck)},
    {value:'uncommon',weight:25},
    {value:'rare',weight:10+luck*.35},
    {value:'epic',weight:4+luck*.18},
    {value:'legendary',weight:1+luck*.08}
  ]);
  function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};

  const STORAGE_PREFIX='grid_siege_v1_';
  const Save={
    get(key,fallback=null){try{const raw=localStorage.getItem(STORAGE_PREFIX+key);return raw===null?fallback:JSON.parse(raw)}catch{return fallback}},
    set(key,val){try{localStorage.setItem(STORAGE_PREFIX+key,JSON.stringify(val));return true}catch{return false}},
    remove(key){try{localStorage.removeItem(STORAGE_PREFIX+key)}catch{}},
    reset(){try{Object.keys(localStorage).filter(k=>k.startsWith(STORAGE_PREFIX)).forEach(k=>localStorage.removeItem(k))}catch{}}
  };

  const Telemetry={
    data:Save.get('telemetry',{
      sessions:0,runsStarted:0,runsCompleted:0,restarts:0,wins:0,
      lossesHealth:0,lossesNoFit:0,waveTotal:0,crossfires:0,playMs:0,lastRunMs:0
    }),
    runStart:0,lastPersist:0,
    init(){this.data.sessions++;this.persist()},
    startRun(){this.data.runsStarted++;this.runStart=performance.now();this.persist()},
    completeRun(result,wave){
      this.data.runsCompleted++;this.data.waveTotal+=wave;
      if(result==='win')this.data.wins++;
      if(result==='health')this.data.lossesHealth++;
      if(result==='no-fit')this.data.lossesNoFit++;
      if(this.runStart)this.data.lastRunMs=Math.round(performance.now()-this.runStart);
      this.persist();
    },
    restart(){this.data.restarts++;this.persist()},
    crossfire(){this.data.crossfires++;this.persist()},
    tick(ms){this.data.playMs+=ms;this.lastPersist+=ms;if(this.lastPersist>5000){this.lastPersist=0;this.persist()}},
    persist(){Save.set('telemetry',this.data)},
    reset(){this.data={sessions:1,runsStarted:0,runsCompleted:0,restarts:0,wins:0,lossesHealth:0,lossesNoFit:0,waveTotal:0,crossfires:0,playMs:0,lastRunMs:0};this.persist()}
  };

  const Input={
    keys:new Set(),pressed:new Set(),events:[],directions:[],
    pointer:{x:0,y:0,down:false,startX:0,startY:0,startT:0,id:null},
    initialized:false,
    init(){
      if(this.initialized)return;this.initialized=true;
      addEventListener('keydown',e=>{
        const k=e.key.toLowerCase();if(!this.keys.has(k))this.pressed.add(k);this.keys.add(k);
        if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d','enter'].includes(k))e.preventDefault();
        if(k==='`')UI.toggleDev();
        Audio.unlock();
      },{passive:false});
      addEventListener('keyup',e=>this.keys.delete(e.key.toLowerCase()));
      const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
      canvas.addEventListener('pointerdown',e=>{
        const p=pos(e);this.pointer={x:p.x,y:p.y,down:true,startX:p.x,startY:p.y,startT:performance.now(),id:e.pointerId};
        this.events.push({type:'down',x:p.x,y:p.y,pointerType:e.pointerType});Audio.unlock();
        try{canvas.setPointerCapture(e.pointerId)}catch{}
      });
      canvas.addEventListener('pointermove',e=>{
        const p=pos(e);this.pointer.x=p.x;this.pointer.y=p.y;
        this.events.push({type:'move',x:p.x,y:p.y,down:this.pointer.down,pointerType:e.pointerType});
      });
      const finish=e=>{
        const p=pos(e),dx=p.x-this.pointer.startX,dy=p.y-this.pointer.startY,mag=Math.hypot(dx,dy);
        this.events.push({type:'up',x:p.x,y:p.y,dx,dy,moved:mag>=12,pointerType:e.pointerType,duration:performance.now()-this.pointer.startT});
        if(mag>=28){const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');this.directions.push(dir)}
        this.pointer.down=false;
      };
      canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
    },
    consumeEvents(){const a=this.events.splice(0);return a},
    consumeDirection(){
      const map=[['arrowup','w','up'],['arrowdown','s','down'],['arrowleft','a','left'],['arrowright','d','right']];
      for(const [a,b,dir] of map){if(this.pressed.has(a)||this.pressed.has(b)){this.pressed.delete(a);this.pressed.delete(b);return dir}}
      return this.directions.shift()||null;
    },
    wasPressed(k){k=k.toLowerCase();if(this.pressed.has(k)){this.pressed.delete(k);return true}return false},
    endFrame(){this.pressed.clear()}
  };

  const Audio={
    ctx:null,master:null,enabled:Save.get('sound',true),
    unlock(){
      if(!this.ctx){try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.enabled?.18:0;this.master.connect(this.ctx.destination)}catch{}}
      if(this.ctx?.state==='suspended')this.ctx.resume().catch(()=>{});
    },
    setEnabled(v){this.enabled=v;Save.set('sound',v);if(this.master)this.master.gain.value=v?.18:0},
    osc(freq=440,dur=.08,type='sine',vol=.25,slide=0,delay=0,pan=0){
      if(!this.enabled)return;this.unlock();if(!this.ctx)return;
      const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();let out=g;
      o.type=type;o.frequency.setValueAtTime(Math.max(30,freq),t);
      if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      if(this.ctx.createStereoPanner){const p=this.ctx.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);p.connect(this.master)}else g.connect(this.master);
      o.connect(g);o.start(t);o.stop(t+dur+.03);
    },
    noise(dur=.1,vol=.2,filterFreq=500,delay=0){
      if(!this.enabled)return;this.unlock();if(!this.ctx)return;
      const sr=this.ctx.sampleRate,len=Math.max(1,Math.floor(sr*dur)),buf=this.ctx.createBuffer(1,len,sr),data=buf.getChannelData(0);
      for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
      const src=this.ctx.createBufferSource(),filter=this.ctx.createBiquadFilter(),g=this.ctx.createGain(),t=this.ctx.currentTime+delay;
      src.buffer=buf;filter.type='lowpass';filter.frequency.value=filterFreq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      src.connect(filter);filter.connect(g);g.connect(this.master);src.start(t);src.stop(t+dur+.02);
    },
    select(){this.osc(520,.055,'triangle',.16,120)},
    place(){this.osc(145,.07,'square',.18,-35);this.noise(.07,.08,420)},
    invalid(){this.osc(150,.11,'sawtooth',.17,-55)},
    clear(){this.osc(540,.10,'triangle',.2,250);this.osc(810,.11,'sine',.14,180,.055)},
    cannon(side='W'){const pan=side==='W'?-.75:side==='E'?.75:0;this.osc(92,.18,'sawtooth',.32,-35,0,pan);this.noise(.14,.24,320)},
    ballista(side='N'){const pan=side==='N'?-.12:.12;this.osc(320,.055,'square',.16,-160,0,pan);this.noise(.055,.09,1500)},
    hit(){this.osc(190,.055,'square',.14,-65)},
    defeat(){this.osc(245,.075,'triangle',.16,190);this.noise(.07,.08,900)},
    crossfire(){[440,660,880].forEach((f,i)=>this.osc(f,.17,'triangle',.2,180,i*.04));this.noise(.18,.13,1200,.04)},
    damage(){this.osc(74,.28,'sawtooth',.35,-32);this.noise(.22,.22,220)},
    upgrade(){[480,610,760].forEach((f,i)=>this.osc(f,.13,'triangle',.19,90,i*.07))},
    boss(){this.osc(62,.45,'sawtooth',.34,-18);this.osc(92,.4,'square',.18,-22,.12);this.noise(.4,.18,180)},
    victory(){[520,660,790,1040].forEach((f,i)=>this.osc(f,.2,'triangle',.22,100,i*.09))},
    defeatGame(){this.osc(260,.25,'sawtooth',.2,-150);this.osc(150,.4,'triangle',.22,-70,.18)}
  };

  const Juice={
    shake:{power:0,time:0,max:0},flash:{alpha:0,color:'#fff'},particles:[],floats:[],tweens:[],
    addShake(power=7,time=.16){this.shake.power=Math.max(this.shake.power,power);this.shake.time=Math.max(this.shake.time,time);this.shake.max=Math.max(this.shake.max,time)},
    addFlash(color='#fff',alpha=.25){this.flash.color=color;this.flash.alpha=Math.max(this.flash.alpha,alpha)},
    particleBurst(x,y,count=12,opts={}){
      for(let i=0;i<count;i++){const a=rand(opts.angleMin??0,opts.angleMax??Math.PI*2),sp=rand(opts.speedMin||28,opts.speedMax||125);this.particles.push({
        x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(opts.lifeMin||.3,opts.lifeMax||.75),maxLife:opts.lifeMax||.75,
        size:rand(opts.sizeMin||2,opts.sizeMax||5),color:opts.color||choose(['#f3c85b','#68d9a2','#9ed6ff','#fff7df']),gravity:opts.gravity??110,shape:opts.shape||'circle'
      })}
    },
    floatText(x,y,text,color='#fff',size=18,life=1){this.floats.push({x,y,text,color,size,life,maxLife:life})},
    tween(obj,to,duration=.2,ease=t=>1-(1-t)*(1-t),onDone=null){const from={};Object.keys(to).forEach(k=>from[k]=obj[k]);this.tweens.push({obj,from,to,duration,t:0,ease,onDone})},
    update(dt){
      if(this.shake.time>0){this.shake.time-=dt;if(this.shake.time<=0){this.shake.power=0;this.shake.max=0}}
      this.flash.alpha=Math.max(0,this.flash.alpha-dt*2.8);
      for(const p of this.particles){p.life-=dt;p.vy+=p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.12,dt)}
      this.particles=this.particles.filter(p=>p.life>0);
      for(const f of this.floats){f.life-=dt;f.y-=31*dt}this.floats=this.floats.filter(f=>f.life>0);
      for(const tw of this.tweens){tw.t+=dt;const q=clamp(tw.t/tw.duration,0,1),e=tw.ease(q);Object.keys(tw.to).forEach(k=>tw.obj[k]=lerp(tw.from[k],tw.to[k],e));if(q>=1)tw.done=true}
      const done=this.tweens.filter(t=>t.done);this.tweens=this.tweens.filter(t=>!t.done);done.forEach(t=>t.onDone&&t.onDone());
    },
    beginCamera(){
      if(this.shake.power>0){const decay=clamp(this.shake.time/Math.max(.001,this.shake.max),0,1);ctx.save();ctx.translate(rand(-1,1)*this.shake.power*decay,rand(-1,1)*this.shake.power*decay);return true}return false;
    },
    endCamera(saved){if(saved)ctx.restore()},
    drawOverlay(){

  function addShot(side,lane,kind='normal',color=null){

    updateHUD();
  }
  function attackLane(side,lane,baseDamage,source){
    addShot(side,lane,source.crossfire?'crossfire':source.orientation==='row'?'cannon':'ballista');
    for(const e of state.enemies){if(e.dead||!enemyMatches(e,side,lane))continue;let dmg=baseDamage;if(source.orientation==='col'&&state.upgrades.piercing&&isArmored(e))dmg++;

  function resolveAttacks(rows,cols){
    if(!rows.length&&!cols.length)return{lineCount:0,crossfire:false};
    const lineCount=rows.length+cols.length,crossfire=rows.length>0&&cols.length>0;
    let bonus=0;if(lineCount>=3)bonus++;if(state.upgrades.reload&&state.rapidReloadReady){bonus++;state.rapidReloadReady=false;SGK.UI.toast('RAPID RELOAD! +1 DAMAGE')}
    rows.forEach(r=>{
      const lanes=state.upgrades.explosive?[r-1,r,r+1].filter(v=>v>=0&&v<N):[r];
      lanes.forEach(l=>{attackLane('W',l,1+bonus,{orientation:'row'});attackLane('E',l,1+bonus,{orientation:'row'})});
      SGK.Audio.cannon('W');setTimeout(()=>SGK.Audio.cannon('E'),35);
    });
    cols.forEach(c=>{attackLane('N',c,1+bonus,{orientation:'col'});attackLane('S',c,1+bonus,{orientation:'col'});SGK.Audio.ballista('N');setTimeout(()=>SGK.Audio.ballista('S'),28)});
    if(crossfire){
      const extra=1+(state.upgrades.crossfire?1:0);const rowSet=new Set(rows),colSet=new Set(cols);
      for(const e of state.enemies){if(e.dead)continue;const affected=(e.side==='W'||e.side==='E')?(e.type==='boss'?e.lanes.some(l=>rowSet.has(l)):rowSet.has(e.lane)):(e.type==='boss'?e.lanes.some(l=>colSet.has(l)):colSet.has(e.lane));if(affected)damageEnemy(e,extra,`-${extra}`)}

    }

    if(lineCount>=2){SGK.Juice.floatText(BX+BS/2,BY+BS/2+42,`COMBO x${lineCount}`,'#fff0b0',25,1);SGK.Juice.addShake(5+lineCount*1.5,.18)}
    return{lineCount,crossfire};
  }

  function clearLines(rows,cols){
    const clear=new Set();let reclaimed=0;rows.forEach(r=>{for(let c=0;c<N;c++)clear.add(`${r},${c}`);state.sweeps.push({orientation:'row',index:r,t:0,duration:.38})});
    cols.forEach(c=>{for(let r=0;r<N;r++)clear.add(`${r},${c}`);state.sweeps.push({orientation:'col',index:c,t:0,duration:.38})});
    for(const key of clear){const[r,c]=key.split(',').map(Number),cell=state.board[r][c],p=cellCenter(r,c);if(cell?.type==='invader'||cell?.type==='rubble'){reclaimed++;state.score+=35;SGK.Juice.floatText(p.x,p.y,'RECLAIMED','#71e2ad',10,.65)}
      SGK.Juice.particleBurst(p.x,p.y,4,{color:cell?.color||'#f3c85b',speedMin:20,speedMax:80,sizeMin:1,sizeMax:4,gravity:75,shape:'square'});state.board[r][c]=null}

  }

  function placeSelected(r,c){

    for(const[dx,dy]of piece.cells){state.board[r+dy][c+dx]={type:'player',color:piece.color,placedTurn:state.turn}}
    const boardCenter=cellCenter(r,c);
    SGK.Juice.particleBurst(boardCenter.x,boardCenter.y,10,{color:piece.color,speedMin:25,speedMax:90,sizeMin:1,sizeMax:4,gravity:70});SGK.Audio.place();state.score+=piece.size*12;
    piece.used=true;state.selected=-1;state.hover=null;state.previewData=null;state.drag.active=false;state.turn++;

    const completed=detectCompleted();const attack=resolveAttacks(completed.rows,completed.cols);if(attack.lineCount){clearLines(completed.rows,completed.cols);state.chain++;state.score+=state.chain*25}else state.chain=0;
    if(state.training?.active){
      state.enemies=state.enemies.filter(e=>!e.dead);state.training.phase='transition';state.training.timer=1.35;state.training.prompt=state.training.success;
      SGK.Juice.floatText(BX+BS/2,BY+BS/2+54,state.training.success,'#ffe07b',17,1.1);updateHUD();return true;

    updateHUD();

    return true;

  function createEnemy(type,side,lane,distance=SPAWN_DISTANCE){
    const cfg={raider:{hp:1},shield:{hp:2},runner:{hp:1},boss:{hp:8}}[type];
    const e={id:enemyId++,type,side,lane,distance,renderDistance:distance,hp:cfg.hp,maxHp:cfg.hp,dead:false,hitFlash:0,moveClock:0,sprintClock:3,willSprint:false};
    if(type==='boss'){e.lanes=[lane,Math.min(7,lane+1)];e.lane=e.lanes[0];e.distance=6;e.renderDistance=6;e.hp=e.maxHp=8}
    state.enemies.push(e);return e;
  }
  function chooseSpawnSide(exclude=null){const options=SIDES.filter(s=>s!==exclude);return SGK.choose(options)}
  function occupiedSpawnKeys(){return new Set(state.enemies.filter(e=>!e.dead&&e.type!=='boss').map(e=>`${e.side}:${e.lane}:${Math.round(e.distance)}`))}
  function spawnNormal(type=null,side=null,lane=null,distance=SPAWN_DISTANCE){
    side=side||chooseSpawnSide();const occupied=occupiedSpawnKeys();if(lane==null){const candidates=SGK.shuffle([...Array(8).keys()]);lane=candidates.find(l=>!occupied.has(`${side}:${l}:${distance}`))??SGK.irand(0,7)}
    if(!type){const w=state.wave;type=SGK.weightedChoice([{value:'raider',weight:Math.max(2,10-w*.55)},{value:'shield',weight:w>=3?2+w*.23:0},{value:'runner',weight:w>=5?1.2+w*.18:0}])}

      const side=SGK.choose(SIDES),lane=SGK.irand(1,5);createEnemy('boss',side,lane,6);for(let i=0;i<3;i++)spawnNormal(null,chooseSpawnSide(side));

    }else{

  function advanceEnemies(){

      if(e.type==='boss'){e.moveClock++;if(e.moveClock>=2){steps=1;e.moveClock=0}}
      else if(e.type==='runner'){steps=1;e.sprintClock--;if(e.sprintClock<=0){steps++;e.sprintClock=3;SGK.Juice.floatText(enemyPosition(e).x,enemyPosition(e).y-18,'SPRINT!','#ffb05a',11,.55)}e.willSprint=e.sprintClock===1}

  function breachCellCandidates(e){
    const lanes=e.type==='boss'?e.lanes:[e.lane],out=[];

    return out;

  function updateEffects(dt){
    state.bannerT=Math.max(0,state.bannerT-dt);for(const e of state.enemies)e.hitFlash=Math.max(0,(e.hitFlash||0)-dt*5);
    for(const side of SIDES)for(let i=0;i<8;i++)state.firePulse[side][i]=Math.max(0,state.firePulse[side][i]-dt*4.5);
    for(const s of state.shots)s.t+=dt;state.shots=state.shots.filter(s=>s.t<s.duration);
    for(const s of state.sweeps)s.t+=dt;state.sweeps=state.sweeps.filter(s=>s.t<s.duration);
    for(const p of state.tray)p.pulse=(p.pulse||0)+dt*3;
    if(state.training?.active&&state.training.phase==='transition'){
      state.training.timer-=dt;if(state.training.timer<=0){if(state.training.stage<2)configureTrainingStage(state.training.stage+1);else finishTraining()}
    }
  }

  }

  function drawTrainingOverlay(){
    const tr=state.training;if(!tr?.active)return;const pulse=1+Math.sin(performance.now()/125)*.07;
    Draw.roundRect(43,153,454,58,13,'#111719f2','#e1b95d',2);Draw.text(`TRAINING ${tr.stage+1} OF 3 • ${tr.name}`,270,169,10,'#ffd96a','center',950);Draw.text(tr.prompt,270,190,12,'#fff2cf','center',850);Draw.text('Enemies do not advance during training.',270,205,7.5,'#9f927c','center',750);
    if(tr.phase==='select'){
      ctx.save();ctx.shadowColor='#ffd65b';ctx.shadowBlur=18;Draw.roundRect(TRAY_X[0]-3,TRAY_Y-8,TRAY_W+6,TRAY_H+12,17,null,'#ffe17a',3);ctx.restore();drawDirectionArrow(TRAY_X[0]+TRAY_W/2,TRAY_Y-20,'S','#ffe17a',pulse);
    }else if(tr.phase==='place'){
      const p=cellCenter(tr.target.r,tr.target.c),x=BX+tr.target.c*CS+1,y=BY+tr.target.r*CS+1;ctx.save();ctx.shadowColor='#73efae';ctx.shadowBlur=18;Draw.roundRect(x,y,CS-2,CS-2,9,null,'#a7ffd0',4);ctx.restore();Draw.circle(p.x,p.y,10*pulse,'#70e0aa38','#b5ffda',2);
    }
  }

  function drawBanner(){
    if(state.bannerT<=0||!state.banner)return;const q=SGK.clamp(state.bannerT/(state.wave===10?2.2:1.2),0,1),alpha=Math.min(1,(1-q)*5,q*4);ctx.globalAlpha=alpha*.95;
    Draw.roundRect(92,113,356,34,10,state.wave===10?'#57291fe8':'#181c1de8',state.wave===10?'#ff9c4f':'#9c8257',2);Draw.text(state.banner,270,130,state.wave===10?20:17,state.wave===10?'#ffd08a':'#ffe8af','center',950);ctx.globalAlpha=1;
  }

  function draw(){
    drawWoodBackground();drawTracks();drawBoard();drawEnemies();drawShots();drawTray();drawActions();drawBanner();drawTrainingOverlay();
    if(state.engineerMode){Draw.roundRect(111,665,318,27,9,'#14352fd9','#70dea9',1.5);Draw.text('FIELD ENGINEER: TAP HOSTILE BOARD CELL',270,679,10,'#a9f4d0','center',950)}
    if(state.health<=3&&!state.ended&&!state.training?.active){ctx.globalAlpha=.11+Math.sin(performance.now()/130)*.035;ctx.strokeStyle='#ff4e46';ctx.lineWidth=9;ctx.strokeRect(4,4,532,952);ctx.globalAlpha=1}
  }

  function update(dt){
    updateEffects(dt);if(SGK.UI.isModalOpen())return;handleKeyboard();for(const ev of SGK.Input.consumeEvents()){if(ev.type==='down')pointerDown(ev);else if(ev.type==='move')pointerMove(ev);else if(ev.type==='up')pointerUp(ev)}
  }

  function setupCrossfire(){
    if(state.ended)startNewRun(true);state.board=Array.from({length:N},()=>Array(N).fill(null));const r=3,c=3;
    for(let x=0;x<N;x++)if(x!==c)state.board[r][x]={type:'player',color:'#4cc8c1'};
    for(let y=0;y<N;y++)if(y!==r)state.board[y][c]={type:'player',color:'#6b9cff'};
    state.tray=[makePiece(SHAPES.find(s=>s.id==='dot')),makePiece(),makePiece()];state.selected=0;state.hover={r,c};state.enemies=[];
    spawnNormal('shield','W',r,2);spawnNormal('raider','E',r,2);spawnNormal('runner','N',c,2);spawnNormal('shield','S',c,2);SGK.UI.toast('CROSSFIRE SETUP READY — PLACE THE SINGLE BLOCK',1900);updateHUD();
  }
  function setupMultiline(){
    if(state.ended)startNewRun(true);state.board=Array.from({length:N},()=>Array(N).fill(null));for(const r of[5,6])for(let c=0;c<6;c++)state.board[r][c]={type:'player',color:r===5?'#ef7f9e':'#f0b94f'};
    state.tray=[makePiece(SHAPES.find(s=>s.id==='square')),makePiece(),makePiece()];state.selected=0;state.hover={r:5,c:6};state.enemies=[];spawnNormal('shield','W',5,2);spawnNormal('raider','E',6,1);spawnNormal('runner','W',6,3);SGK.UI.toast('MULTI-LINE SETUP READY — PLACE THE SQUARE',1900);updateHUD();
  }
  function jumpBoss(){
    if(state.ended)startNewRun(true);state.wave=10;state.enemies=[];state.bossDefeated=false;state.finalTrayCount=0;generateTray();spawnWave();state.paused=false;SGK.UI.hideModal();updateHUD();
  }
  function dramaticFormation(){
    state.enemies=[];for(let lane=0;lane<8;lane+=2){spawnNormal(lane%4===0?'shield':'raider','W',lane,1+(lane%3));spawnNormal(lane%4===0?'runner':'raider','E',7-lane,2+(lane%2));spawnNormal('raider','N',lane,1+(lane%2));spawnNormal('shield','S',7-lane,2)}SGK.UI.toast('DRAMATIC FORMATION SPAWNED');updateHUD();
  }
  function grantUpgrade(){
    const preferred=UPGRADE_POOL.find(u=>u.id==='crossfire'&&!state.upgrades.crossfire)||UPGRADE_POOL.find(u=>!state.upgrades[u.id]);if(!preferred){SGK.UI.toast('ALL UPGRADES ALREADY ACTIVE');return}preferred.apply();SGK.Audio.upgrade();SGK.UI.toast(`${preferred.title} GRANTED`);updateHUD();
  }

  const api={
    enter(){if(SGK.Save.get('seenTrainingV2',false)===true)startNewRun(false);else startTraining(false)},update,draw,
    startNewRun,startTraining,showGuide,placeSelected,selectPiece,ensurePlayableTray,setupCrossfire,setupMultiline,jumpBoss,dramaticFormation,grantUpgrade,
    debug:{
      state:()=>state,
      snapshot:()=>({board:state.board.map(r=>r.map(c=>c?.type||null)),tray:state.tray.map(p=>({id:p.id,used:p.used,cells:p.cells})),wave:state.wave,health:state.health,score:state.score,enemies:state.enemies.map(e=>({...e})),crossfires:state.crossfires,lines:state.lines,perfectWaves:state.perfectWaves,bossDefeated:state.bossDefeated,ended:state.ended,result:state.result,training:state.training?{active:state.training.active,stage:state.training.stage,phase:state.training.phase,target:state.training.target}:null}),
      forecast(id,r,c){const shape=SHAPES.find(s=>s.id===id),f=placementForecast({...shape,used:false},r,c);return{...f,targetIds:[...f.targetIds],killIds:[...f.killIds]}},
      clearBoard(){state.board=Array.from({length:N},()=>Array(N).fill(null))},
      setCell(r,c,type='player'){state.board[r][c]=type?{type,color:'#4cc8c1'}:null},
      setTray(ids){state.tray=ids.map(id=>makePiece(SHAPES.find(s=>s.id===id)));while(state.tray.length<3)state.tray.push(makePiece());state.selected=-1},
      spawn(type,side,lane,distance){return createEnemy(type,side,lane,distance)},
      setHealth(v){state.health=v;updateHUD()},
      loseHealth(){state.health=0;lose('health')},
      forceNoFit(){state.board=Array.from({length:N},()=>Array.from({length:N},()=>({type:'rubble'})));state.board[0][0]=null;state.tray=[makePiece(SHAPES.find(s=>s.id==='square')),makePiece(SHAPES.find(s=>s.id==='quad_h')),makePiece(SHAPES.find(s=>s.id==='tri_v'))];state.fairnessRerolled=true;ensurePlayableTray(false)},
      resolveAttacks,detectCompleted,clearLines,advanceEnemies,resolveBreaches,beginNextWave,win
    }
  };
  return api;
})();

// ---------- Controls / capture tools ----------
let slow=false,tele=false;
const soundBtn=document.getElementById('soundBtn');
function syncSoundButton(){soundBtn.textContent=SGK.Audio.enabled?'SOUND ON':'SOUND OFF'}
syncSoundButton();
soundBtn.onclick=()=>{SGK.Audio.unlock();SGK.Audio.setEnabled(!SGK.Audio.enabled);syncSoundButton();if(SGK.Audio.enabled)SGK.Audio.select()};
document.getElementById('helpBtn').onclick=()=>{SGK.Audio.unlock();SGK.Audio.select();GridSiegeScene.showGuide()};
document.getElementById('devBtn').onclick=()=>{SGK.Audio.unlock();SGK.Audio.select();SGK.UI.toggleDev()};
document.getElementById('devPanel').onclick=e=>{
  const cmd=e.target?.dataset?.dev;if(!cmd)return;SGK.Audio.unlock();SGK.Audio.select();
  if(cmd==='close')SGK.UI.toggleDev(false);
  if(cmd==='tutorial'){GridSiegeScene.startTraining(true);SGK.UI.toggleDev(false)}
  if(cmd==='crossfire'){GridSiegeScene.setupCrossfire();SGK.UI.toggleDev(false)}
  if(cmd==='multiline'){GridSiegeScene.setupMultiline();SGK.UI.toggleDev(false)}
  if(cmd==='boss'){GridSiegeScene.jumpBoss();SGK.UI.toggleDev(false)}
  if(cmd==='formation'){GridSiegeScene.dramaticFormation();SGK.UI.toggleDev(false)}
  if(cmd==='upgrade'){GridSiegeScene.grantUpgrade();SGK.UI.toggleDev(false)}
  if(cmd==='slow'){slow=!slow;SGK.setTimeScale(slow?.3:1);SGK.UI.toast(slow?'SLOW MOTION ON':'SLOW MOTION OFF')}
  if(cmd==='telemetry'){tele=!tele;SGK.UI.telemetry(tele)}
  if(cmd==='reset'){SGK.Save.reset();SGK.Telemetry.reset();SGK.UI.toast('GRID SIEGE RECORDS RESET');syncSoundButton()}
};

window.GridSiege=GridSiegeScene;

SGK.start(GridSiegeScene);
</script>
</body>
