<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071017">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Play Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b0f;color:#eef7f5;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{
  min-height:52px;padding:calc(7px + env(safe-area-inset-top)) 9px 7px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;
  background:#0c1c24;border-bottom:1px solid #2f4a55;box-shadow:0 6px 20px #0008;z-index:2
}
button,a{font:inherit;color:#eef7f5;background:#15313c;border:1px solid #3b5c68;border-radius:10px;padding:8px 10px;text-decoration:none;font-weight:900;touch-action:manipulation}
.title{min-width:0}.title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;font-size:9px;color:#88a2a4;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.actions{display:flex;gap:6px}
#gameFrame{width:100%;height:100%;border:0;background:#071017}
@media(max-width:520px){.bar{min-height:49px}.actions .wide{display:none}.bar button,.bar a{padding:8px}.title b{font-size:13px}}
</style>
</head>
<body>
<header class="bar">
  <a href="index.html" aria-label="Back to Prototype Lab">← LAB</a>
  <div class="title"><b id="title">Prototype</b><span id="subtitle">playtest build</span></div>
  <div class="actions">
    <button id="reloadBtn" class="wide">RELOAD</button>
    <button id="fullBtn">FULLSCREEN</button>
  </div>
</header>
<iframe id="gameFrame" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script src="games.js"></script>
<script>
(()=>{
 const slug=new URLSearchParams(location.search).get('game');
 const game=(window.SMALL_GAMES||[]).find(g=>g.slug===slug);
 const frame=document.getElementById('gameFrame');
 if(!game){document.getElementById('title').textContent='Prototype not found';frame.src='about:blank';return}
 document.title=`${game.title} — Prototype Lab`;
 document.getElementById('title').textContent=game.title;
 document.getElementById('subtitle').textContent=`Prototype #${game.id} · ${game.genre}`;
 frame.src=`games/${game.folder}/index.html`;
 document.getElementById('reloadBtn').onclick=()=>{frame.src=frame.src};
 document.getElementById('fullBtn').onclick=async()=>{
   try{if(frame.requestFullscreen)await frame.requestFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}
 };
})();
</script>
</body>
</html>
